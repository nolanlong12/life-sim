<title>Life Unlimited</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: a single mobile-first app column (max 680px) with a navy top bar, card stack in the middle, and a docked time bar + 5-tab bottom nav. The character creator is a separate full-screen flow with a live preview card. */
:root{
  --bg:#E8F2FF; --bg2:#FFF5E8; --card:#FFFFFF; --card2:#F3F7FF; --ink:#1B2A4A; --muted:#61709A; --line:#DDE6F5;
  --blue:#2F6BFF; --blue-soft:#E3ECFF; --mint:#13AE86; --mint-soft:#DBF6EE; --coral:#F25555; --coral-soft:#FFE5E2;
  --sun:#F0A400; --sun-soft:#FFF1D2; --violet:#7556F5; --violet-soft:#ECE6FF; --teal:#0E9FB0; --teal-soft:#DBF3F6;
  --navy:#14234D; --navy2:#1F3370; --on:#FFFFFF; --av:#D7E6FF; --shadow:0 6px 22px rgba(27,42,74,.08);
  --display:'Baloo 2','Nunito',ui-rounded,system-ui,sans-serif;
  --body:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  --fs:15px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1630; --bg2:#141B33; --card:#172241; --card2:#1C294D; --ink:#EAF0FF; --muted:#9EABCF; --line:#28365C;
  --blue:#7096FF; --blue-soft:#1F2D57; --mint:#3BD7AC; --mint-soft:#143F3A; --coral:#FF7E7E; --coral-soft:#462432;
  --sun:#FFC94D; --sun-soft:#43391F; --violet:#A28BFF; --violet-soft:#2E2758; --teal:#3FCDDC; --teal-soft:#16404A;
  --navy:#0A1226; --navy2:#16224A; --on:#0D1630; --av:#25386B; --shadow:0 6px 22px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1630; --bg2:#141B33; --card:#172241; --card2:#1C294D; --ink:#EAF0FF; --muted:#9EABCF; --line:#28365C;
  --blue:#7096FF; --blue-soft:#1F2D57; --mint:#3BD7AC; --mint-soft:#143F3A; --coral:#FF7E7E; --coral-soft:#462432;
  --sun:#FFC94D; --sun-soft:#43391F; --violet:#A28BFF; --violet-soft:#2E2758; --teal:#3FCDDC; --teal-soft:#16404A;
  --navy:#0A1226; --navy2:#16224A; --on:#0D1630; --av:#25386B; --shadow:0 6px 22px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:var(--fs)}
body{background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed;background-color:var(--bg);color:var(--ink);font:1rem/1.45 var(--body);font-weight:600;-webkit-font-smoothing:antialiased;min-height:100%}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance;font-weight:800}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.reduce *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* colors for icon chips */
.c-blue{--c:var(--blue);--cs:var(--blue-soft)}.c-mint{--c:var(--mint);--cs:var(--mint-soft)}.c-coral{--c:var(--coral);--cs:var(--coral-soft)}
.c-sun{--c:var(--sun);--cs:var(--sun-soft)}.c-violet{--c:var(--violet);--cs:var(--violet-soft)}.c-teal{--c:var(--teal);--cs:var(--teal-soft)}
.ic{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--cs);color:var(--c)}
.ic svg{width:22px;height:22px}
.ic.sm{width:34px;height:34px;border-radius:11px}.ic.sm svg{width:18px;height:18px}
svg.i{width:20px;height:20px;flex:none}

/* app shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--navy);color:#fff;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--navy)}
.top-in{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font:800 22px/1 var(--display);letter-spacing:-.01em}
.logo b{color:#FFC94D}
.logo svg{width:26px;height:26px;color:#FFC94D}
.top .pill{background:rgba(255,255,255,.12);border:0;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;color:#fff;display:flex;align-items:center;gap:6px;cursor:pointer}
.top .pill svg{width:16px;height:16px}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 170px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.pad{padding:16px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sh h2{font-size:20px}
.sh .link{background:none;border:0;color:var(--blue);font-weight:800;font-size:14px;cursor:pointer;padding:4px}
.back{display:flex;align-items:center;gap:6px;background:none;border:0;color:var(--blue);font-weight:800;cursor:pointer;padding:2px 0;font-size:15px}
.back svg{width:18px;height:18px}
.pagehead{display:flex;flex-direction:column;gap:4px}
.pagehead h1{font-size:28px}

/* profile */
.profile{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:16px}
.avatar{width:84px;height:84px;border-radius:50%;overflow:hidden;border:3px solid var(--card);box-shadow:0 0 0 3px var(--blue-soft);grid-row:span 2}
.avatar svg,.av svg{width:100%;height:100%;display:block}
.profile h1{font-size:24px}
.profile .meta{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.profile .meta svg{width:14px;height:14px}
.nw{text-align:right}
.nw b{display:block;font:800 24px/1 var(--display);color:var(--mint)}
.nw b.neg{color:var(--coral)}
.nw span{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;grid-column:2/-1}
.chip{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--cs,var(--card2));color:var(--c,var(--muted))}
@media (max-width:460px){.profile{grid-template-columns:auto minmax(0,1fr)}.avatar{width:68px;height:68px}.nw{grid-column:1/-1;text-align:left;display:flex;align-items:baseline;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}.chips{grid-column:1/-1}}

/* stat meters */
.meters{display:flex;flex-direction:column;gap:10px}
.meter{display:grid;grid-template-columns:22px 92px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:14px}
.meter svg{width:20px;height:20px;color:var(--c)}
.meter .v{text-align:right;color:var(--muted);font-size:13px}
.track{height:10px;border-radius:10px;background:var(--card2);overflow:hidden}
.track i{display:block;height:100%;border-radius:10px;background:var(--c,var(--blue));transition:width .5s ease}
.track.thin{height:7px}

/* grids & rows */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:minmax(0,1fr)}}
.tile{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%}
.tile:hover{border-color:var(--c,var(--blue))}
.tile .t{font-weight:800;font-size:15px}
.tile .d{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.3}
.tile .tx{min-width:0;flex:1}
.tile .chev{width:18px;height:18px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .tx{flex:1;min-width:0}
.row .t{font-weight:800}
.row .d{font-size:13px;color:var(--muted);font-weight:600;margin-top:1px}
.row .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:520px){.row{flex-wrap:wrap}.row .r{width:100%;justify-content:flex-start;padding-left:46px}.row>.av+.tx~.r{padding-left:56px}}
.av{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none;background:var(--av)}
.cost{font-size:12px;color:var(--muted);font-weight:800;white-space:nowrap;display:flex;align-items:center;gap:3px}
.cost .dot{color:var(--blue);letter-spacing:-1px}
.empty{color:var(--muted);font-size:14px;padding:8px 0;font-weight:600}
.note{color:var(--muted);font-size:13.5px;font-weight:600;margin-bottom:6px}
.req{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.req span{font-size:11px;font-weight:800;padding:2px 7px;border-radius:7px;background:var(--mint-soft);color:var(--mint)}
.req span.no{background:var(--coral-soft);color:var(--coral)}

/* buttons */
.btn{border:0;background:var(--blue-soft);color:var(--blue);border-radius:12px;padding:8px 14px;font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){filter:brightness(.96)}
.btn.pri{background:var(--blue);color:var(--on)}
.btn.danger{background:var(--coral-soft);color:var(--coral)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.big{padding:13px 20px;font-size:16px;border-radius:16px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.star{background:none;border:0;cursor:pointer;color:var(--line);padding:4px;display:grid}
.star svg{width:18px;height:18px}
.star.on{color:var(--sun)}.star.on svg{fill:currentColor}
button:focus-visible,input:focus-visible,select:focus-visible,.tile:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--card2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:var(--card);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-weight:800;font-size:14px;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on)}

/* happening */
.happen{display:flex;gap:14px;align-items:flex-start;padding:16px;background:linear-gradient(135deg,var(--blue-soft),var(--card));}
.happen h3{font-size:18px}
.happen p{color:var(--muted);font-size:14px;margin-top:2px}
.happen .btn{margin-top:10px}
.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.quick::-webkit-scrollbar{display:none}
.qa{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;border-radius:14px;background:var(--card);border:1px solid var(--line);cursor:pointer;font-weight:800;font-size:13.5px}
.qa .ic{width:30px;height:30px;border-radius:10px}.qa .ic svg{width:16px;height:16px}
.qa:disabled{opacity:.45;cursor:not-allowed}

/* timeline */
.tl{display:flex;flex-direction:column}
.chapter{font:800 12px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--violet);padding:12px 0 6px;display:flex;align-items:center;gap:8px}
.chapter::after{content:"";flex:1;height:1px;background:var(--line)}
.yr{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;padding:8px 0}
.yr .age{font:800 20px/1 var(--display);color:var(--blue);text-align:center;background:var(--blue-soft);border-radius:12px;padding:8px 0 6px;align-self:start}
.yr .age small{display:block;font:700 10px/1.2 var(--body);color:var(--muted);margin-top:2px}
.yr ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.yr li{font-size:14px;font-weight:600;padding-left:14px;position:relative}
.yr li::before{content:"";position:absolute;left:0;top:.5em;width:7px;height:7px;border-radius:50%;background:var(--line)}
.yr li.g::before{background:var(--mint)}.yr li.b::before{background:var(--coral)}.yr li.m::before{background:var(--sun)}.yr li.a::before{background:var(--violet)}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(27,42,74,.06);
  padding:8px max(12px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(12px,env(safe-area-inset-left,0px))}
.dock-in{max-width:680px;margin:0 auto}
.timebar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 4px 8px}
.pips{display:flex;gap:5px;flex-wrap:wrap}
.pips i{width:13px;height:13px;border-radius:50%;border:2px solid var(--blue)}
.pips i.full{background:var(--blue)}
.timebar small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.ageup{border:0;background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;border-radius:16px;padding:11px 20px;font:800 18px/1 var(--display);cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;box-shadow:0 6px 16px rgba(47,107,255,.3)}
.ageup small{font:800 12px var(--body);opacity:.85}
.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);padding:6px 0 8px}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer;padding:4px 0;position:relative}
.nav button svg{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--blue)}
.nav .badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--coral);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}

/* modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,16,34,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.modal{align-items:center}}
.sheet{background:var(--card);border-radius:24px;width:min(520px,100%);max-height:88vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px;animation:rise .25s ease;position:relative}
@keyframes rise{from{transform:translateY(16px);opacity:.5}to{transform:none;opacity:1}}
.sheet h2{font-size:25px}
.sheet .lead{font-size:16px;font-weight:600}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;border:0;background:var(--blue);color:var(--on);border-radius:16px;padding:13px 16px;font-weight:800;cursor:pointer;font-size:15px}
.choice small{display:block;font-weight:600;opacity:.85;margin-top:2px;font-size:12.5px}
.choice.alt{background:var(--card2);color:var(--ink)}
.choice:hover:not(:disabled){filter:brightness(1.07)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.result{padding:14px 16px;border-radius:16px;background:var(--card2);font-size:16px;border-left:5px solid var(--blue)}
.result.g{border-left-color:var(--mint)}.result.b{border-left-color:var(--coral)}.result.m{border-left-color:var(--sun)}.result.a{border-left-color:var(--violet)}
.deltas{display:flex;flex-wrap:wrap;gap:6px}
.dl{font-size:12.5px;font-weight:900;padding:4px 9px;border-radius:999px;background:var(--mint-soft);color:var(--mint)}
.dl.neg{background:var(--coral-soft);color:var(--coral)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.cele{text-align:center;align-items:center;overflow:hidden}
.cele .ic{width:72px;height:72px;border-radius:24px}.cele .ic svg{width:38px;height:38px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:3px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(560px) rotate(540deg);opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--navy);color:#fff;padding:12px 16px;border-radius:16px;font-size:14px;max-width:min(520px,calc(100% - 32px));box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:8px}
.toast .deltas .dl{background:rgba(255,255,255,.14);color:#7CF0C8}.toast .deltas .dl.neg{color:#FFB0B0}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:800;color:var(--muted);min-width:0}
.field input[type=text],.field input[type=number],.field select,.search input{font-size:15px;font-weight:700;color:var(--ink);background:var(--card2);border:2px solid transparent;border-radius:12px;padding:10px 12px;min-width:0;width:100%}
.field input:focus,.field select:focus,.search input:focus{border-color:var(--blue);outline:none}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:460px){.form{grid-template-columns:minmax(0,1fr)}}
.inrow{display:flex;gap:6px}
.inrow input{flex:1}
.dice{border:0;background:var(--violet-soft);color:var(--violet);border-radius:12px;width:44px;display:grid;place-items:center;cursor:pointer;flex:none}
.dice svg{width:18px;height:18px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:7px 12px;font-weight:800;font-size:13.5px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt svg{width:14px;height:14px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--blue)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search input{padding-left:38px;background:var(--card);border:1px solid var(--line)}
input[type=range]{width:100%;accent-color:var(--blue)}
.slider{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px 10px;align-items:center}
.slider .lab{font-size:13px;font-weight:800;color:var(--muted)}
.slider .lab:nth-child(2){text-align:right}
.slider .lab.on{color:var(--blue)}
.slider input{grid-column:1/-1}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:10px;border:0;background:var(--blue-soft);color:var(--blue);font-weight:900;font-size:18px;cursor:pointer;display:grid;place-items:center}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper b{min-width:30px;text-align:center;font-size:16px}
.info{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px;display:inline-grid}
.info svg{width:15px;height:15px}
.explain{font-size:13px;color:var(--muted);font-weight:600;background:var(--card2);border-radius:10px;padding:8px 10px;margin-top:6px}

.topact{display:flex;gap:6px;align-items:center;flex:none}
.top .pill{white-space:nowrap}
.skrow .btn{padding:7px 12px;font-size:13px;min-height:0}
.top .pill.new{background:#FFC94D;color:#1a2340}
@media (max-width:400px){.logo{font-size:17px}.logo svg{width:22px;height:22px}.top .pill{padding:6px 10px}}
#pips b{font-family:var(--display);font-size:17px}
.skrow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.skrow:last-child{border-bottom:0}
.skhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.skbar{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.skbar i{display:block;height:100%;border-radius:999px;transition:width .4s}

    if(ts.some(t=>TALENTS[t]&&TALENTS[t].st.includes(k)))mult+=.5;if(ts.includes('none'))mult+=.1;d*=mult;}
  if(DIM<1&&k!=='karma'&&((d>0&&k!=='stress')||(d<0&&k==='stress')))d*=DIM;
  if(k==='stress'&&d>0)d*=1.3-(m.s.resilience/100)*.6;
  if(k==='happy'&&d<0)d*=1.25-(m.s.resilience/100)*.5;
  m.s[k]=Math.round(clamp(m.s[k]+d));}

function reputation(){const m=M(),f=fame(),k=m.s.karma;
  if(m.record>=2||(m.job&&m.job.id==='crew'&&m.job.level>=2))return ['Feared','coral'];

function crInsights(c){const st=Object.entries(c.st).sort((a,b)=>b[1]-a[1]);const top=st.slice(0,3).map(x=>x[0]),low=st.slice(-2).map(x=>x[0]);const f=c.fam;
  const adv=[`Strong ${STATN[top[0]].toLowerCase()} and ${STATN[top[1]].toLowerCase()}`];
  if(c.talent!=='none')adv.push(`${TALENTS[c.talent].n} talent: ${TALENTS[c.talent].d[1].toLowerCase()}`);
  if(['wealthy','ultra'].includes(f.wealth))adv.push('Money and comfort from day one');if(f.env==='supportive')adv.push('A family that has your back');
  if(f.conn)adv.push('Family connections open job doors');if(f.famous)adv.push('A famous name gets you noticed');if(f.biz)adv.push('A family business you could inherit');
  if(c.mode==='rags')adv.push('Hardship builds resilience');
  const chal=[`Lower ${STATN[low[0]].toLowerCase()} and ${STATN[low[1]].toLowerCase()}`];
  if(f.wealth==='poor')chal.push('Money will be tight growing up');if(f.env==='strict')chal.push('High expectations and rules at home');
  if(f.env==='unstable')chal.push('A chaotic home life adds stress');if(f.env==='complicated')chal.push('Family drama will come up');
  if(f.rep==='notorious')chal.push('Your family name raises eyebrows');if(f.expect!=='none')chal.push(`Pressure to ${EXPECT[f.expect]}`);
  if(c.talent==='criminal')chal.push('Trouble finds you more easily');if(['wealthy','ultra'].includes(f.wealth)&&c.mode==='privileged')chal.push('Inheritance disputes and family pressure');
  const G={smarts:'School could come easily, opening doors to medicine or law.',fitness:'Sports could become a real path if you train.',creativity:'A creative career is within reach.',
    looks:'Modeling and acting scouts may notice you.',biz:'You might build a business empire.',tech:'Tech careers are a natural fit.',charisma:'People listen to you; politics is an option.',
    street:'You can read a room, and a bad situation.',social:'You will collect friends wherever you go.',strength:'Physical work and sports suit you.',discipline:'Steady effort will carry you far.',
    confidence:'You will take shots other people pass on.',luck:'Good things may fall into your lap now and then.',resilience:'Setbacks will not keep you down for long.'};
  return {adv,chal,glimpse:`${G[top[0]]} ${G[top[1]]} None of it is guaranteed. What you do with it decides how it goes.`};}

  S.me=me;

  const W=WEALTH[f.wealth].w;const momAge=ri(21,40)+me.age,dadAge=Math.round(clamp(momAge-me.age+ri(-3,6),20,55))+me.age;
  const pb=f.env==='supportive'?[78,96]:f.env==='strict'?[50,72]:f.env==='complicated'?[35,80]:[30,62];
  const mom=person('mother',momAge,{g:'f',last:chance(.6)?me.last:pick(LN),job:f.momJob,cash:ri(...W)/2,bond:ri(...pb),ap:randAp('f')});
  const dad=person('father',dadAge,{g:'m',last:me.last,job:f.dadJob,cash:ri(...W)/2,bond:ri(...pb),ap:randAp('m')});

  if(f.famous)L(`Photographers waited outside the hospital. You already have ${me.followers.toLocaleString()} followers.`,'m');
  if(S.famBiz)L(`Your family runs ${S.famBiz.name}.`);
  if(me.age>=18)S.queue.push({id:'hs_grad',ctx:{}});
  L('Do as many activities as you like, then tap Age up to live the next year.');
  UI.view='home';UI.sub=null;}

function revealSecret(id){const m=M();delete m.flags.secret;
  if(id==='halfsib'){const g=pick(['m','f']);const s=person('sibling',clamp(m.age+ri(-6,6),1,80),{g,bond:ri(25,45)});S.people.push(s);return `Your half-${he(s,'brother','sister','sibling')} is named ${s.first}.`;}
  if(id==='trust'){const x=ri(2,50)*1e4;m.cash+=x;return `The trust holds ${money(x)}.`;}
  if(id==='star'){m.followers+=ri(2e3,2e4);sAdd('creativity',3);return 'A music blog wrote about your family history.';}
  if(id==='adopted'){sAdd('stress',6);sAdd('resilience',4);return 'It explained a lot, and changed nothing about who raised you.';}
  sAdd('resilience',4);return 'It explained some of the tension you remember.';}
function addSibling(bond){const mo=alive('mother')[0],da=alive('father')[0];const g=pick(['m','f']);const b=person('sibling',0,{g,last:M().last,bond,ap:randAp(g,[mo?mo.ap:randAp('f'),da?da.ap:randAp('m')])});S.people.push(b);return b;}
function takeFamBiz(){const f=S.famBiz;if(!f||f.taken)return;f.taken=1;const d=BIZ.find(b=>b.k===f.k);S.biz.push({id:NID++,k:f.k,name:f.name,value:d.cost*f.loc*.9,q:ri(50,70),loc:f.loc,years:ri(10,30),last:0});}
function celebrate(t,d,i='award',c='sun'){S.queue.push({id:'_cele',ctx:{t,d,i,c}});}

/* =========================================================
   people / crime / career helpers
   ========================================================= */
function sentence(y,crime){const m=M();m.prison=y;m.record++;m.c.arrests++;m.flags.jailed=1;m.job=null;m.school=null;if(m.age<18)m.flags.schoolDone=1;
  S.used=maxSlots();sAdd('happy',-20);sAdd('karma',-6);pAdd('optimistic',-3);const p=partner();if(p){p.bond=clamp(p.bond-20);if(chance(.35)){p.rel='ex';L(`${p.first} left you after the conviction.`,'b');}}
  return [`You were sentenced to ${plural(y,'year')} in prison for ${crime}.`,'b'];}
function divorce(p){const m=M();const loss=p.prenup?.1:.5;const take=Math.max(0,(m.cash+S.inv.sav)*loss);const fromCash=Math.min(m.cash,take);m.cash-=fromCash;S.inv.sav=Math.max(0,S.inv.sav-(take-fromCash));
  p.rel='ex';p.bond=15;sAdd('happy',-15);alive('child').forEach(k=>k.bond=clamp(k.bond-8));return [`You and ${p.first} divorced. ${p.prenup?'The prenup held up.':'You split everything down the middle.'}`,'b'];}
function moveTo(i){const m=M();const from=city();m.city=i;S.assets.forEach(a=>a.home=false);if(CITIES[i].c!==from.c)m.flags.movedAbroad=1;m.c.moves++;S.market=genMarket();}
function bizById(id){return S.biz.find(b=>b.id===+id)||S.biz[0]||{name:'your business',value:0,q:50,k:'truck'};}
function BIZDEF(b){return BIZ.find(x=>x.k===b.k);}
function startJob(id){const m=M();m.job={id,level:0,perf:50,years:0,yil:0,raise:1,asked:0,lastInc:0,prevInc:0};if(!m.c.held.includes(id))m.c.held.push(id);m.retired=false;}
function salary(j){const d=JOBS[j.id];if(!d)return 0;if(j.id==='coach')return j.cs?j.cs.sal:0;if(j.id==='politics')return OFFICES[j.level].pay;if(d.special)return j.prevInc||0;
  let base=d.pay[Math.min(j.level,d.pay.length-1)];if(!d.fame&&j.id!=='crew'&&j.id!=='broadcast')base*=payM();
  let s=base*(1+.025*j.yil)*(j.raise||1);if(TECHJOBS.includes(j.id)&&hasT('technical'))s*=1.05;if(d.fame)s*=.6+fame()/100;if(M().age<18||M().school)s*=.45;return Math.round(s);}
function title(){const m=M();if(!m.alive)return 'Deceased';if(m.prison)return 'Inmate';if(sportLabel()&&(!m.job||m.sport.stage==='pro'))return sportLabel();if(m.job)return careerLabel()+(m.age<18||m.school?' (part-time)':'');
  if(m.school)return {elementary:'Elementary student',middle:'Middle schooler',high:'High schooler',college:`${m.school.major} student`,grad:`${m.school.prog} student`}[m.school.stage];
  if(m.retired)return 'Retired';if(S.biz.length)return 'Business owner';if(m.age<2)return 'Baby';if(m.age<5)return 'Toddler';if(m.age<18)return 'Kid';return 'Unemployed';}
function reqList(d){const m=M(),r=d.req,o=[];o.push({t:`Age ${r.age||20}+`,ok:m.age>=(r.age||20)});
  if(r.maxAge)o.push({t:`Age ${r.maxAge} or under`,ok:m.age<=r.maxAge});
  if(r.edu)o.push({t:['','High school','Bachelor’s'][r.edu],ok:m.edu>=r.edu});

   +card(`<div class="list">${GOALS.map(([k,n,i,c])=>{const g=m.goals.find(x=>x.id===k);return row(ich(i,c,1),n,g?(g.done?`Completed in ${g.done}`:'Active goal'):'',g&&g.done?`<span class="chip c-mint">Done</span>`:g?B('Remove','goal',{v:k},{cls:'btn danger'}):B('Add','goal',{v:k},{cls:'btn pri',dis:m.goals.filter(x=>!x.done).length>=3}));}).join('')}</div>`);}
function vRisk(){const m=M();let h=backBtn('actions')+`<div class="pagehead"><h1>Crime & risk</h1><p class="muted">Everything here is fictional. Crime costs karma and relationships, and it can cost you years.</p></div>`;
  if(!m.alive)return h;if(m.prison)return h+card('<p class="empty">Keep your head down and serve your time.</p>');
  h+=card(sh('Crime')+`<div class="list">${CRIMES.filter(c=>m.age>=c.min).map(c=>row(ich('shield','coral',1),c.n,`About ${Math.round(catchP(c)*100)}% chance of getting caught · up to ${plural(c.y,'year')} if convicted${c.smarts?` · needs Smarts ${c.smarts}+`:''}`,costTag(1)+B('Attempt','crime',{id:c.id},{cls:'btn danger',dis:left()<1||(c.smarts&&m.s.smarts<c.smarts)}))).join('')||'<p class="empty">You are too young for this. Good.</p>'}</div>`);
  if(m.age>=18||(m.age>=16&&hasT('criminal')))h+=card(sh('The Ninefold Crew')+(m.job&&m.job.id==='crew'?`<p class="empty">You are a ${JOBS.crew.titles[m.job.level]}. Manage it from Career.</p>`:
    row(ich('users','coral',1),'Join a fictional crime syndicate','Pays well, raises arrest risk every year, wrecks karma',costTag(1)+B('Join','crew',{},{cls:'btn danger',dis:left()<1}))));
  return h;}
function catchP(c){const m=M();return clamp(c.c-(m.s.street-50)/300-(m.s.smarts-50)/600-(PV('cautious')-50)/500-(hasT('criminal')?.08:0)+m.record*.05-luckB()/2,.05,.95);}

/* ---------- Explore ---------- */
function vExplore(){const m=M(),s=UI.sub;if(s&&s.startsWith('place:'))return vPlace(s.slice(6));if(s==='move')return vMove();if(s==='travel')return vTravel();
  const c=city(),E=S.econ;
  let h=`<div class="pagehead"><h1>Explore</h1><p class="muted">${esc(c.n)}, ${esc(c.r)}, ${esc(c.c)} · ${esc(envM().n)}</p></div>`;
  h+=card(sh('Your city')+`<div class="list">${row(ich('pin','teal',1),`${esc(c.n)}, ${esc(c.c)}`,`Cost of living ×${colM().toFixed(2)} · pay ×${payM().toFixed(2)} · people speak ${localLangs().join(' & ')}`,'')}
    ${row(ich('trending',E.state==='recession'?'coral':'mint',1),'Economy',`${E.state==='boom'?'Booming':E.state==='recession'?'In recession':'Stable'} · index fund ${pct(E.lastIdx)} last year · housing ×${E.housing.toFixed(2)}`,'')}</div>`);
  if(m.alive&&!m.prison){h+=`<h2 style="font-size:20px">Around town</h2><div class="grid2">${PLACES.filter(p=>m.age>=p.min).map(p=>tileBtn(p.i,p.c,p.n,p.d,'go',{v:'explore',s:'place:'+p.id})).join('')}</div>`;
    h+=`<div class="grid2">${tileBtn('plane','teal','Travel','Trips near and far','go',{v:'explore',s:'travel'})}${m.age>=18?tileBtn('globe','blue','Move','New city, new country','go',{v:'explore',s:'move'}):''}</div>`;}
  else if(m.prison)h+=card('<p class="empty">The world will still be here when you get out.</p>');
  return h;}
function vPlace(id){const m=M(),p=PLACES.find(x=>x.id===id);if(!p)return vExplore();let h=backBtn('explore')+`<div class="pagehead"><h1>${p.n}</h1><p class="muted">${p.d}. Doing something here might lead to a chance encounter.</p></div>`;
  if(p.acts.length)h+=card(`<div class="list">${p.acts.map(a=>ACTS.find(x=>x.id===a)).filter(a=>a&&m.age>=a.min).map(a=>actRow(a,p.id)).join('')}</div>`);
  if(p.shop){h+=card(sh('Clothing stores')+`<div class="list">${OUTFITS.filter(o=>o.price).map(o=>{const own=m.owned.includes(o.id);return row(`<span class="ic sm" style="background:${o.c}"></span>`,o.n,`Style +${o.s}${own?' · owned':''}`,own?B(m.ap.outfit===o.id?'Wearing':'Wear','wear',{v:o.id},{dis:m.ap.outfit===o.id}):costTag(0,o.price)+B('Buy','buyoutfit',{v:o.id},{cls:'btn pri',dis:m.cash<o.price||m.age<14}));}).join('')}
      ${row(ich('star','violet',1),'Get a makeover','Looks up a little',costTag(1,400)+B('Book','makeover',{},{cls:'btn pri',dis:m.cash<400||left()<1}))}</div>`);}
  if(p.casino)h+=card(sh('Blackjack table')+`<p class="note">Roughly a coin flip, with the house edge. Luck helps a little.</p><div class="btnrow">${[100,1e3,1e4,1e5].map(a=>B(`Bet ${money(a)}`,'gamble',{amt:a},{cls:'btn pri',dis:m.cash<a})).join('')}</div>`);
  return h;}
function vMove(){const m=M(),c=city();
  return backBtn('explore')+`<div class="pagehead"><h1>Move</h1><p class="muted">Moving abroad needs a visa unless you're a citizen. A degree, a job, money, and speaking the language all help.</p></div>`
   +card(sh('Neighborhood type')+`<div class="opts">${Object.entries(ENV).map(([k,e])=>`<button class="opt" data-a="setenv" data-v="${k}" aria-pressed="${m.env===k}" ${(left()<1||m.cash<2000)&&m.env!==k?'disabled':''}>${e.n}</button>`).join('')}</div><p class="note" style="margin-top:8px">Changing neighborhoods takes a time block and $2K. Smaller places are cheaper, and pay less.</p>`)
   +card(sh('Cities')+`<div class="list">${CITIES.map((x,i)=>{if(i===m.city)return '';const abroad=x.c!==c.c,cit=m.cit.includes(x.c),cost=abroad?8e3:3e3;
     return row(ich('pin',abroad?'violet':'teal',1),x.n,`${x.r}, ${x.c} · living ×${x.col} · pay ×${x.pay}${abroad?(cit?' · you’re a citizen':' · visa needed'):''}`,costTag(1,cost)+B('Move','move',{i},{cls:'btn pri',dis:m.cash<cost||left()<1}));}).join('')}</div>`);}
function vTravel(){const m=M();

/* ---------- Assets ---------- */
function vAssets(){const m=M();const t=UI.atab||'money';
  let h=`<div class="pagehead"><h1>Assets</h1><p class="muted">Net worth ${money(netWorth())}</p></div>
   <div class="tabs">${[['money','Money'],['business','Business'],['property','Property'],['garage','Vehicles & luxury']].map(([k,l])=>`<button data-a="atab" data-v="${k}" aria-pressed="${t===k}">${l}</button>`).join('')}</div>`;
  if(!m.alive)return h+card('<p class="empty">This life has ended.</p>');
  return h+({money:aMoney,business:aBiz,property:aProp,garage:aGarage}[t]||aMoney)();}
function aMoney(){const m=M(),E=S.econ,chg=x=>`<span style="color:var(--${x>=0?'mint':'coral'})">${pct(x)}</span>`;
  let h=`<div class="grid2">${[['Cash',money(m.cash),'dollar','mint'],['Invested',money(S.inv.sav+idxVal()+cryVal()),'trending','blue'],['Debt',money(m.debt),'zap','coral'],['Living costs',money(livingCost())+'/yr','home','sun']].map(([a,b,i,c])=>`<div class="tile c-${c}" style="cursor:default">${ich(i,c,1)}<span class="tx"><span class="d">${a}</span><span class="t num" style="display:block">${b}</span></span></div>`).join('')}</div>`;
  if(m.age<18)return h+card('<p class="empty">You can open bank and brokerage accounts at 18. Until then, your allowance goes straight into cash.</p>');
  const ib=k=>B('Buy 25%','inv',{k,op:'buy',f:.25},{dis:m.cash<10})+B('Buy all','inv',{k,op:'buy',f:1},{dis:m.cash<10})+B('Sell all','inv',{k,op:'sell',f:1},{cls:'btn ghost',dis:!S.inv[k]});
  h+=card(sh('Investments')+`<p class="note">Buying uses a share of your cash. Lumacoin is a fictional cryptocurrency and swings wildly.</p><div class="list">
    ${row(ich('dollar','mint',1),'High-yield savings',`${money(S.inv.sav)} · 3% a year, no risk`,ib('sav'))}
    ${row(ich('trending','blue',1),'Global index fund',`${money(idxVal())} · last year ${chg(E.lastIdx)}`,ib('idx'))}
    ${row(ich('gem','violet',1),'Lumacoin',`${money(cryVal())} · price ${money(E.cry)} · last year ${chg(E.lastCry)}`,ib('cry'))}</div>`);
  h+=card(sh('Debt and loans')+`<div class="list">${row(ich('zap','coral',1),'Pay down debt',`Balance ${money(m.debt)} at 6.5% a year`,B('Pay 25%','debt',{f:.25},{dis:!m.debt||m.cash<1})+B('Pay all','debt',{f:1},{dis:!m.debt||m.cash<1}))}
    ${m.debt>Math.max(5e4,(m.job?salary(m.job):2e4)*3)?row(ich('x','coral',1),'Declare bankruptcy','Wipes your debt, but the bank seizes your property, businesses and investments',B('File','bankrupt',{},{cls:'btn danger'})):''}
    ${row(ich('dollar','sun',1),'Personal loan','Approval depends on your income and existing debt',B('$10K','loan',{amt:1e4})+B('$50K','loan',{amt:5e4})+B('$250K','loan',{amt:25e4}))}</div>`);
  return h;}
function aBiz(){const m=M();let h='';
  h+=card(sh('Your businesses')+(S.biz.length?`<div class="list">${S.biz.map(b=>{const d=BIZDEF(b);return row(ich('briefcase','sun',1),esc(b.name),`${d.n} · ${plural(b.loc,'location')} · worth ${money(b.value)} · last year ${b.last>=0?'+':''}${money(b.last||0)}<div class="req"><span class="${b.q<30?'no':''}">Quality ${b.q}</span></div>`,
      B(`Improve ${money(d.cost*.12)}`,'biz',{id:b.id,op:'improve'},{dis:m.cash<d.cost*.12||left()<1})+B(`Expand ${money(d.cost)}`,'biz',{id:b.id,op:'expand'},{dis:m.cash<d.cost})+B('Sell','biz',{id:b.id,op:'sell'},{cls:'btn danger'}));}).join('')}</div>`:'<p class="empty">You don’t own a business yet.</p>'));
  if(m.age>=18)h+=card(sh('Start a business')+`<p class="note">Your business sense (${m.s.biz}) affects every year’s profit.</p><div class="list">${BIZ.map(d=>row(ich('building','sun',1),d.n,`Typical profit ${money(d.profit)}/yr per location · ${d.vol>=.8?'very risky':d.vol>=.5?'risky':'steady'}`,costTag(1,d.cost)+B('Start','bizstart',{k:d.k},{cls:'btn pri',dis:m.cash<d.cost||left()<1||m.prison}))).join('')}</div>`);
  else h+=card('<p class="empty">You can start a business at 18.</p>');
  return h;}
function aProp(){const m=M();const own=S.assets.filter(a=>a.kind==='prop');let h='';
  h+=card(sh('Your properties')+(own.length?`<div class="list">${own.map(a=>row(ich('home','mint',1),esc(a.name),`${money(a.value)} · ${a.home?'Your home':a.rented?`Rented out · ${money(a.value*a.rent*.75)}/yr`:'Vacant'} · ${esc(a.city)}`,
      (a.home?'':B('Live here','prop',{id:a.id,op:'home'},{dis:a.city!==city().n}))+(a.home?'':B(a.rented?'Stop renting':'Rent out','prop',{id:a.id,op:'rent'}))+B('Sell','sell',{id:a.id},{cls:'btn danger'}))).join('')}</div>`:'<p class="empty">No property yet. A home halves your living costs; rentals pay you every year.</p>'));
  if(m.age<18)return h+card('<p class="empty">You can buy property at 18.</p>');
  h+=card(sh(`For sale in ${esc(city().n)}`)+`<p class="note">Listings change every year and follow the local housing market.</p><div class="list">${S.market.map((x,i)=>row(ich('building','teal',1),x.n,`${money(x.price)} · rents for about ${money(x.price*x.rent*.75)}/yr`,B('Pay cash','buyprop',{i,mode:'cash'},{cls:'btn pri',dis:m.cash<x.price})+B(`Mortgage · ${money(x.price*.2)} down`,'buyprop',{i,mode:'mort'},{dis:m.cash<x.price*.2}))).join('')}</div>`);
  return h;}
function aGarage(){const m=M();const own=S.assets.filter(a=>a.kind!=='prop');let h='';
  h+=card(sh('What you own')+(own.length?`<div class="list">${own.map(a=>row(ich(a.kind==='car'?'car':'gem',a.kind==='car'?'teal':'violet',1),esc(a.name),`${money(a.value)} · ${a.kind==='car'?'Vehicle':a.sub==='collect'?'Collectible':'Luxury'}`,B('Sell','sell',{id:a.id},{cls:'btn danger'}))).join('')}</div>`:'<p class="empty">Nothing yet.</p>'));
  if(m.age<18)return h+card('<p class="empty">You can buy vehicles at 18.</p>');
  h+=card(sh('Vehicles')+`<div class="list">${CARS.map(([n,p])=>row(ich('car','teal',1),n,'Loses value every year',costTag(0,p)+B('Buy','buy',{n,kind:'car'},{cls:'btn pri',dis:m.cash<p}))).join('')}</div>`);
  h+=card(sh('Luxury and collectibles')+`<div class="list">${LUX.map(([n,p,sub])=>row(ich('gem','violet',1),n,sub==='collect'?'May gain or lose value':'Expensive to keep',costTag(0,p)+B('Buy','buy',{n,kind:'lux'},{cls:'btn pri',dis:m.cash<p}))).join('')}</div>`);
  return h;}

/* ---------- More ---------- */
function vMore(){const s=UI.sub;
  if(s==='character')return vCharacter();if(s==='appearance')return vAppearance();if(s==='tree')return vTree();if(s==='ach')return vAch();if(s==='recap')return vRecap();if(s==='stats')return vStatsPage();if(s==='settings')return vSettings();
  return `<div class="pagehead"><h1>More</h1></div>`+card(`<div class="list">${[['user','blue','Character','Attributes, personality, talent','more','character'],['shirt','violet','Appearance & wardrobe','Hair, outfits, accessories','more','appearance'],['target','sun','Personal goals','What you’re working toward','actions','goals'],
    ['tree','violet','Family tree','Generations of your family','more','tree'],['award','sun','Achievements',`${Object.keys(S.ach).length} of ${ACH.length} unlocked`,'more','ach'],['clock','blue','Life recap','Best and worst moments','more','recap'],

   +card(sh('Attributes')+`<p class="note">Tap the info icon to see what each one does.</p><div class="list">${ATTR.map(([k,n,d,i,c])=>{const v=k==='looks'?look():m.s[k];return `<div class="attr c-${c}"><div class="nm">${n}<button class="info" data-a="info" data-k="${k}" aria-label="What does ${n} do?">${icon('info')}</button></div><b class="num">${v}</b><div class="track"><i style="width:${v}%"></i></div>${UI.info===k?`<div class="explain">${d}${k==='looks'&&v!==m.s.looks?` Your style adds ${v-m.s.looks}.`:''}</div>`:''}</div>`;}).join('')}</div>`)
   +card(sh('Personality')+`<p class="note">Traits drift as you make choices. Anything past 70 on either side is a defining trait.</p><div class="list">${PERS.map(([k,a,b])=>{const v=m.pers[k];return `<div class="row"><div class="tx slider"><span class="lab ${v<=30?'on':''}">${b}</span><span class="lab ${v>=70?'on':''}">${a}</span><div class="track thin" style="grid-column:1/-1"><i style="width:${v}%"></i></div></div></div>`;}).join('')}</div>`)
   +card(sh('Talent')+`<div class="list">${tal.map(t=>TALENTS[t]?row(ich(TALENTS[t].i,TALENTS[t].c),TALENTS[t].n,TALENTS[t].d.join(' · '),''):'').join('')}</div>`)
   +card(sh('Background')+`<div class="list">${row(ich('home','mint',1),`${WEALTH[m.bg]?WEALTH[m.bg].n:'Ordinary'} family${m.famousFam?' · famous':''}`,`${(FAMENV[m.famEnv]||FAMENV.supportive).n} home · ${m.rep==='notorious'?'notorious name':m.rep==='respected'?'respected name':'ordinary name'}${m.conn?' · well-connected':''}`,'')}${row(ich('star',reputation()[1],1),'Reputation',reputation()[0],'')}${row(ich('sliders','blue',1),'Mode',MODES[m.mode]?MODES[m.mode].n:'Normal Life','')}</div>`);}
function vAppearance(){const m=M(),a=m.ap;const sw=(k,arr,cur)=>`<div class="opts">${arr.map((x,i)=>`<button class="sw" style="background:${Array.isArray(x)?x[1]:x}" data-a="apset" data-k="${k}" data-v="${i}" aria-pressed="${cur===i}" aria-label="${Array.isArray(x)?x[0]:''}"></button>`).join('')}</div>`;
  const o=(k,v,l,cur)=>`<button class="opt" data-a="apset" data-k="${k}" data-v="${esc(v)}" aria-pressed="${String(cur)===String(v)}">${l}</button>`;

  const outfits=OUTFITS.map(x=>{const own=m.owned.includes(x.id)||(x.unl&&x.unl());
    return own?o('outfit',x.id,`<span style="width:12px;height:12px;border-radius:50%;background:${x.c};display:inline-block"></span>${x.n} · +${x.s}`,a.outfit):lockSpan(x.n,x.price?`${money(x.price)} at the mall`:x.lock);}).join('');
  return backBtn('more')+`<div class="pagehead"><h1>Appearance</h1><p class="muted">Changes are free and take no time. Style adds to your looks.</p></div>`
   +card(`<div style="display:flex;justify-content:center"><div class="avatar" style="width:150px;height:150px">${portrait(a,m.age,m.g,m.s.happy)}</div></div><p class="note" style="text-align:center;margin-top:8px">Looks ${look()} (base ${m.s.looks}, style +${look()-m.s.looks})</p>`)
   +card(sh('Outfits')+`<div class="opts">${outfits}</div>`)
   +card(sh('Accessories')+`<div class="opts">${ACCS.map(x=>(!x.lock||x.unl())?o('acc',x.id,x.n,a.acc):lockSpan(x.n,x.lock)).join('')}</div><div class="opts" style="margin-top:8px"><button class="opt" data-a="apset" data-k="glasses" data-v="${!a.glasses}" aria-pressed="${!!a.glasses}">${a.glasses?icon('check'):''}Glasses</button></div>`)
   +card(sh('Hair')+`<div class="opts">${HAIRS.map(([k,n])=>o('hair',k,n,a.hair)).join('')}</div><div style="margin-top:10px">${sw('hairColor',HAIRC,a.hairColor)}</div>`)
   +(m.age>=16?card(sh('Facial hair')+`<div class="opts">${FACIAL.map(([k,n])=>o('facial',k,n,a.facial)).join('')}</div>`):'');}
function vTree(){const m=M();const nodeOf=(p,me)=>`<button class="node ${me?'me':''} ${p.alive===false?'dead':''}" ${!me&&p.id&&p.alive!==false?`data-a="person" data-id="${p.id}"`:''}><div class="av">${portrait(p.ap,p.age??40,p.g,60)}</div>${esc(p.first||p.name)}<span>${me?'You':p.alive===false?'Died '+(p.died||''):cap(relName(p))}</span></button>`;
  const anc=S.history.filter(x=>x.gen<S.gen).slice(-3);
  let h=backBtn('more')+`<div class="pagehead"><h1>Family tree</h1><p class="muted">Generation ${S.gen} of the ${esc(m.last)} family.</p></div><section class="card pad"><div class="tree">`;
  if(anc.length){h+=`<div class="genlab">Earlier generations</div><div class="gen">${anc.map(x=>`<div class="node dead"><div class="av">${portrait(x.ap||randAp(x.g||'m'),x.age,x.g,60)}</div>${esc(x.name.split(' ')[0])}<span>Gen ${x.gen} · ${x.born}–${x.died}</span></div>`).join('')}</div><div class="vline"></div>`;}
  const par=S.people.filter(p=>['mother','father'].includes(p.rel));if(par.length)h+=`<div class="genlab">Parents</div><div class="gen">${par.map(p=>nodeOf(p)).join('')}</div><div class="vline"></div>`;
  const sibs=S.people.filter(p=>p.rel==='sibling');const sp=S.people.filter(p=>['spouse','fiance','partner'].includes(p.rel)&&p.alive);
  h+=`<div class="genlab">Your generation</div><div class="gen">${sibs.slice(0,3).map(p=>nodeOf(p)).join('')}${nodeOf({...m},true)}${sp.map(p=>nodeOf(p)).join('')}${sibs.slice(3).map(p=>nodeOf(p)).join('')}</div>`;
  const kids=S.people.filter(p=>p.rel==='child');if(kids.length)h+=`<div class="vline"></div><div class="genlab">Children</div><div class="gen">${kids.map(p=>nodeOf(p)).join('')}</div>`;

function addFans(n){const j=M().job,mu=j.mu;if(mu.fy==null)mu.fy=mu.fans;const cap=mu.fy*.8+4000*(1+j.level);n=Math.round(Math.max(0,Math.min(n,cap-(mu.gy||0))));mu.gy=(mu.gy||0)+n;mu.fans+=n;return n;}
function labelReady(){const mu=M().job.mu;const ms=mainSkill(),sw=skv('songwriting');return {ok:ms>=45&&sw>=35&&(mu.fans>=2000||mu.charted),ms,sw};}

   <p class="eyebrow">Genre</p><div class="opts">${MGENRES.map(g=>`<button class="opt" data-a="msset" data-k="genre" data-v="${g}" aria-pressed="${s.genre===g}">${g}</button>`).join('')}</div><div class="btnrow">${B('Start','mstart',{},{cls:'btn pri big'})}${closeBtn()}</div>`);}
H.msset=d=>{UI.ms[d.k]=d.v;openMusicStart();};
H.mstart=()=>{const m=M(),s=UI.ms;if(m.job)L(`You left your job as ${careerLabel()}.`);startJob('music');const j=m.job;j.mu={role:s.role,genre:s.genre,label:null,songs:[],albums:[],fans:Math.round(m.followers*.05),charted:0,band:[],lastAlbum:0};

  closeModal();const t=`You started a music career as a ${MROLES[s.role][0].toLowerCase()}${j.mu.bandName?` in ${j.mu.bandName}`:''}.`;L(t,'g');note(t);render();};
function openSongWrite(){const mu=M().job.mu;UI.sw=UI.sw||{title:songTitle(),st:'bedroom'};const s=UI.sw;
  modal(`<h2>Write & record a song</h2><label class="field">Song title<input type="text" id="swtitle" value="${esc(s.title)}" maxlength="40"></label><p class="eyebrow">Studio</p><div class="choices">${[['bedroom','Bedroom setup','Free · sounds rough'],['home','Home studio','$600 · decent sound'],['pro','Pro studio',mu.label?'Paid by your label':'$8K · polished']].map(([k,l,s2])=>`<button class="choice ${s.st===k?'':'alt'}" data-a="swst" data-v="${k}">${l}<small>${s2}</small></button>`).join('')}</div><div class="btnrow">${B('Record it','swmake',{},{cls:'btn pri big'})}${closeBtn()}</div>`);}

H.swst=d=>{UI.sw.st=d.v;UI.sw.title=$('#swtitle')?$('#swtitle').value:UI.sw.title;openSongWrite();};
H.swmake=()=>{const m=M(),mu=m.job.mu,s=UI.sw;const title=($('#swtitle')?$('#swtitle').value:s.title).trim()||songTitle();const cost=s.st==='home'?600:s.st==='pro'&&!mu.label?8e3:0;if(m.cash<cost){toast('You can’t afford that studio.');return;}
  if(mu.songs.filter(x=>!x.rel).length>=14){toast('You have plenty of unreleased songs. Release some first.');return;}m.cash-=cost;
  S.done=S.done||{};DIM=1/(1+.15*(S.done.song||0));S.done.song=(S.done.song||0)+1;
  const q=Math.round(clamp(skv('songwriting')*.45+mainSkill()*.35+m.s.creativity*.2+({bedroom:-8,home:-2,pro:5}[s.st])+rf(-10,10)));skGain('songwriting',2);musicSkills().forEach(k=>skGain(k,1));DIM=1;
  mu.songs.push({id:NID++,title,q,rel:0});UI.sw=null;closeModal();const t=`You recorded “${title}”. It feels like a ${q>=80?'hit':q>=60?'solid song':'rough draft'}.`;L(t,'g');note(t);render();};
H.msingle=d=>{const m=M(),j=m.job,mu=j.mu,s=mu.songs.find(x=>x.id===+d.id);if(!s||s.rel)return;
  const reach=Math.log10(mu.fans+m.followers*.3+10)+(mu.label?(LABELS_MAJOR.includes(mu.label.name)?1.2:.5):0);const score=s.q*.7+reach*7+rf(-8,8);
  const peak=score>=92?ri(1,5):score>=85?ri(5,25):score>=78?ri(25,60):score>=72?ri(60,100):0;const streams=Math.round(Math.pow(10,reach+1)*(s.q/60)*rf(.5,2));
  const inc=Math.round(streams*.004*(mu.label?mu.label.roy:1));m.cash+=inc;j.lastInc=(j.lastInc||0)+inc;addFans(streams/120+s.q*rf(2,6));m.followers+=Math.round(Math.min(streams/300,mu.fans*.3+1000));
  s.rel=S.year;s.peak=peak;s.streams=streams;if(peak){mu.charted=1;if(peak===1){m.flags.no1=1;celebrate('Number one!',`“${s.title}” hit #1 on the Toasty 100.`,'music','violet');}}
  const t=`“${s.title}” ${peak?`debuted at #${peak} on the Toasty 100`:'didn’t chart'} with ${streams.toLocaleString()} streams. You earned ${money(inc)}.`;L(t,peak?'g':'n');note(t);render();};
H.malbum=()=>{const m=M(),j=m.job,mu=j.mu;const songs=mu.songs.filter(x=>!x.rel).sort((a,b)=>b.q-a.q).slice(0,12);if(songs.length<6){toast('An album needs at least six unreleased songs.');return;}
  const title=songTitle();const q=Math.round(songs.reduce((t,s)=>t+s.q,0)/songs.length);const reach=Math.log10(mu.fans+m.followers*.3+10)+(mu.label?1:0);const score=q*.7+reach*7+rf(-8,8);
  const peak=score>=90?ri(1,5):score>=82?ri(5,40):score>=74?ri(40,120):score>=68?ri(120,200):0;const units=Math.round(Math.pow(10,reach-.3)*(q/60)*rf(.5,2));const inc=Math.round(units*2*(mu.label?mu.label.roy:1));
  m.cash+=inc;j.lastInc=(j.lastInc||0)+inc;addFans(units/2+q*10);songs.forEach(s=>s.rel=S.year);mu.albums.push({title,q,peak,y:S.year,units});mu.lastAlbum=S.year;if(mu.label)mu.label.owed=Math.max(0,mu.label.owed-1);
  const t=`Your album “${title}” ${peak?`debuted at #${peak} on the Billbored 200`:'came out to little fanfare'}. You earned ${money(inc)}.`;L(t,peak&&peak<=10?'g':'n');note(t);
  if(q>=82)S.queue.push({id:'awardshow',ctx:{show:'Golden Gramophones',title,cat:'Album of the Year',sk:'songwriting',flag:'gramophone'}});render();};
H.mgig=d=>{const m=M(),j=m.job,mu=j.mu,v=VENUES[+d.i];if(mu.fans<v[1]){toast(`You need ${v[1].toLowerCase?'':''}${v[1].toLocaleString()} fans for that.`);return;}S.done=S.done||{};if(+d.i>=2&&S.done.tour){toast('You already toured this year.');return;}if(+d.i>=2)S.done.tour=1;
  const stage=skv('stage');const fill=clamp(mu.fans/(Math.max(1,v[1])*2)+.4,.3,1);const inc=Math.round(v[2]*(.5+stage/100)*fill*rf(.7,1.3));m.cash+=inc;j.lastInc=(j.lastInc||0)+inc;skGain('stage',2);
  addFans((v[1]*.06+120)*(.4+stage/60)*rf(.6,1.4));if(+d.i>=2){sAdd('stress',ri(4,10));sAdd('health',-ri(0,4));}

H.mshop=()=>{const m=M(),mu=m.job.mu;const r=labelReady();if(!r.ok){toast('Labels aren’t interested yet.');return;}S.done=S.done||{};if(S.done.shop){toast('You already shopped your demo this year.');return;}S.done.shop=1;
  const big=r.ms>=65&&(mu.fans>=2e4||mu.charted);const offers=[];const n=ri(1,3);for(let i=0;i<n;i++){const major=big&&chance(.6);offers.push({name:pick(major?LABELS_MAJOR:LABELS_INDIE),major,adv:Math.round((major?ri(15,150):ri(1,15))*1e4*(1+mu.fans/1e5)/1e3)*1e3,roy:major?rf(.15,.25):rf(.35,.55),owed:major?ri(2,4):ri(1,2),control:major?pick(['Low','Medium']):'High'});}

   <div class="btnrow" style="margin-top:8px"><button class="opt" data-a="jq" aria-pressed="${!!UI.jq}">${UI.jq?icon('check'):''}Only jobs I qualify for</button></div>
   <p class="note" style="margin-top:8px">${m.school&&m.age<18?'While you are in school you can take part-time work. ':''}Every application includes an interview.${speaksLocal()?'':' You don’t speak the local language, which hurts your odds.'}</p><div id="joblist">${jobListHTML()}</div>`);}
H.jcat=d=>{UI.jcat=d.v;render();};H.jq=()=>{UI.jq=!UI.jq;render();};
function cJob(){const m=M(),j=m.job;let h='';
  if(!j)h+=card(sh('Your job')+`<p class="empty">${m.age<15?'You can start working at 15.':m.retired?"You're retired. You can still take a job.":"You don't have a job right now."}</p>${m.age>=15?B('Find work','ctab',{v:'find'},{cls:'btn pri'}):''}`);

    else{const lvl=Math.min(j.level,d.titles.length-1);const need=promoNeed(d,lvl+1);
      h+=card(`<div class="sh"><h2>${d.titles[lvl]}</h2><span class="badge2">${d.track}</span></div><div class="kv"><span>Salary</span><b>${money(salary(j))}/yr</b><span>Time here</span><b>${plural(j.years,'year')}</b><span>Performance</span><b>${j.perf}</b>${lvl<d.titles.length-1?`<span>Next promotion</span><b>${d.titles[lvl+1]}</b>`:'<span>Ladder</span><b>Top of your field</b>'}</div>${track(j.perf,'mint').replace('width:70px','width:100%;margin-top:8px')}
        <div class="row"><div class="tx"><div class="t">Work effort</div><div class="d">Grinding builds performance but adds stress. Coasting is relaxed but slower.</div></div></div><div>${seg('effort',m.effort,[['coast','Coast'],['normal','Normal'],['grind','Grind']])}</div>
        <div class="btnrow" style="margin-top:12px">${j.id!=='crew'?B('Ask for a raise','raise',{},{dis:j.asked}):''}${B('Quit','quit',{},{cls:'btn danger'})}${m.age>=55?B('Retire','retire'):''}</div>`);
      if(d.key&&lvl<d.titles.length-1)h+=card(sh('Promotion skill')+`<p class="note">${need?`A promotion to ${d.titles[lvl+1]} needs ${SK[d.key][0]} ${need}.`:'Keep performing well.'}</p><div class="list">${skillRow(d.key)}</div>`);
      if(d.ladder!==false)h+=card(sh('Career ladder')+`<div class="list">${d.titles.map((t,i)=>row(`<span class="chip ${i<=lvl?'c-mint':'c-blue'}">${i+1}</span>`,t,`${money(d.pay[i]*(d.fame?1:payM()))}/yr${d.key&&i>0?` · ${SK[d.key][0]} ${promoNeed(d,i)}+`:''}`,i===lvl?'<span class="badge2">You</span>':'')).join('')}</div>`);}}
  const side=ACTS.filter(a=>a.cat==='money'&&actAvail(a));if(side.length)h+=card(sh('Side hustles')+`<div class="list">${side.map(a=>actRow(a)).join('')}</div>`);
  return h;}
function cHistory(){const m=M();const hs=(m.hist||[]).slice().reverse();let h=card(sh('Career history')+(hs.length?`<div class="list">${hs.map(x=>row(ich(x.k==='sport'?'activity':'briefcase',x.k==='sport'?'mint':'blue',1),esc(x.t),`${x.from}–${x.to||'now'}`,'')).join('')}</div>`:'<p class="empty">Nothing yet.</p>'));
  const sp=m.sport;if(sp&&sp.awards.length)h+=card(sh(`${SPORTS[sp.sp].n} honors`)+awardsHTML(sp));
  if(m.pol&&m.pol.history&&m.pol.history.length)h+=card(sh('Elections')+`<div class="list">${m.pol.history.slice().reverse().map(x=>row('',esc(x),'','')).join('')}</div>`);
  if(m.job&&m.job.cs&&m.job.cs.titles.length)h+=card(sh('Coaching honors')+`<div class="list">${m.job.cs.titles.slice().reverse().map(x=>row('',esc(x),'','')).join('')}</div>`);

function vCareer(){const m=M();const tab=UI.ctab||'job';const tabs=[['job','My job'],['find','Find work'],['sports','Sports'],['showbiz','Showbiz'],['politics','Politics'],['coach','Coaching'],['history','History']];
  let h=backBtn('actions')+`<div class="pagehead"><h1>Career</h1><p class="muted">${esc(title())}</p></div><div class="tabs">${tabs.map(([k,l])=>`<button data-a="ctab" data-v="${k}" aria-pressed="${tab===k}">${l}</button>`).join('')}</div>`;
  if(!m.alive)return h+card('<p class="empty">This life has ended.</p>');
  if(m.prison&&tab!=='history')return h+card('<p class="empty">You can’t work on your career from prison. You can still practice some skills.</p>');

H.ctab=d=>{UI.ctab=d.v;if(d.q!=null)UI.jsq=d.q;closeModal();UI.view='actions';UI.sub='career';render();window.scrollTo(0,0);};
function promoNeed(d,lvl){return d.key&&lvl>0?Math.min(95,15+lvl*17):0;}
H.apply=d=>{const m=M(),dj=JOBS[d.id];if(!dj||!jobOk(dj))return;S.applied=S.applied||{};if(S.applied[d.id]===S.year){toast('They already turned you down this year. Try again next year.');return;}
  UI.iv={id:d.id,q:pick(INTERVIEW)};const q=UI.iv.q;
  modal(`<p class="eyebrow">Interview · ${esc(dj.titles[0])}</p><h2>“${esc(q.q)}”</h2><p class="note">${ri(2,9)} other candidates applied.</p><div class="choices">${q.a.map((a,i)=>`<button class="choice alt" data-a="ivans" data-i="${i}">${esc(a[0])}</button>`).join('')}</div>${closeBtn()}`);};
H.ivans=d=>{const iv=UI.iv;if(!iv)return;const m=M(),dj=JOBS[iv.id];const k=iv.q.a[+d.i][1];let bonus=0;
  if(k.startsWith('p:-'))bonus=(50-PV(k.slice(3)))/200-.08;else if(k.startsWith('p:'))bonus=(PV(k.slice(2))-50)/200;else bonus=((m.s[k]??50)-50)/150;
  let p=.45+(m.s.charisma-50)/200+(m.s.smarts-50)/250+(m.s.confidence-50)/300+bonus+(m.degrees.some(x=>x.tier==='elite')?.12:0)-(m.record?.25:0)+(S.econ.state==='recession'?-.12:0)
    +(m.conn?.08:0)+(m.flags.conn||0)*.04+(m.rep==='respected'?.05:m.rep==='notorious'?-.05:0)+(dj.key?(skv(dj.key)-30)/150:0)-(speaksLocal()?0:.15)+(dj.fame?fame()/400+(look()-55)/300:0);
  if(TECHJOBS.includes(iv.id)&&hasT('technical'))p+=.1;p=clamp(p+luckB(),.05,.95);UI.iv=null;
  if(chance(p)){const offer=Math.round(dj.pay[0]*(dj.fame?1:payM())*rf(.95,1.12)/500)*500;UI.offer={id:iv.id,amt:offer};
    modal(`<p class="eyebrow">Job offer</p><h2>${esc(dj.titles[0])}</h2><p class="lead">They loved you. The offer is ${money(offer)} a year.</p><div class="choices"><button class="choice" data-a="ivaccept">Accept</button><button class="choice alt" data-a="ivneg">Negotiate for more<small>Business sense and confidence help. They might pull the offer.</small></button><button class="choice alt" data-a="close">Decline</button></div>`);}
  else{S.applied[iv.id]=S.year;const alt=Object.values(JOBS).filter(x=>!x.req.hidden&&x.cat===dj.cat&&x.id!==dj.id&&jobOk(x));const t=`${dj.titles[0]}: they went with another candidate.`;L(t,'n');
    modal(`<h2>Not this time</h2><p class="lead">${esc(t)}</p>${alt.length?`<p class="note">You might be a fit for: ${alt.slice(0,3).map(x=>esc(x.titles[0])).join(', ')}.</p>`:''}${B('OK','close',{},{cls:'btn pri big'})}`);render();}};
H.ivneg=()=>{const m=M(),o=UI.offer;if(!o)return;if(chance(.35+m.s.biz/300+m.s.confidence/400)){o.amt=Math.round(o.amt*1.12/500)*500;toast(`They came up to ${money(o.amt)}.`);H.ivaccept();}
  else if(chance(.25)){UI.offer=null;closeModal();const t='They pulled the offer.';L(t,'b');note(t);render();}else{toast('They held firm.');H.ivaccept();}};
H.ivaccept=()=>{const m=M(),o=UI.offer;if(!o)return;const dj=JOBS[o.id];if(m.job)L(`You left your job as ${careerLabel()}.`);startJob(o.id);m.job.raise=o.amt/(dj.pay[0]*(dj.fame?1:payM()));UI.offer=null;closeModal();
  const t=`You got the job: ${dj.titles[0]} at ${money(o.amt)} a year!`;L(t,'g');note(t);sAdd('happy',6);sAdd('confidence',2);checkAch();render();};
function careerLabel(){const m=M();if(!m.job)return '';const d=JOBS[m.job.id];if(!d)return '';if(m.job.id==='coach'&&m.job.cs){const Ld=ladder(m.job.cs)[m.job.cs.lvl];return `${Ld[0]}${m.job.cs.team?', '+m.job.cs.team:''}`;}if(m.job.id==='politics')return OFFICES[m.job.level].n;return d.titles[Math.min(m.job.level,d.titles.length-1)];}
function sportLabel(){const sp=M().sport;if(!sp||!['pro','college','minors'].includes(sp.stage))return '';const D=SPORTS[sp.sp];return sp.stage==='college'?`${D.n} · ${sp.college?sp.college.name:'college'}`:sp.stage==='minors'?`${D.n} · minor leagues`:`Pro ${D.n.toLowerCase()}${sp.team?' · '+sp.team:''}`;}
function syncHist(){const m=S&&S.me;if(!m||!m.alive)return;m.hist=m.hist||[];[['job',careerLabel()],['sport',sportLabel()]].forEach(([k,lab])=>{const open=m.hist.find(h=>h.k===k&&!h.to);if(open&&open.t===lab)return;if(open)open.to=S.year;if(lab)m.hist.push({k,t:lab,from:S.year,to:0});});}
function atTop(){const m=M(),j=m.job;if(!j)return false;const d=JOBS[j.id];if(!d)return false;if(j.id==='coach')return !!(j.cs&&j.cs.lvl===ladder(j.cs).length-1&&j.cs.team);if(j.id==='politics')return j.level===5;return j.level===d.titles.length-1;}

/* lives: save slots */
const SLOTK='lu-slots';
function slotsMeta(){try{return JSON.parse(localStorage.getItem(SLOTK)||'null')||{active:null,list:[]};}catch(e){return {active:null,list:[]};}}
function slotsSave(meta){try{localStorage.setItem(SLOTK,JSON.stringify(meta));}catch(e){}}
function slotInfo(id){const m=S.me;return {id,name:`${m.first} ${m.last}`,age:m.age,alive:m.alive,nw:Math.round(netWorth()),ap:m.ap,g:m.g,gen:S.gen,t:Date.now(),title:m.alive?title():'Deceased'};}
function loadActive(){const meta=slotsMeta();if(!meta.active)return null;try{const s=JSON.parse(localStorage.getItem('lu-slot-'+meta.active)||'null');if(s&&s.me){SLOT=meta.active;return migrate(s);}}catch(e){}return null;}
function openLives(){save();const meta=slotsMeta();modal(`<h2>Your lives</h2><p class="lead">Every life saves automatically. Switch between them anytime.</p>
  <div class="list">${meta.list.map(x=>`<div class="row"><div class="av">${portrait(x.ap,x.age,x.g,60)}</div><div class="tx"><div class="t">${esc(x.name)}${x.id===SLOT?' <span class="chip c-blue">Playing</span>':''}</div><div class="d">${x.alive?'Age '+x.age:'Died at '+x.age} · ${esc(x.title||'')} · ${money(x.nw)} · Gen ${x.gen}</div></div><div class="r">${x.id===SLOT?'':B('Play','slotplay',{id:x.id},{cls:'btn pri'})+B('Delete','slotdel',{id:x.id},{cls:'btn danger'})}</div></div>`).join('')}</div>
  <div class="btnrow">${B(icon('save')+'Save a copy','slotcopy',{},{cls:'btn'})}${B(icon('refresh')+'Start a new life','newlife',{ok:1},{cls:'btn pri'})}${closeBtn()}</div>`);}
H.lives=()=>openLives();
H.slotplay=d=>{save();try{const s=JSON.parse(localStorage.getItem('lu-slot-'+d.id)||'null');if(!s||!s.me)return toast('That save could not be loaded.');S=migrate(s);SLOT=d.id;NID=S.nid||1000;const meta=slotsMeta();meta.active=SLOT;slotsSave(meta);}catch(e){return toast('That save could not be loaded.');}
  closeModal();UI.view='home';UI.sub=null;render();window.scrollTo(0,0);if(!M().alive)showDeath();else if(S.queue.length)showEvent();};
H.slotdel=d=>{if(!d.ok){confirmIt('Delete this life?','It will be gone for good.','slotdel',{id:d.id},'Delete');return;}try{localStorage.removeItem('lu-slot-'+d.id);}catch(e){}const meta=slotsMeta();meta.list=meta.list.filter(x=>x.id!==d.id);slotsSave(meta);openLives();};
H.slotcopy=()=>{save();const id='s'+Date.now().toString(36)+ri(10,99);try{localStorage.setItem('lu-slot-'+id,JSON.stringify(S));}catch(e){toast('Could not save a copy. Storage may be full.');return;}const meta=slotsMeta();const info=slotInfo(id);info.name+=' (copy)';meta.list.splice(1,0,info);slotsSave(meta);toast('Saved a copy of this life.');openLives();};


document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=H[el.dataset.a];if(!f)return;
  const live=!!(S&&S.me&&$('#creator').hidden);const before=live?snap():null;UI.note=null;
  f(el.dataset,el);
  if(live&&S&&S.me&&UI.note)toast(UI.note,diffs(before,snap()));
  if(S&&S.me&&$('#creator').hidden&&$('#modal').hidden&&S.queue.length&&M().alive)showEvent();});
document.addEventListener('input',e=>{const el=e.target;
  if(el.id==='actsearch'){UI.q=el.value;$('#searchres').innerHTML=searchHTML(UI.q);return;}
  if(el.id==='jobsearch'){UI.jsq=el.value;const jl=$('#joblist');if(jl)jl.innerHTML=jobListHTML();return;}
  if(el.dataset&&el.dataset.cr&&CR&&el.tagName==='INPUT'){let v=el.value;if(el.type==='range'||el.type==='number')v=+v;
    if(el.dataset.cr.startsWith('pers.')&&!MODES[CR.mode].free){const k=el.dataset.cr.slice(5);const was=CR.pers[k];const wasX=was>=80||was<=20,isX=v>=80||v<=20;
      if(isX&&!wasX&&crExtremes()>=3){v=v>=80?79:21;el.value=v;toast('Pick up to three defining traits. Ease another slider toward the middle first.');}}
    setPath(CR,el.dataset.cr,v);

    if(el.dataset.cr.startsWith('st.')){const b=el.parentElement.querySelector('b.num');if(b)b.textContent=v;}
    if(el.dataset.cr.startsWith('pers.')){const labs=el.parentElement.querySelectorAll('.lab');if(labs.length===2){labs[0].classList.toggle('on',v<=30);labs[1].classList.toggle('on',v>=70);}}

document.addEventListener('change',e=>{const el=e.target;if(!(el.dataset&&el.dataset.cr&&CR&&el.tagName==='SELECT'))return;
  let v=el.value;const cur=getPath(CR,el.dataset.cr);if(typeof cur==='number')v=+v;setPath(CR,el.dataset.cr,v);

let tT;function toast(t,ds){const el=$('#toast');el.innerHTML=`<span>${esc(t)}</span>${ds&&ds.length?chipsHTML(ds):''}`;el.hidden=false;clearTimeout(tT);tT=setTimeout(()=>el.hidden=true,3200);}

   save / load / settings / boot
   ========================================================= */
const KEY='life-unlimited-v2';
function save(){if(!S||!S.me)return;S.nid=NID;try{if(!SLOT)SLOT='s'+Date.now().toString(36)+ri(10,99);localStorage.setItem('lu-slot-'+SLOT,JSON.stringify(S));
  const meta=slotsMeta();const info=slotInfo(SLOT);const i=meta.list.findIndex(x=>x.id===SLOT);if(i>=0)meta.list[i]=info;else meta.list.unshift(info);meta.active=SLOT;meta.list.sort((a,b)=>b.t-a.t);slotsSave(meta);}catch(e){}}
function saveUI(){try{localStorage.setItem('lu-ui',JSON.stringify({view:UI.view,sub:UI.sub,atab:UI.atab}));}catch(e){}}
function applySettings(){const r=document.documentElement;r.style.setProperty('--fs',{s:'14px',m:'15px',l:'17px'}[SET.size]||'15px');
  document.body.classList.toggle('reduce',!SET.motion);if(SET.theme==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',SET.theme);
  try{localStorage.setItem('lu-settings',JSON.stringify(SET));}catch(e){}}
function migrate(s){const m=s.me;s.v=3;m.sk??={};m.skp??={};m.hist??=[];m.sport??=null;
  if(m.job&&!JOBS[m.job.id])m.job=null;
  if(m.job&&m.job.id==='politics'&&m.job.v3==null){m.job.level=[0,1,3,5][m.job.level]??0;m.job.v3=1;m.pol??={party:'Independent',held:[m.job.level],terms:{[m.job.level]:1},approval:55,history:[]};}
  if(m.job&&m.job.id==='actor'&&!m.job.ac){m.job.ac={agent:0,credits:[],offers:[],pending:[],score:[0,15,45,100,180][m.job.level]||0};}
  if(m.job&&m.job.id==='music'&&!m.job.mu){m.job.mu={role:'singer',genre:'Pop',label:null,songs:[],albums:[],fans:Math.round(m.followers*.1),charted:0,band:[],lastAlbum:0};}
  if(m.bg==='famous'){m.bg='ultra';m.famousFam=1;}
  m.middle??='';m.nick??='';m.pron??=(m.g==='m'?'he/him':m.g==='f'?'she/her':'they/them');m.bday??={m:ri(1,12),d:ri(1,28)};m.env??='city';
  m.nat??=CITIES[m.city].c;m.cit??=[m.nat];m.langs??=[...(CLANG[m.nat]||['English'])];m.ap??=randAp(m.g);
  ATTRK.forEach(k=>{if(m.s[k]==null)m.s[k]=ri(35,60);});m.pers??=randomPers();m.talent??='none';m.talent2??='';m.mode??='normal';
  m.famEnv??='supportive';m.rep??='unknown';m.conn??=0;m.expect??='none';m.goals??=[];m.c??={held:m.job?[m.job.id]:[],earned:0,friends:0,dates:0,crimes:0,arrests:0,moves:0,biz:0,homes:0,kids:0,events:0};
  m.owned??=[...FREE_OUTFITS];m.famousFam??=0;m.flags??={};m.trips??=[];m.pets??=[];m.achs??=[];
  s.people.forEach(p=>{p.ap??=randAp(p.g);p.st??={};ATTRK.forEach(k=>{if(p.st[k]==null)p.st[k]=ri(30,70);});p.st.health??=80;});
  s.pending??=[];s.famBiz??=null;s.favs??=[];s.recent??=[];s.lastYear??=null;s.history??=[];s.ach??={};s.queue??=[];return s;}
function load(){const a=loadActive();if(a)return a;try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.me)return migrate(s);}catch(e){}
  try{const s=JSON.parse(localStorage.getItem('life-unlimited-v1')||'null');if(s&&s.me)return migrate(s);}catch(e){}return null;}
function start(data){
  try{const st=JSON.parse(localStorage.getItem('lu-settings')||'null');if(st)SET={...SET,...st};}catch(e){}applySettings();
  const s=(data&&data.S)||load();
  try{const u=JSON.parse(localStorage.getItem('lu-ui')||'null');if(u){UI.view=u.view||'home';UI.sub=u.sub||null;UI.atab=u.atab||'money';}}catch(e){}
  if(data&&data.SLOT)SLOT=data.SLOT;
  if(s){S=s.v===3?s:migrate(s);NID=S.nid||1000;$('#app').hidden=false;render();if(!M().alive)showDeath();else if(S.queue.length)showEvent();}
  else openCreator();}
window.claude?.hot?.snapshot?.(()=>({S,SLOT}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
