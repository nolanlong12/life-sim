<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one life card on top, then the year-by-year ledger beside a tabbed control panel; a fixed "age up" bar at the bottom. */
:root{
  --bg:#E8EBF1; --surface:#FFFFFF; --sunk:#F2F4F8; --ink:#131A28; --muted:#5B6479; --line:#D4D9E3;
  --accent:#2B45D6; --accent-soft:#E2E6FB; --on-accent:#FFFFFF; --sun:#C98F00; --good:#167F51; --bad:#C2352D; --money:#8A6A00;
  --display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --body:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0F18; --surface:#141A27; --sunk:#10151F; --ink:#E7EBF3; --muted:#959FB4; --line:#252E41;
  --accent:#8395FF; --accent-soft:#1E2747; --on-accent:#0B0F18; --sun:#FFC63D; --good:#41C98B; --bad:#FF6E65; --money:#F2C64A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F18; --surface:#141A27; --sunk:#10151F; --ink:#E7EBF3; --muted:#959FB4; --line:#252E41;
  --accent:#8395FF; --accent-soft:#1E2747; --on-accent:#0B0F18; --sun:#FFC63D; --good:#41C98B; --bad:#FF6E65; --money:#F2C64A; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.eyebrow{font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* life card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.lifecard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 20px;align-items:center;padding:18px 20px}
.age{grid-row:span 2;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:84px;padding:6px 14px;border-right:1px solid var(--line)}
.age b{font:800 56px/0.9 var(--display);letter-spacing:-.04em;color:var(--accent)}
.age span{font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.who h1{font-size:clamp(22px,4vw,30px);line-height:1.05}
.who p{margin:4px 0 0;color:var(--muted)}
.worth{text-align:right}
.worth .v{font:700 clamp(20px,3.6vw,28px)/1 var(--mono);font-variant-numeric:tabular-nums}
.worth .s{margin-top:6px;font:500 12px/1.3 var(--mono);color:var(--muted)}
.tags{grid-column:2 / -1;display:flex;flex-wrap:wrap;gap:6px}
.tag{font:600 11px/1 var(--mono);letter-spacing:.04em;padding:5px 8px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.tag.hot{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.warn{color:var(--bad)}
@media (max-width:640px){
  .lifecard{grid-template-columns:auto minmax(0,1fr);padding:14px}
  .age{min-width:64px;padding:4px 10px}.age b{font-size:44px}
  .worth{grid-column:1 / -1;text-align:left;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
  .worth .s{margin:0}
  .tags{grid-column:1 / -1}
}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 22px;padding:16px 20px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr));padding:14px}}
.stat .top{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:600}
.stat .top .num{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden;margin-top:5px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .4s ease}
.bar i.lo{background:var(--bad)}.bar i.hi{background:var(--good)}
.chips{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px;padding-top:4px;border-top:1px dashed var(--line);margin-top:2px;padding-top:12px}
.chip{display:flex;gap:6px;align-items:baseline;font-size:12.5px;color:var(--muted)}
.chip b{font:700 12.5px var(--mono);color:var(--ink)}
.chip+.chip::before{content:"·";margin-right:2px;color:var(--line)}

/* main grid */
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.loghead,.panelhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.loghead h2,.panelhead h2{font-size:17px}
.log{max-height:min(68vh,760px);overflow:auto;padding:4px 0}
@media (max-width:900px){.log{max-height:46vh}}
.yr{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.yr:last-child{border-bottom:0}
.yr.now{background:var(--sunk)}
.yr .when b{display:block;font:800 22px/1 var(--display);color:var(--ink)}
.yr .when span{font:500 11px var(--mono);color:var(--muted)}
.yr ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.yr li{position:relative;padding-left:14px;font-size:14px}
.yr li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--line)}
.yr li.g::before{background:var(--good)}.yr li.b::before{background:var(--bad)}.yr li.m::before{background:var(--sun)}.yr li.a::before{background:var(--accent)}

/* tabs + panel */
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;padding:8px 12px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer}
.tab:hover{color:var(--ink);background:var(--sunk)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.panel{padding:6px 18px 18px}
.sec{padding-top:14px}
.sec>h3{font:700 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.sec>p.note{margin:0 0 8px;color:var(--muted);font-size:13.5px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row-main{min-width:0;flex:1}
.row-t{font-weight:600}
.row-s{font-size:13px;color:var(--muted);margin-top:2px}
.row-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.cost{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.cost .dot{color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover:not(:disabled){filter:brightness(1.08);color:var(--on-accent)}
.btn.bad:hover:not(:disabled){border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.42;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.req{display:inline-flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.req span{font:500 11px var(--mono);padding:2px 6px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.req span.no{color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--sunk);border-radius:12px;padding:12px}
.tile .eyebrow{font-size:10px}
.tile .v{font:700 18px var(--mono);margin-top:6px;font-variant-numeric:tabular-nums}
.up{color:var(--good)}.down{color:var(--bad)}
.minibar{width:72px;height:5px;border-radius:5px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.minibar i{display:block;height:100%;background:var(--accent)}
.minibar i.lo{background:var(--bad)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.ach div{padding:10px;border-radius:10px;border:1px dashed var(--line);font-size:13px;color:var(--muted)}
.ach div b{display:block;color:var(--muted);font-size:13.5px}
.ach div.got{border-style:solid;border-color:transparent;background:var(--accent-soft);color:var(--ink)}
.ach div.got b{color:var(--accent)}
.empty{color:var(--muted);font-size:14px;padding:10px 0}

/* bottom bar */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.time{display:flex;flex-direction:column;gap:6px;min-width:0}
.pips{display:flex;gap:5px}
.pips i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}
.pips i.full{background:var(--accent)}
.time span{font:500 12px var(--mono);color:var(--muted)}
.ageup{border:0;background:var(--ink);color:var(--surface);border-radius:14px;padding:14px 22px;font:800 18px/1 var(--display);cursor:pointer;display:flex;align-items:center;gap:10px;white-space:nowrap}
.ageup small{font:500 12px var(--mono);opacity:.7}
.ageup:hover{background:var(--accent);color:var(--on-accent)}

/* modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(8,11,20,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.modal{align-items:center}}
.sheet{background:var(--surface);border-radius:18px;border:1px solid var(--line);width:min(560px,100%);max-height:86vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px;animation:rise .22s ease}
@keyframes rise{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar i{transition:none}}
.sheet h2{font-size:24px;line-height:1.1}
.sheet .lead{font-size:16px;margin:0}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.choice{text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:12px 14px;font-weight:600;cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.choice small{display:block;font-weight:500;color:var(--muted);margin-top:2px}
.result{padding:14px;border-radius:12px;background:var(--sunk);border-left:4px solid var(--accent);font-size:15px}
.result.g{border-left-color:var(--good)}.result.b{border-left-color:var(--bad)}.result.m{border-left-color:var(--sun)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
.form input,.form select{font:inherit;font-size:15px;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
@media (max-width:480px){.form{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;max-width:min(520px,calc(100% - 32px));box-shadow:0 8px 30px rgba(0,0,0,.25)}
.dead{opacity:.6}
</style>

</div>

function genMarket(){const pool=[...PROPS],out=[];for(let i=0;i<5;i++){const t=pool.splice(ri(0,pool.length-1),1)[0];
  out.push({n:t.n,price:Math.round(t.p*city().house*S.econ.housing*rf(.85,1.2)/1000)*1000,rent:t.rent});}return out;}

function newLife(o={}){
  NID=1;
  const g=o.g==='m'||o.g==='f'?o.g:pick(['m','f']);
  const last=(o.last||'').trim()||pick(LN), first=(o.first||'').trim()||pick(NM[g]);
  const ci=o.city!=null&&o.city!==''&&o.city!=='r'?+o.city:ri(0,CITIES.length-1);
  const bg=PJOBS[o.bg]?o.bg:wpick([['poor',18],['working',30],['middle',34],['wealthy',14],['famous',4]]);
  const W={poor:[1e3,12e3],working:[1e4,6e4],middle:[6e4,4e5],wealthy:[1.5e6,9e6],famous:[8e6,7e7]}[bg];
  const keep=o.keep||{history:[],ach:{}};
  S={v:1,gen:1,year:o.year||2026,me:null,people:[],assets:[],biz:[],inv:{sav:0,idx:0,cry:0},
    econ:{state:'stable',idx:100,cry:40,housing:1,lastIdx:0,lastCry:0},market:[],log:[],queue:[],used:0,led:{inc:0,exp:0},
    ach:keep.ach,history:keep.history,nid:1};
  const s=()=>ri(15,85);
  S.me={first,last,g,age:0,city:ci,alive:true,bg,born:S.year,
    s:{health:ri(72,100),happy:ri(60,95),smarts:s(),looks:s(),fitness:ri(20,55),charisma:s(),creativity:s(),discipline:s(),stress:ri(0,12),karma:50},
    cash:0,debt:0,edu:0,degrees:[],school:null,job:null,effort:'normal',study:'normal',followers:bg==='famous'?ri(2e3,4e4):0,
    prison:0,record:0,retired:false,pension:0,trips:[],pets:[],flags:{},achs:[],pref:'any'};
  const pj=PJOBS[bg], momAge=ri(21,40), dadAge=Math.round(clamp(momAge+ri(-3,6),20,55));
  const mom=person('mother',momAge,{g:'f',last:chance(.6)?last:pick(LN),job:pick(pj),cash:ri(...W)/2,bond:ri(65,95)});
  const dad=person('father',dadAge,{g:'m',last,job:pick(pj),cash:ri(...W)/2,bond:ri(55,95)});
  S.people.push(mom,dad);
  S.me.flags.parentsMarried=chance(.8)?1:0;
  const ns=wpick([[0,35],[1,35],[2,20],[3,10]]);
  for(let i=0;i<ns;i++)S.people.push(person('sibling',ri(1,Math.max(1,Math.min(12,momAge-18))),{last,bond:ri(45,85)}));
  S.market=genMarket();
  const c=city();
  L(`You were born a ${g==='m'?'boy':'girl'} in ${c.n}, ${c.c}.`,'a');
  L(`Your parents are ${mom.first} (${mom.job.toLowerCase()}) and ${dad.first} (${dad.job.toLowerCase()}). You were born into a ${BGNAME[bg].toLowerCase()}.`);
  const sibs=alive('sibling');
  if(sibs.length)L(`You have ${sibs.length===1?'one older sibling':sibs.length+' older siblings'}: ${sibs.map(x=>x.first).join(', ')}.`);
  if(bg==='famous')L(`Paparazzi were outside the hospital. You already have ${S.me.followers.toLocaleString()} followers.`,'m');
  L('Spend your free time on activities, then tap Age up to live the next year.');
}

/* ================= time ================= */
function maxSlots(){const m=S.me;let n=m.age<3?2:m.age<13?4:m.age<18?5:6;
  if(m.prison)return 3;
  if(m.job){if(m.effort==='grind')n--;if(m.effort==='coast')n++;}
  if(m.school){if(m.study==='hard')n--;if(m.study==='slack')n++;}
  if(m.job&&m.school)n--;
  return Math.max(1,n);}
const left=()=>Math.max(0,maxSlots()-S.used);
function spend(n=1){if(n<=0)return true;if(left()<n){toast(n>1?`That takes ${n} time blocks. You have ${left()} left this year.`:'No free time left this year. Age up to continue.');return false;}S.used+=n;return true;}

function econTick(){const E=S.econ,r=rand(),was=E.state;
  if(E.state==='stable'){if(r<.12)E.state='boom';else if(r<.22)E.state='recession';}else if(E.state==='boom'){if(r<.3)E.state='stable';else if(r<.4)E.state='recession';}else if(r<.45)E.state='stable';
  const ret=E.state==='boom'?rf(.08,.3):E.state==='stable'?rf(-.05,.17):rf(-.32,0);E.lastIdx=ret;E.idx*=1+ret;
  const c=Math.exp(rf(-.95,1))-1;E.lastCry=c;E.cry=Math.max(.05,E.cry*(1+c));
  E.housing*=1+(E.state==='boom'?rf(.04,.12):E.state==='stable'?rf(0,.06):rf(-.12,-.02));
  if(was!==E.state&&M().age>=14)L(E.state==='recession'?'The economy slid into a recession.':E.state==='boom'?'The economy is booming.':'The economy steadied.','a');}
const earnB=n=>{S.me.cash+=n;S.led.inc+=n;}, payB=n=>{S.me.cash-=n;S.led.exp+=n;};
const tax=g=>g*(g<3e4?.1:g<9e4?.2:g<3e5?.3:.37);
function schoolTick(){const m=M();if(m.prison)return;
  if(!m.school&&m.age===5&&!m.flags.schoolDone){m.school={stage:'elementary',grade:ri(55,85),years:0};L('You started elementary school.');return;}
  const sc=m.school;if(!sc)return;sc.years++;
  const eff={slack:-6,normal:1,hard:7}[m.study];sc.grade=Math.round(clamp(sc.grade+eff+(m.s.smarts-55)/10+(m.s.discipline-50)/15+ri(-6,6)));
  sAdd('smarts',m.study==='hard'?ri(2,4):m.study==='normal'?ri(0,2):0);if(m.study==='hard')sAdd('stress',5);if(m.study==='slack')sAdd('happy',2);
  if(sc.stage==='elementary'&&m.age>=11){sc.stage='middle';L('You moved up to middle school.');}
  else if(sc.stage==='middle'&&m.age>=14){sc.stage='high';L('You started high school.');}
  else if(sc.stage==='high'&&m.age>=18){m.edu=Math.max(m.edu,1);m.flags.lastGrade=sc.grade;m.school=null;m.flags.schoolDone=1;L(`You graduated from high school${sc.grade>=90?' with honors':''}.`,'g');S.queue.push({id:'hs_grad',ctx:{}});}
  else if(sc.stage==='college'||sc.stage==='grad'){
    if(sc.cost>0){m.debt+=sc.cost;}
    if(sc.grade<25&&chance(.5)){L(`You failed out of ${sc.stage==='college'?'college':sc.prog+' school'}.`,'b');m.school=null;sAdd('happy',-10);return;}
    if(sc.years>=sc.len){if(sc.stage==='college'){m.edu=Math.max(m.edu,2);m.degrees.push({type:'BA',major:sc.major,tier:sc.tier});L(`You graduated with a bachelor's degree in ${sc.major}${sc.grade>=88?', summa cum laude':''}.`,'g');}
      else{m.edu=3;m.degrees.push({type:sc.prog});L(`You earned your ${sc.prog}.`,'g');}m.school=null;sAdd('happy',8);}}}
function jobTick(){const m=M(),j=m.job;if(!j||m.prison)return;const d=JOBS[j.id];j.years++;j.yil++;j.asked=0;
  const eff={coast:-8,normal:2,grind:10}[m.effort];j.perf=Math.round(clamp(j.perf+eff+(m.s.discipline-50)/10+(m.s.smarts-50)/20+ri(-10,10)));
  if(m.effort==='grind')sAdd('stress',6);if(m.effort==='coast')sAdd('stress',-4);
  const g=salary(j);earnB(g-tax(g));
  if(d.req.fame){const k=FAMEKEY[j.id];m.followers+=Math.round([300,3e3,4e4,4e5,3e6][j.level]*rf(.5,1.5));
    if(j.perf>=65&&j.yil>=1&&j.level<d.titles.length-1&&chance(.2+m.s[k]/300)){j.level++;j.yil=0;j.perf=55;sAdd('happy',10);L(`Big break: you're now a ${d.titles[j.level]}.`,'g');}
    else if(j.perf<20&&chance(.4)){m.job=null;L(`Your ${d.track.toLowerCase()} career stalled and you were dropped by your agent.`,'b');}
    if(j.id==='athlete'&&m.age>=33&&chance((m.age-31)*.12)){m.job=null;L(`You retired from professional sports at ${m.age}.`,'a');}return;}
  if(j.id==='politics'){j.perf=clamp(j.perf+(m.s.charisma-50)/10+ri(-8,8));if(S.year-j.term>=4)S.queue.push({id:'reelect',ctx:{}});return;}
  if(j.id==='crew'){sAdd('karma',-4);if(chance(.1+j.level*.03)){S.queue.push({id:'court',ctx:{crime:'racketeering',y:4+j.level*3}});return;}}
  if(j.perf>=75&&j.yil>=2&&j.level<d.titles.length-1&&chance(.6)){j.level++;j.yil=0;j.perf=55;sAdd('happy',8);L(`You were promoted to ${d.titles[j.level]}.`,'g');}
  else if(j.perf<18&&chance(.5)){m.job=null;sAdd('happy',-10);L(`You were fired from your job as ${d.titles[j.level]}.`,'b');}}
function bizTick(){const mult={boom:1.2,stable:1,recession:.72}[S.econ.state];
  for(const b of [...S.biz]){const d=BIZDEF(b);let pr=d.profit*b.loc*(.45+b.q/100)*mult*rf(1-d.vol,1+d.vol);
    if(d.k==='tech'){if(chance(.12)){b.boost=(b.boost||1)*3;L(`${b.name} landed a huge round of funding.`,'m');}else if(chance(.1)){b.boost=(b.boost||1)*.4;L(`${b.name} had a rough year with users.`,'b');}pr*=b.boost||1;}
    b.q=clamp(b.q-ri(1,5));b.last=Math.round(pr);b.years++;if(pr>0)earnB(pr-tax(pr)*.7);else payB(-pr);
    b.value=Math.round(Math.max(d.cost*.25*b.loc,pr*4+d.cost*.4*b.loc)*(d.k==='tech'?(b.boost||1):1));

function assetTick(){const hc=S.econ.housing/(S.econ.prevHousing||S.econ.housing);
  for(const a of S.assets){if(a.kind==='prop'){a.value*=hc*rf(.96,1.05);payB(a.value*.012);if(a.rented&&!M().prison){earnB(a.value*a.rent*.75);}}
    else if(a.kind==='car'){a.value*=.86;payB(Math.max(600,a.value*.04));}
    else{if(a.sub==='collect')a.value*=Math.exp(rf(-.15,.21));else{a.value*=.93;payB(a.value*(a.sub==='jet'?.07:.08));}}}

function healthTick(){const m=M(),s=m.s;
  if(m.age>45)sAdd('health',-ri(0,2)-(m.age>65?ri(1,4):0)-(m.age>80?ri(1,3):0));
  if(m.age>35)sAdd('fitness',-ri(0,2));if(m.age>42)sAdd('looks',-ri(0,2));

function peopleTick(){const m=M();
  for(const p of S.people){if(!p.alive)continue;p.age++;
    let dp=p.age<50?.001:p.age<65?.006:p.age<75?.02:p.age<85?.06:.15;if(p.rel==='child'&&p.age<18)dp=.0005;
    if(chance(dp)){p.alive=false;p.died=S.year;const close=['mother','father','spouse','child','sibling','fiance','partner'].includes(p.rel);

      if(['partner','fiance'].includes(p.rel))p.rel='partner';continue;}

    p.cash=Math.round(p.cash*rf(1,1.06)+(p.age>=18&&p.job?rf(2e3,1e4):0));
    if(p.owes&&chance(.3)){m.cash+=p.owes;L(`${p.first} paid back the ${money(p.owes)} you lent.`,'m');p.owes=0;}
    if(p.rel==='friend'){if(chance(.07)){const n=pick([`${p.first} got married.`,`${p.first} got a big promotion.`,`${p.first} moved to ${pick(CITIES).n}.`,`${p.first} had a baby.`,`${p.first} started a podcast nobody listens to.`]);L(n);}
      if(p.bond<12){p.rel='former';L(`You and ${p.first} drifted apart.`,'n');}}
    if(['partner','fiance'].includes(p.rel)&&p.bond<15&&chance(.5)){p.rel='ex';sAdd('happy',-10);L(`${p.first} broke up with you.`,'b');}
    if(p.rel==='spouse'&&p.bond<15&&!S.queue.some(q=>q.id==='divorce_req'))S.queue.push({id:'divorce_req',ctx:{p:p.id}});

      if(p.age===23&&!p.job.includes('Physician'))p.job=pick(['Software Engineer','Nurse','Teacher','Chef','Electrician','Marketing Manager','Paralegal','Graphic Designer','Physician']);}}}
function deathCheck(){const m=M();let p=.0006,cause=pick(['a car accident','a sudden aneurysm','a fall from a ladder']);
  if(m.s.health<=0){p=1;cause='complications from poor health';}
  else{if(m.age>=62){p+=(m.age-58)*.007*(1.7-m.s.health/100);cause='natural causes';}if(m.age>=100)p+=.25;}
  if(chance(p)){die(cause);return true;}return false;}

function ageUp(){const m=M();if(!m.alive){showDeath();return;}if(S.queue.length){showEvent();return;}
  m.age++;S.year++;S.used=0;S.led={inc:0,exp:0};
  if(m.age===1)L(`You took your first wobbly steps.`,'g');
  if(m.age===2)L(`Your first word was "${pick(['ball','no','dog','more','uh-oh','up'])}".`,'g');
  if(m.prison>0){m.prison--;if(!m.prison){L('You were released from prison. Time to rebuild.','g');sAdd('happy',10);}else L(`${plural(m.prison,'year')} left on your sentence.`,'b');}
  econTick();schoolTick();jobTick();bizTick();assetTick();financeTick();healthTick();peopleTick();
  if(m.followers>0){if(!m.job||!JOBS[m.job.id].req.fame)m.followers=Math.round(m.followers*rf(.88,1.02));
    if(m.followers>=1e4&&!m.prison){const sp=Math.round(m.followers*rf(.02,.06));earnB(sp);L(`Sponsored posts brought in ${money(sp)}.`,'m');}}
  if(m.age>=18&&(S.led.inc||S.led.exp))L(`Earned ${money(S.led.inc)} · spent ${money(S.led.exp)} on living costs and upkeep.`,'m');
  if(!deathCheck()){if(!m.prison)rollEvents();S.market=genMarket();}
  const y=S.log[S.log.length-1];if(m.alive&&(!y||y.age!==m.age))L(pick(['A quiet year.','Nothing much happened this year.','Life rolled on.']));
  checkAch();render();
  if(!m.alive)showDeath();else if(S.queue.length)showEvent();}
function rollEvents(){const m=M();
  const pool=Object.values(EV).filter(e=>!e.special&&m.age>=(e.min??0)&&m.age<=(e.max??200)&&!(e.once&&m.flags['ev_'+e.id])&&(!e.when||e.when()));
  let n=m.age<3?0:chance(.72)?1:0;if(chance(.22))n++;
  for(let i=0;i<n&&pool.length;i++){const e=wpick(pool.map(x=>[x,x.w||1]));pool.splice(pool.indexOf(e),1);const ctx=e.ctx?e.ctx():{};if(!ctx)continue;if(e.once)m.flags['ev_'+e.id]=1;S.queue.push({id:e.id,ctx});}}

function die(cause){const m=M();m.alive=false;m.cause=cause;S.queue=[];

  S.history.push({gen:S.gen,name:`${m.first} ${m.last}`,born:m.born,died:S.year,age:m.age,worth:Math.round(netWorth()),title:m.job?JOBS[m.job.id].titles[m.job.level]:(m.retired?'Retired':title()),cause,score:legacyScore()});}
function legacyScore(){const m=M();const nw=netWorth();return Math.round(Math.max(0,Math.log10(Math.max(1,nw)))*8+alive('child').length*6+fame()/2+m.s.karma/2+m.achs.length*10+m.age/4);}
function continueAs(cid){const old=M(),kid=P(cid);if(!kid)return;
  const heirs=alive('child');let estate=old.cash+S.inv.sav+idxVal()+cryVal()-old.debt;if(estate>0)estate*=.9;const share=Math.round(estate/heirs.length);
  const spouse=S.people.find(p=>p.alive&&p.rel==='spouse');const t=kid.st;
  const me={first:kid.first,last:kid.last,g:kid.g,age:kid.age,city:old.city,alive:true,bg:netWorth()>2e6?'wealthy':'middle',born:S.year-kid.age,
    s:{health:t.health,happy:60,smarts:t.smarts,looks:t.looks,fitness:t.fitness??40,charisma:t.charisma??50,creativity:t.creativity??50,discipline:t.discipline??50,stress:30,karma:50},
    cash:Math.max(0,share),debt:Math.max(0,-share),edu:kid.age>=22&&kid.edu?2:kid.age>=18?1:0,degrees:kid.age>=22&&kid.edu?[{type:'BA',major:pick(MAJORS)}]:[],
    school:null,job:null,effort:'normal',study:'normal',followers:Math.round(old.followers*.2),prison:0,record:0,retired:false,pension:0,trips:[],pets:[],
    flags:{movedOut:kid.age>=18?1:0,schoolDone:kid.age>=18?1:0},achs:[],pref:'any'};
  if(kid.age>=5&&kid.age<18)me.school={stage:kid.age<11?'elementary':kid.age<14?'middle':'high',grade:ri(55,85),years:0};
  heirs.forEach(h=>{if(h!==kid){h.cash+=share;h.rel='sibling';}});
  const deadParent={...person(old.g==='m'?'father':'mother',old.age,{g:old.g,first:old.first,last:old.last}),alive:false,died:S.year};
  const people=[deadParent];if(spouse){spouse.rel=spouse.g==='m'?'father':'mother';people.push(spouse);}
  heirs.filter(h=>h!==kid).forEach(h=>people.push(h));
  S.gen++;S.me=me;S.people=people;S.inv={sav:0,idx:0,cry:0};S.log=[];S.queue=[];S.used=0;S.assets.forEach(a=>a.home=false);
  L(`You are ${me.first} ${me.last}, generation ${S.gen} of the ${old.last} family.`,'a');
  L(`${old.first} left an estate worth ${money(estate)}. Your share is ${money(share)}${S.assets.length||S.biz.length?', plus the family properties and businesses':''}.`,'m');
  checkAch();closeModal();render();}

const B=(label,a,d={},o={})=>`<button class="${o.cls||'btn'}" data-a="${a}" ${Object.entries(d).map(([k,v])=>`data-${k}="${esc(v)}"`).join(' ')} ${o.dis?'disabled':''}>${label}</button>`;
const row=(t,s,r)=>`<div class="row"><div class="row-main"><div class="row-t">${t}</div>${s?`<div class="row-s">${s}</div>`:''}</div><div class="row-r">${r||''}</div></div>`;
const sec=(t,body,note)=>`<section class="sec"><h3>${t}</h3>${note?`<p class="note">${note}</p>`:''}${body}</section>`;
const dots=n=>n?`<span class="dot">${'●'.repeat(n)}</span>`:'';
const costTag=(n,$)=>`<span class="cost">${dots(n)}${n&&$?' · ':''}${$?money($):''}</span>`;
const seg=(a,cur,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button data-a="${a}" data-v="${v}" aria-pressed="${cur===v}">${l}</button>`).join('')}</div>`;
const mini=v=>`<div class="minibar"><i class="${v<30?'lo':''}" style="width:${clamp(v)}%"></i></div>`;

function renderHead(){const m=M(),c=city(),nw=netWorth();
  const tags=[`<span class="tag">${esc(BGNAME[m.bg])}</span>`,`<span class="tag">Gen ${S.gen}</span>`];

  if(m.prison)tags.push(`<span class="tag warn">Prison · ${plural(m.prison,'year')} left</span>`);
  if(m.record&&!m.prison)tags.push(`<span class="tag warn">Criminal record</span>`);
  if(m.pets.length)tags.push(`<span class="tag">Pets · ${esc(m.pets.join(', '))}</span>`);

   <div class="who"><h1>${esc(m.first)} ${esc(m.last)}</h1><p>${esc(c.n)}, ${esc(c.c)} · ${esc(title())} · ${S.year}</p></div>
   <div class="worth"><p class="eyebrow">Net worth</p><div class="v ${nw<0?'down':''}">${money(nw)}</div><div class="s">Cash ${money(m.cash)}${m.debt?` · Debt ${money(m.debt)}`:''}</div></div>
   <div class="tags">${tags.join('')}</div>`;}

function pLife(){const m=M();if(!m.alive)return sec('Activities','<p class="empty">This life has ended. Open the Legacy tab to continue.</p>');
  const list=ACTS.filter(a=>m.age>=a.min&&(a.max==null||m.age<=a.max)&&(m.prison?a.prison:!a.only)&&(!a.when||a.when()));
  const note=m.prison?`You're serving a prison sentence. ${plural(m.prison,'year')} to go.`:m.age<3?'Babies have a lot of time, but not many options.':'Each activity uses time blocks. You get a fresh set every year.';
  return sec(m.prison?'Prison life':'How you spend your year',list.map(a=>{const c=a.price?a.price():0;return row(a.n,a.d,costTag(a.cost,c)+B('Do it','act',{id:a.id},{dis:left()<a.cost||c>m.cash&&c>0}));}).join(''),note);}
function pWork(){const m=M();let h='';if(!m.alive)return sec('Work','<p class="empty">This life has ended.</p>');
  if(m.prison)return sec('Work','<p class="empty">You lost your job when you went to prison. You can look for work again after release.</p>');
  // education
  let ed='';const sc=m.school;
  if(sc){const name={elementary:'Elementary school',middle:'Middle school',high:'High school',college:`${sc.tierName||'University'} · ${sc.major}`,grad:`${sc.prog} program`}[sc.stage];
    const yrs=sc.len?` · Year ${sc.years+1} of ${sc.len}`:'';
    ed+=row(name,`Grade ${sc.grade}/100${yrs}${sc.cost?` · ${money(sc.cost)}/yr in loans`:''}`,mini(sc.grade));
    ed+=row('Study effort','Studying hard costs a free time block. Slacking gives you one back.',seg('study',m.study,[['slack','Slack off'],['normal','Normal'],['hard','Study hard']]));
    const canDrop=(sc.stage==='high'&&m.age>=16)||sc.stage==='college'||sc.stage==='grad';
    ed+=row('Join a club','Charisma and friends',costTag(1)+B('Join','club',{},{dis:left()<1}));
    if(canDrop)ed+=row('Drop out','Leave school for good',B('Drop out','dropout',{},{cls:'btn bad'}));}
  else if(m.age<5)ed+=`<p class="empty">You'll start school at age 5.</p>`;
  else{ if(m.edu===0&&m.age>=17)ed+=row('No high-school diploma','Study for a GED in Activities to unlock more jobs.','');
    if(m.edu>=1)ed+=row('College','Four-year bachelor’s degree',B(m.edu>=2?'Another degree':'Apply','college',{},{cls:'btn pri'}));
    if(m.edu>=2)ed+=row('Graduate school','Medical school, law school, or an MBA',B('Apply','gradschool'));
    ed+=row('Your education',[['None','High school','Bachelor’s','Graduate'][m.edu],...m.degrees.map(d=>d.type==='BA'?`BA ${d.major}`:d.type)].join(' · '),'');}
  h+=sec('Education',ed);
  // job
  let jb='';const j=m.job;
  if(j){const d=JOBS[j.id];jb+=row(d.titles[j.level],`${d.track} · ${money(salary(j))}/yr · ${plural(j.years,'year')} here`,`<span class="cost">Performance</span>${mini(j.perf)}`);
    jb+=row('Work effort','Grinding costs a free time block but builds performance. Coasting frees one up.',seg('effort',m.effort,[['coast','Coast'],['normal','Normal'],['grind','Grind']]));
    const btns=[];if(!['politics','crew'].includes(j.id))btns.push(B('Ask for a raise','raise',{},{dis:j.asked}));btns.push(B('Quit','quit',{},{cls:'btn bad'}));if(m.age>=55)btns.push(B('Retire','retire'));
    jb+=row('Options','',btns.join(''));}
  else jb+=`<p class="empty">${m.age<15?'You can start working at 15.':m.retired?"You're retired. You can still take a job if you want.":"You don't have a job right now."}</p>`;
  h+=sec('Your job',jb);
  if(m.age>=15){const list=Object.values(JOBS).filter(d=>!d.req.hidden&&(!j||j.id!==d.id)&&(m.age<18||m.school?d.req.age===15||d.req.fame||m.school&&m.age>=18:true));
    h+=sec('Openings',list.map(d=>{const r=reqList(d);const ok=r.every(x=>x.ok);
      return row(`${d.titles[0]} <span class="cost">· ${d.track}</span>`,`Starts at ${money(d.pay[0]*(d.req.fame?1:city().pay))}/yr${d.req.fame?' · fame track':''}<div class="req">${r.map(x=>`<span class="${x.ok?'':'no'}">${esc(x.t)}</span>`).join('')}</div>`,costTag(1)+B(d.req.fame?(d.id==='athlete'?'Try out':'Audition'):'Apply','apply',{id:d.id},{dis:!ok||left()<1}));}).join(''),
      m.age<18||m.school?'While you are in school you can take part-time work and fame-track gigs.':'Applying takes a free time block. Requirements in red are missing.');}
  if(m.age>=21){const pl=j&&j.id==='politics'?j.level:-1,next=pl+1;if(next<=3){const ages=[21,25,30,35];const ok=m.age>=ages[next];
    h+=sec('Politics',row(`Run for ${JOBS.politics.titles[next]}`,`Needs age ${ages[next]}+${next>0?` and to hold ${JOBS.politics.titles[next-1]}`:''}. Odds rise with charisma, karma, fame and campaign money.`,B('Campaign','run',{},{dis:!ok||left()<1})));}}
  return h;}
function pPeople(){const m=M();if(!m.alive)return sec('People','<p class="empty">This life has ended.</p>');
  const grp=(t,rels,note)=>{const ps=S.people.filter(p=>rels.includes(p.rel)&&(p.alive||['mother','father','sibling','child','spouse'].includes(p.rel)));if(!ps.length)return note?sec(t,`<p class="empty">${note}</p>`):'';

function pMoney(){const m=M();if(!m.alive)return sec('Money','<p class="empty">This life has ended.</p>');

    +row('Personal loan','Approval depends on your income and existing debt',B('$10K','loan',{amt:1e4})+B('$50K','loan',{amt:5e4})+B('$250K','loan',{amt:25e4})));

  h+=sec('Start a business',BIZ.map(d=>row(d.n,`Typical profit ${money(d.profit)}/yr per location · ${d.vol>=.8?'very risky':d.vol>=.5?'risky':'steady'}`,costTag(1,d.cost)+B('Start','bizstart',{k:d.k},{dis:m.cash<d.cost||left()<1||m.prison}))).join(''));

  else{const inc=m.job?salary(m.job):0;if(m.cash<x.price*.2)return;if(inc*6<x.price*.8&&!chance(.2)){toast('The bank declined your mortgage. You need more income.');return;}m.cash-=x.price*.2;m.debt+=x.price*.8;}
  S.assets.push({id:NID++,kind:'prop',name:x.n,value:x.price,rent:x.rent,home:false,rented:false,city:city().n});S.market.splice(+d.i,1);
  const t=`You bought a ${x.n.toLowerCase()} for ${money(x.price)}${d.mode==='mort'?' with a mortgage':''}.`;L(t,'m');toast(t);render();};
H.prop=d=>{const a=S.assets.find(x=>x.id===+d.id);if(d.op==='home'){S.assets.forEach(x=>x.home=false);a.home=true;a.rented=false;toast(`You moved into your ${a.name.toLowerCase()}.`);}else{a.rented=!a.rented;toast(a.rented?'Tenants are moving in.':'Your tenants moved out.');}checkAch();render();};
H.sell=d=>{const m=M(),a=S.assets.find(x=>x.id===+d.id);const v=a.kind==='prop'?a.value*.95:a.value*.9;m.cash+=v;S.assets=S.assets.filter(x=>x!==a);const t=`You sold your ${a.name.toLowerCase()} for ${money(v)}.`;L(t,'m');toast(t);render();};
H.buy=d=>{const m=M();const src=d.kind==='car'?CARS:LUX;const it=src.find(x=>x[0]===d.n);if(m.cash<it[1])return;m.cash-=it[1];
  S.assets.push({id:NID++,kind:d.kind,sub:it[2],name:it[0],value:it[1]});sAdd('happy',d.kind==='car'?4:6);const t=`You bought a ${it[0].toLowerCase()}.`;L(t,'m');toast(t);render();};
H.move=d=>{const m=M(),to=CITIES[+d.i],abroad=to.c!==city().c,c=abroad?8e3:3e3;if(m.cash<c||!spend(1))return;
  if(abroad&&!chance(.35+m.edu*.12+(m.job?.1:0)+(netWorth()>5e5?.3:0))){m.cash-=500;const t=`Your visa application for ${to.c} was denied.`;L(t,'b');toast(t);render();return;}
  m.cash-=c;const job=m.job;if(job&&!['athlete','actor','music','politics'].includes(job.id)&&chance(.5)){L(`You left your job to move.`);m.job=null;}
  if(m.job&&m.job.id==='politics'){m.job=null;L('You resigned from office to move.');}
  moveTo(+d.i);const t=`You moved to ${to.n}, ${to.c}.`;L(t,'a');toast(t);checkAch();render();};
H.trip=d=>{const m=M(),tr=TRIPS.find(x=>x[0]===d.n);if(m.cash<tr[1]||!spend(1))return;m.cash-=tr[1];sAdd('happy',tr[2]);sAdd('stress',-tr[2]);if(!m.trips.includes(tr[0]))m.trips.push(tr[0]);
  let t=`You went on a ${tr[0].toLowerCase()}.`;if(chance(.15)){const f=person('friend',clamp(m.age+ri(-6,6),16,90),{bond:ri(45,65)});S.people.push(f);t+=` You met ${f.first} along the way.`;}L(t,'g');toast(t);checkAch();render();};
H.crime=d=>{const m=M(),c=CRIMES.find(x=>x.id===d.id);if(!spend(1))return;sAdd('karma',c.k);
  if(chance(catchP(c))){if(m.age<18){alive(['mother','father']).forEach(p=>p.bond=clamp(p.bond-12));const t='The police caught you and drove you home. Your parents were furious.';L(t,'b');toast(t);render();return;}
    S.queue.push({id:'court',ctx:{crime:{shoplift:'shoplifting',pickpocket:'theft',burglary:'burglary',scam:'securities fraud',heist:'armed robbery'}[c.id],y:c.y}});render();showEvent();return;}
  const x=ri(...c.loot);m.cash+=x;sAdd('stress',4);const t=`You got away with it and made ${money(x)}.`;L(t,'m');toast(t);render();};
H.crew=()=>{const m=M();if(!spend(1))return;if(m.job)L(`You quit your job as ${JOBS[m.job.id].titles[m.job.level]}.`);m.job={id:'crew',level:0,perf:50,years:0,yil:0,raise:1,asked:0};sAdd('karma',-8);const t='You were jumped into the Ninefold Crew as a runner.';L(t,'b');toast(t);render();};
H.gamble=d=>{const m=M(),a=+d.amt;if(m.cash<a)return;if(chance(.46)){m.cash+=a;toast(`You won ${money(a)}.`);if(a>=1e4)L(`You won ${money(a)} at the blackjack table.`,'m');}else{m.cash-=a;toast(`You lost ${money(a)}.`);if(a>=1e4)L(`You lost ${money(a)} at the blackjack table.`,'b');}render();};
H.newlife=()=>openNewLife();
H.startlife=()=>{const o={first:$('#nl-first').value,last:$('#nl-last').value,g:$('#nl-g').value,city:$('#nl-city').value,bg:$('#nl-bg').value,keep:{history:S.history,ach:S.ach}};
  newLife(o);closeModal();UI.tab='life';render();};
H.heir=d=>continueAs(d.id);

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=H[el.dataset.a];if(f)f(el.dataset,el);});

let tT;function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(tT);tT=setTimeout(()=>el.hidden=true,2600);}

/* ================= save / boot ================= */
const KEY='life-unlimited-v1';
function save(){S.nid=NID;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.v===1&&s.me)return s;}catch(e){}return null;}
function start(data){const s=(data&&data.S)||load();if(s){S=s;NID=s.nid||1000;}else newLife();
  try{const t=localStorage.getItem('lu-tab');if(t&&TABS.some(x=>x[0]===t))UI.tab=t;}catch(e){}
  render();if(!M().alive)showDeath();else if(S.queue.length)showEvent();}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
