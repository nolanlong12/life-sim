<title>Life Unlimited</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: a single mobile-first app column (max 680px) with a navy top bar, card stack in the middle, and a docked time bar + 5-tab bottom nav. The character creator is a separate full-screen flow with a live preview card. */
:root{
  --bg:#E8F2FF; --bg2:#FFF5E8; --card:#FFFFFF; --card2:#F3F7FF; --ink:#1B2A4A; --muted:#61709A; --line:#DDE6F5;
  --blue:#2F6BFF; --blue-soft:#E3ECFF; --mint:#13AE86; --mint-soft:#DBF6EE; --coral:#F25555; --coral-soft:#FFE5E2;
  --sun:#F0A400; --sun-soft:#FFF1D2; --violet:#7556F5; --violet-soft:#ECE6FF; --teal:#0E9FB0; --teal-soft:#DBF3F6;
  --navy:#14234D; --navy2:#1F3370; --on:#FFFFFF; --av:#D7E6FF; --shadow:0 6px 22px rgba(27,42,74,.08);
  --display:'Baloo 2','Nunito',ui-rounded,system-ui,sans-serif;
  --body:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  --fs:15px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1630; --bg2:#141B33; --card:#172241; --card2:#1C294D; --ink:#EAF0FF; --muted:#9EABCF; --line:#28365C;
  --blue:#7096FF; --blue-soft:#1F2D57; --mint:#3BD7AC; --mint-soft:#143F3A; --coral:#FF7E7E; --coral-soft:#462432;
  --sun:#FFC94D; --sun-soft:#43391F; --violet:#A28BFF; --violet-soft:#2E2758; --teal:#3FCDDC; --teal-soft:#16404A;
  --navy:#0A1226; --navy2:#16224A; --on:#0D1630; --av:#25386B; --shadow:0 6px 22px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1630; --bg2:#141B33; --card:#172241; --card2:#1C294D; --ink:#EAF0FF; --muted:#9EABCF; --line:#28365C;
  --blue:#7096FF; --blue-soft:#1F2D57; --mint:#3BD7AC; --mint-soft:#143F3A; --coral:#FF7E7E; --coral-soft:#462432;
  --sun:#FFC94D; --sun-soft:#43391F; --violet:#A28BFF; --violet-soft:#2E2758; --teal:#3FCDDC; --teal-soft:#16404A;
  --navy:#0A1226; --navy2:#16224A; --on:#0D1630; --av:#25386B; --shadow:0 6px 22px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:var(--fs)}
body{background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed;background-color:var(--bg);color:var(--ink);font:1rem/1.45 var(--body);font-weight:600;-webkit-font-smoothing:antialiased;min-height:100%}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance;font-weight:800}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.reduce *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* colors for icon chips */
.c-blue{--c:var(--blue);--cs:var(--blue-soft)}.c-mint{--c:var(--mint);--cs:var(--mint-soft)}.c-coral{--c:var(--coral);--cs:var(--coral-soft)}
.c-sun{--c:var(--sun);--cs:var(--sun-soft)}.c-violet{--c:var(--violet);--cs:var(--violet-soft)}.c-teal{--c:var(--teal);--cs:var(--teal-soft)}
.ic{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--cs);color:var(--c)}
.ic svg{width:22px;height:22px}
.ic.sm{width:34px;height:34px;border-radius:11px}.ic.sm svg{width:18px;height:18px}
svg.i{width:20px;height:20px;flex:none}

/* app shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--navy);color:#fff;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--navy)}
.top-in{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font:800 22px/1 var(--display);letter-spacing:-.01em}
.logo b{color:#FFC94D}
.logo svg{width:26px;height:26px;color:#FFC94D}
.top .pill{background:rgba(255,255,255,.12);border:0;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;color:#fff;display:flex;align-items:center;gap:6px;cursor:pointer}
.top .pill svg{width:16px;height:16px}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 170px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.pad{padding:16px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sh h2{font-size:20px}
.sh .link{background:none;border:0;color:var(--blue);font-weight:800;font-size:14px;cursor:pointer;padding:4px}
.back{display:flex;align-items:center;gap:6px;background:none;border:0;color:var(--blue);font-weight:800;cursor:pointer;padding:2px 0;font-size:15px}
.back svg{width:18px;height:18px}
.pagehead{display:flex;flex-direction:column;gap:4px}
.pagehead h1{font-size:28px}

/* profile */
.profile{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:16px}
.avatar{width:84px;height:84px;border-radius:50%;overflow:hidden;border:3px solid var(--card);box-shadow:0 0 0 3px var(--blue-soft);grid-row:span 2}
.avatar svg,.av svg{width:100%;height:100%;display:block}
.profile h1{font-size:24px}
.profile .meta{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.profile .meta svg{width:14px;height:14px}
.nw{text-align:right}
.nw b{display:block;font:800 24px/1 var(--display);color:var(--mint)}
.nw b.neg{color:var(--coral)}
.nw span{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;grid-column:2/-1}
.chip{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--cs,var(--card2));color:var(--c,var(--muted))}
@media (max-width:460px){.profile{grid-template-columns:auto minmax(0,1fr)}.avatar{width:68px;height:68px}.nw{grid-column:1/-1;text-align:left;display:flex;align-items:baseline;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}.chips{grid-column:1/-1}}

/* stat meters */
.meters{display:flex;flex-direction:column;gap:10px}
.meter{display:grid;grid-template-columns:22px 92px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:14px}
.meter svg{width:20px;height:20px;color:var(--c)}
.meter .v{text-align:right;color:var(--muted);font-size:13px}
.track{height:10px;border-radius:10px;background:var(--card2);overflow:hidden}
.track i{display:block;height:100%;border-radius:10px;background:var(--c,var(--blue));transition:width .5s ease}
.track.thin{height:7px}

/* grids & rows */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:minmax(0,1fr)}}
.tile{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%}
.tile:hover{border-color:var(--c,var(--blue))}
.tile .t{font-weight:800;font-size:15px}
.tile .d{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.3}
.tile .tx{min-width:0;flex:1}
.tile .chev{width:18px;height:18px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .tx{flex:1;min-width:0}
.row .t{font-weight:800}
.row .d{font-size:13px;color:var(--muted);font-weight:600;margin-top:1px}
.row .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:520px){.row{flex-wrap:wrap}.row .r{width:100%;justify-content:flex-start;padding-left:46px}.row>.av+.tx~.r{padding-left:56px}}
.av{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none;background:var(--av)}
.cost{font-size:12px;color:var(--muted);font-weight:800;white-space:nowrap;display:flex;align-items:center;gap:3px}
.cost .dot{color:var(--blue);letter-spacing:-1px}
.empty{color:var(--muted);font-size:14px;padding:8px 0;font-weight:600}
.note{color:var(--muted);font-size:13.5px;font-weight:600;margin-bottom:6px}
.req{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.req span{font-size:11px;font-weight:800;padding:2px 7px;border-radius:7px;background:var(--mint-soft);color:var(--mint)}
.req span.no{background:var(--coral-soft);color:var(--coral)}

/* buttons */
.btn{border:0;background:var(--blue-soft);color:var(--blue);border-radius:12px;padding:8px 14px;font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){filter:brightness(.96)}
.btn.pri{background:var(--blue);color:var(--on)}
.btn.danger{background:var(--coral-soft);color:var(--coral)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.big{padding:13px 20px;font-size:16px;border-radius:16px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.star{background:none;border:0;cursor:pointer;color:var(--line);padding:4px;display:grid}
.star svg{width:18px;height:18px}
.star.on{color:var(--sun)}.star.on svg{fill:currentColor}
button:focus-visible,input:focus-visible,select:focus-visible,.tile:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--card2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:var(--card);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-weight:800;font-size:14px;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on)}

/* happening */
.happen{display:flex;gap:14px;align-items:flex-start;padding:16px;background:linear-gradient(135deg,var(--blue-soft),var(--card));}
.happen h3{font-size:18px}
.happen p{color:var(--muted);font-size:14px;margin-top:2px}
.happen .btn{margin-top:10px}
.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.quick::-webkit-scrollbar{display:none}
.qa{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;border-radius:14px;background:var(--card);border:1px solid var(--line);cursor:pointer;font-weight:800;font-size:13.5px}
.qa .ic{width:30px;height:30px;border-radius:10px}.qa .ic svg{width:16px;height:16px}
.qa:disabled{opacity:.45;cursor:not-allowed}

/* timeline */
.tl{display:flex;flex-direction:column}
.chapter{font:800 12px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--violet);padding:12px 0 6px;display:flex;align-items:center;gap:8px}
.chapter::after{content:"";flex:1;height:1px;background:var(--line)}
.yr{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;padding:8px 0}
.yr .age{font:800 20px/1 var(--display);color:var(--blue);text-align:center;background:var(--blue-soft);border-radius:12px;padding:8px 0 6px;align-self:start}
.yr .age small{display:block;font:700 10px/1.2 var(--body);color:var(--muted);margin-top:2px}
.yr ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.yr li{font-size:14px;font-weight:600;padding-left:14px;position:relative}
.yr li::before{content:"";position:absolute;left:0;top:.5em;width:7px;height:7px;border-radius:50%;background:var(--line)}
.yr li.g::before{background:var(--mint)}.yr li.b::before{background:var(--coral)}.yr li.m::before{background:var(--sun)}.yr li.a::before{background:var(--violet)}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(27,42,74,.06);
  padding:8px max(12px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(12px,env(safe-area-inset-left,0px))}
.dock-in{max-width:680px;margin:0 auto}
.timebar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 4px 8px}
.pips{display:flex;gap:5px;flex-wrap:wrap}
.pips i{width:13px;height:13px;border-radius:50%;border:2px solid var(--blue)}
.pips i.full{background:var(--blue)}
.timebar small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.ageup{border:0;background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;border-radius:16px;padding:11px 20px;font:800 18px/1 var(--display);cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;box-shadow:0 6px 16px rgba(47,107,255,.3)}
.ageup small{font:800 12px var(--body);opacity:.85}
.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);padding:6px 0 8px}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer;padding:4px 0;position:relative}
.nav button svg{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--blue)}
.nav .badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--coral);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}

/* modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,16,34,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.modal{align-items:center}}
.sheet{background:var(--card);border-radius:24px;width:min(520px,100%);max-height:88vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px;animation:rise .25s ease;position:relative}
@keyframes rise{from{transform:translateY(16px);opacity:.5}to{transform:none;opacity:1}}
.sheet h2{font-size:25px}
.sheet .lead{font-size:16px;font-weight:600}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;border:0;background:var(--blue);color:var(--on);border-radius:16px;padding:13px 16px;font-weight:800;cursor:pointer;font-size:15px}
.choice small{display:block;font-weight:600;opacity:.85;margin-top:2px;font-size:12.5px}
.choice.alt{background:var(--card2);color:var(--ink)}
.choice:hover:not(:disabled){filter:brightness(1.07)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.result{padding:14px 16px;border-radius:16px;background:var(--card2);font-size:16px;border-left:5px solid var(--blue)}
.result.g{border-left-color:var(--mint)}.result.b{border-left-color:var(--coral)}.result.m{border-left-color:var(--sun)}.result.a{border-left-color:var(--violet)}
.deltas{display:flex;flex-wrap:wrap;gap:6px}
.dl{font-size:12.5px;font-weight:900;padding:4px 9px;border-radius:999px;background:var(--mint-soft);color:var(--mint)}
.dl.neg{background:var(--coral-soft);color:var(--coral)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.cele{text-align:center;align-items:center;overflow:hidden}
.cele .ic{width:72px;height:72px;border-radius:24px}.cele .ic svg{width:38px;height:38px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:3px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(560px) rotate(540deg);opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--navy);color:#fff;padding:12px 16px;border-radius:16px;font-size:14px;max-width:min(520px,calc(100% - 32px));box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:8px}
.toast .deltas .dl{background:rgba(255,255,255,.14);color:#7CF0C8}.toast .deltas .dl.neg{color:#FFB0B0}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:800;color:var(--muted);min-width:0}
.field input[type=text],.field input[type=number],.field select,.search input{font-size:15px;font-weight:700;color:var(--ink);background:var(--card2);border:2px solid transparent;border-radius:12px;padding:10px 12px;min-width:0;width:100%}
.field input:focus,.field select:focus,.search input:focus{border-color:var(--blue);outline:none}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:460px){.form{grid-template-columns:minmax(0,1fr)}}
.inrow{display:flex;gap:6px}
.inrow input{flex:1}
.dice{border:0;background:var(--violet-soft);color:var(--violet);border-radius:12px;width:44px;display:grid;place-items:center;cursor:pointer;flex:none}
.dice svg{width:18px;height:18px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:7px 12px;font-weight:800;font-size:13.5px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt svg{width:14px;height:14px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--blue)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search input{padding-left:38px;background:var(--card);border:1px solid var(--line)}
input[type=range]{width:100%;accent-color:var(--blue)}
.slider{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px 10px;align-items:center}
.slider .lab{font-size:13px;font-weight:800;color:var(--muted)}
.slider .lab:nth-child(2){text-align:right}
.slider .lab.on{color:var(--blue)}
.slider input{grid-column:1/-1}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:10px;border:0;background:var(--blue-soft);color:var(--blue);font-weight:900;font-size:18px;cursor:pointer;display:grid;place-items:center}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper b{min-width:30px;text-align:center;font-size:16px}
.info{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px;display:inline-grid}
.info svg{width:15px;height:15px}
.explain{font-size:13px;color:var(--muted);font-weight:600;background:var(--card2);border-radius:10px;padding:8px 10px;margin-top:6px}

.topact{display:flex;gap:6px;align-items:center;flex:none}
.top .pill{white-space:nowrap}
.skrow .btn{padding:7px 12px;font-size:13px;min-height:0}
.top .pill.new{background:#FFC94D;color:#1a2340}
@media (max-width:400px){.logo{font-size:17px}.logo svg{width:22px;height:22px}.top .pill{padding:6px 10px}}
#pips b{font-family:var(--display);font-size:17px}
.skrow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.skrow:last-child{border-bottom:0}
.skhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.skbar{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.skbar i{display:block;height:100%;border-radius:999px;transition:width .4s}

function sAdd(k,d){const m=S.me;if(!d)return;
  if(d>0&&ATTRK.includes(k)){let mult=1;const ts=[m.talent,m.talent2].filter(Boolean);
    if(ts.some(t=>TALENTS[t]&&TALENTS[t].st.includes(k)))mult+=.5;if(ts.includes('none'))mult+=.1;d*=mult;}
  if(DIM<1&&k!=='karma'&&((d>0&&k!=='stress')||(d<0&&k==='stress')))d*=DIM;
  if(k==='stress'&&d>0)d*=1.3-(m.s.resilience/100)*.6;
  if(k==='happy'&&d<0)d*=1.25-(m.s.resilience/100)*.5;

function L(text,tone='n'){let y=S.log[S.log.length-1];if(!y||y.age!==S.me.age){y={age:S.me.age,year:S.year,lines:[]};S.log.push(y);}y.lines.push({t:text,c:tone});}
function chapter(age){return age<13?'Childhood':age<18?'Teen years':age<30?'Young adulthood':age<60?'Career years':'Golden years';}
function reputation(){const m=M(),f=fame(),k=m.s.karma;
  if(m.record>=2||(m.job&&m.job.id==='crew'&&m.job.level>=2))return ['Feared','coral'];
  if((m.flags.scandals||0)>=2||(f>40&&k<35))return ['Controversial','sun'];
  if(f>=40&&k>=55)return ['Loved','coral'];
  if(k>=68||(m.job&&m.job.level>=2&&k>=45))return ['Respected','mint'];
  if(f>=20)return ['Known','blue'];return ['Unknown','violet'];}

const CR_STEPS=['Mode','Identity','Appearance','Abilities','Personality','Talent','Family','Goals','Summary'];
function defaultPers(){return Object.fromEntries(PERS.map(p=>[p[0],50]));}
function randomStats(mode){const md=MODES[mode];const st={};
  if(md.free){ATTRK.forEach(k=>st[k]=ri(30,80));return st;}
  ATTRK.forEach(k=>st[k]=md.avg);
  for(let i=0;i<260;i++){const a=pick(ATTRK),b=pick(ATTRK);const n=ri(1,4);if(a!==b&&st[a]+n<=md.max-5&&st[b]-n>=12){st[a]+=n;st[b]-=n;}}return st;}
function randomPers(){const p=defaultPers();PERS.forEach(([k])=>p[k]=ri(38,62));const ks=[...PERS].sort(()=>rand()-.5).slice(0,ri(2,3));ks.forEach(([k])=>p[k]=chance(.5)?ri(80,95):ri(5,20));return p;}
function rerollFamily(c){const md=c.mode;const f=c.fam||{};
  f.wealth=md==='rags'?'poor':md==='privileged'?wpick([['wealthy',75],['ultra',25]]):wpick([['poor',18],['working',30],['middle',36],['wealthy',13],['ultra',3]]);
  f.famous=md==='privileged'?(chance(.25)?1:0):chance(.04)?1:0;
  f.env=md==='rags'?pick(['supportive','strict','unstable','complicated']):wpick([['supportive',40],['strict',25],['complicated',22],['unstable',13]]);
  f.sibs=wpick([[0,30],[1,35],[2,22],[3,9],[4,4]]);f.order=f.sibs?pick(['oldest','middle','youngest']):'only';
  f.rep=wpick([['respected',20],['unknown',70],['notorious',10]]);f.conn=['wealthy','ultra'].includes(f.wealth)?1:chance(.1)?1:0;
  f.expect=md==='privileged'?pick(['academic','business','fambiz']):chance(.35)?pick(['academic','business','creative','athletic']):'none';
  f.biz=f.expect==='fambiz'||chance(.12)?pick(['truck','cafe','rest','build','apparel']):'';
  f.secret=chance(.35)?1:0;f.momJob=pick(PJOBS[f.wealth]);f.dadJob=pick(PJOBS[f.wealth]);if(f.famous)f[chance(.5)?'momJob':'dadJob']=pick(PJOBS.famous);
  c.fam=f;}
function newCR(mode='normal'){const g=wpick([['f',47],['m',47],['x',6]]);const ci=ri(0,CITIES.length-1);
  const c={step:0,mode,first:nameFor(g),middle:chance(.6)?nameFor(g==='x'?pick(['m','f']):g):'',last:pick(LN),nick:'',g,pron:g==='m'?'he/him':g==='f'?'she/her':'they/them',
    bm:ri(1,12),bd:ri(1,28),age:0,city:ci,env:wpick([['city',45],['suburb',30],['town',15],['rural',10]]),cit2:'',langs:[...CLANG[CITIES[ci].c]],
    ap:randAp(g),st:randomStats(mode),pers:randomPers(),talent:chance(.3)?'none':pick(Object.keys(TALENTS)),talent2:'',money:0,goals:[]};
  rerollFamily(c);return c;}
function crBudget(){const md=MODES[CR.mode];return md.free?null:md.avg*ATTRK.length;}
function crLeft(){const b=crBudget();return b==null?null:b-ATTRK.reduce((t,k)=>t+CR.st[k],0);}
function crFixStats(){const md=MODES[CR.mode];if(md.free)return;ATTRK.forEach(k=>CR.st[k]=clamp(CR.st[k],10,md.max));
  let left=crLeft();let guard=0;while(left<0&&guard++<2000){const k=ATTRK.reduce((a,b)=>CR.st[a]>=CR.st[b]?a:b);CR.st[k]--;left++;}}
function crExtremes(){return PERS.filter(([k])=>CR.pers[k]>=80||CR.pers[k]<=20).length;}

function crInsights(c){const st=Object.entries(c.st).sort((a,b)=>b[1]-a[1]);const top=st.slice(0,3).map(x=>x[0]),low=st.slice(-2).map(x=>x[0]);const f=c.fam;
  const adv=[`Strong ${STATN[top[0]].toLowerCase()} and ${STATN[top[1]].toLowerCase()}`];
  if(c.talent!=='none')adv.push(`${TALENTS[c.talent].n} talent: ${TALENTS[c.talent].d[1].toLowerCase()}`);
  if(['wealthy','ultra'].includes(f.wealth))adv.push('Money and comfort from day one');if(f.env==='supportive')adv.push('A family that has your back');
  if(f.conn)adv.push('Family connections open job doors');if(f.famous)adv.push('A famous name gets you noticed');if(f.biz)adv.push('A family business you could inherit');
  if(c.mode==='rags')adv.push('Hardship builds resilience');
  const chal=[`Lower ${STATN[low[0]].toLowerCase()} and ${STATN[low[1]].toLowerCase()}`];
  if(f.wealth==='poor')chal.push('Money will be tight growing up');if(f.env==='strict')chal.push('High expectations and rules at home');
  if(f.env==='unstable')chal.push('A chaotic home life adds stress');if(f.env==='complicated')chal.push('Family drama will come up');
  if(f.rep==='notorious')chal.push('Your family name raises eyebrows');if(f.expect!=='none')chal.push(`Pressure to ${EXPECT[f.expect]}`);
  if(c.talent==='criminal')chal.push('Trouble finds you more easily');if(['wealthy','ultra'].includes(f.wealth)&&c.mode==='privileged')chal.push('Inheritance disputes and family pressure');
  const G={smarts:'School could come easily, opening doors to medicine or law.',fitness:'Sports could become a real path if you train.',creativity:'A creative career is within reach.',
    looks:'Modeling and acting scouts may notice you.',biz:'You might build a business empire.',tech:'Tech careers are a natural fit.',charisma:'People listen to you; politics is an option.',
    street:'You can read a room, and a bad situation.',social:'You will collect friends wherever you go.',strength:'Physical work and sports suit you.',discipline:'Steady effort will carry you far.',
    confidence:'You will take shots other people pass on.',luck:'Good things may fall into your lap now and then.',resilience:'Setbacks will not keep you down for long.'};
  return {adv,chal,glimpse:`${G[top[0]]} ${G[top[1]]} None of it is guaranteed. What you do with it decides how it goes.`};}

  const keep={history:S?S.history:[],ach:S?S.ach:{}};NID=1;

  const me={first:c.first.trim()||nameFor(c.g),middle:c.middle.trim(),last:c.last.trim()||pick(LN),nick:c.nick.trim(),alive:true,g:c.g,pron:c.pron,bday:{m:+c.bm,d:+c.bd},

    s:{...st,health:ri(78,100),happy:f.env==='supportive'?ri(72,92):f.env==='unstable'?ri(45,65):ri(60,85),stress:f.env==='unstable'?20:f.env==='strict'?12:ri(0,8),karma:f.rep==='notorious'?42:50},

    born:START_YEAR-c.age,cash:['custom','sandbox'].includes(c.mode)?Math.max(0,+c.money||0):0,debt:0,edu:0,degrees:[],school:null,job:null,effort:'normal',study:'normal',
    followers:f.famous?ri(4e3,6e4):0,prison:0,record:0,retired:false,pension:0,trips:[],pets:[],flags:{},achs:[],pref:'any',
    goals:c.goals.map(id=>({id,done:0})),c:{held:[],earned:0,friends:0,dates:0,crimes:0,arrests:0,moves:0,biz:0,homes:0,kids:0,events:0},owned:[...FREE_OUTFITS]};
  S.me=me;
  if(f.secret)me.flags.secret=pick(SECRETS).id;
  const W=WEALTH[f.wealth].w;const momAge=ri(21,40)+me.age,dadAge=Math.round(clamp(momAge-me.age+ri(-3,6),20,55))+me.age;
  const pb=f.env==='supportive'?[78,96]:f.env==='strict'?[50,72]:f.env==='complicated'?[35,80]:[30,62];
  const mom=person('mother',momAge,{g:'f',last:chance(.6)?me.last:pick(LN),job:f.momJob,cash:ri(...W)/2,bond:ri(...pb),ap:randAp('f')});
  const dad=person('father',dadAge,{g:'m',last:me.last,job:f.dadJob,cash:ri(...W)/2,bond:ri(...pb),ap:randAp('m')});
  mom.ap.skin=clamp(me.ap.skin+ri(-1,1),0,7);dad.ap.skin=clamp(me.ap.skin+ri(-1,1),0,7);
  if(chance(.5))mom.ap.hairColor=me.ap.hairColor%8;else dad.ap.hairColor=me.ap.hairColor%8;
  S.people.push(mom,dad);

  const n=f.sibs||0;let older=0;if(f.order==='youngest')older=n;else if(f.order==='middle')older=Math.max(1,Math.floor(n/2));

    const g=pick(['m','f']);

    else S.pending.push({year:START_YEAR-age,g});}
  if(f.biz){const d=BIZ.find(b=>b.k===f.biz);S.famBiz={k:f.biz,name:`${me.last} ${d.w}`,owner:dad.id,loc:['wealthy','ultra'].includes(f.wealth)?ri(2,4):1};}
  if(me.age>=5&&me.age<18)me.school={stage:me.age<11?'elementary':me.age<14?'middle':'high',grade:ri(55,85),years:0};
  if(me.age>=18){me.edu=1;me.flags.schoolDone=1;}

  const sibs=alive('sibling');if(sibs.length)L(`Siblings: ${sibs.map(x=>`${x.first} (${x.age})`).join(', ')}.`);
  if(me.talent!=='none')L(`Everyone can already tell you have a gift: you're ${TALENTS[me.talent].n.toLowerCase()}.`,'g');
  if(f.famous)L(`Photographers waited outside the hospital. You already have ${me.followers.toLocaleString()} followers.`,'m');
  if(S.famBiz)L(`Your family runs ${S.famBiz.name}.`);
  if(me.age>=18)S.queue.push({id:'hs_grad',ctx:{}});
  L('Do as many activities as you like, then tap Age up to live the next year.');
  UI.view='home';UI.sub=null;}

function revealSecret(id){const m=M();delete m.flags.secret;
  if(id==='halfsib'){const g=pick(['m','f']);const s=person('sibling',clamp(m.age+ri(-6,6),1,80),{g,bond:ri(25,45)});S.people.push(s);return `Your half-${he(s,'brother','sister','sibling')} is named ${s.first}.`;}
  if(id==='trust'){const x=ri(2,50)*1e4;m.cash+=x;return `The trust holds ${money(x)}.`;}
  if(id==='star'){m.followers+=ri(2e3,2e4);sAdd('creativity',3);return 'A music blog wrote about your family history.';}
  if(id==='adopted'){sAdd('stress',6);sAdd('resilience',4);return 'It explained a lot, and changed nothing about who raised you.';}
  sAdd('resilience',4);return 'It explained some of the tension you remember.';}
function addSibling(bond){const mo=alive('mother')[0],da=alive('father')[0];const g=pick(['m','f']);const b=person('sibling',0,{g,last:M().last,bond,ap:randAp(g,[mo?mo.ap:randAp('f'),da?da.ap:randAp('m')])});S.people.push(b);return b;}
function takeFamBiz(){const f=S.famBiz;if(!f||f.taken)return;f.taken=1;const d=BIZ.find(b=>b.k===f.k);S.biz.push({id:NID++,k:f.k,name:f.name,value:d.cost*f.loc*.9,q:ri(50,70),loc:f.loc,years:ri(10,30),last:0});}
function celebrate(t,d,i='award',c='sun'){S.queue.push({id:'_cele',ctx:{t,d,i,c}});}

/* =========================================================
   people / crime / career helpers
   ========================================================= */
function sentence(y,crime){const m=M();m.prison=y;m.record++;m.c.arrests++;m.flags.jailed=1;m.job=null;m.school=null;if(m.age<18)m.flags.schoolDone=1;
  S.used=maxSlots();sAdd('happy',-20);sAdd('karma',-6);pAdd('optimistic',-3);const p=partner();if(p){p.bond=clamp(p.bond-20);if(chance(.35)){p.rel='ex';L(`${p.first} left you after the conviction.`,'b');}}
  return [`You were sentenced to ${plural(y,'year')} in prison for ${crime}.`,'b'];}
function divorce(p){const m=M();const loss=p.prenup?.1:.5;const take=Math.max(0,(m.cash+S.inv.sav)*loss);const fromCash=Math.min(m.cash,take);m.cash-=fromCash;S.inv.sav=Math.max(0,S.inv.sav-(take-fromCash));
  p.rel='ex';p.bond=15;sAdd('happy',-15);alive('child').forEach(k=>k.bond=clamp(k.bond-8));return [`You and ${p.first} divorced. ${p.prenup?'The prenup held up.':'You split everything down the middle.'}`,'b'];}
function bizById(id){return S.biz.find(b=>b.id===+id)||S.biz[0]||{name:'your business',value:0,q:50,k:'truck'};}
function BIZDEF(b){return BIZ.find(x=>x.k===b.k);}
function startJob(id){const m=M();m.job={id,level:0,perf:50,years:0,yil:0,raise:1,asked:0,lastInc:0,prevInc:0};if(!m.c.held.includes(id))m.c.held.push(id);m.retired=false;}
function salary(j){const d=JOBS[j.id];if(!d)return 0;if(j.id==='coach')return j.cs?j.cs.sal:0;if(j.id==='politics')return OFFICES[j.level].pay;if(d.special)return j.prevInc||0;
  let base=d.pay[Math.min(j.level,d.pay.length-1)];if(!d.fame&&j.id!=='crew'&&j.id!=='broadcast')base*=payM();
  let s=base*(1+.025*j.yil)*(j.raise||1);if(TECHJOBS.includes(j.id)&&hasT('technical'))s*=1.05;if(d.fame)s*=.6+fame()/100;if(M().age<18||M().school)s*=.45;return Math.round(s);}
function title(){const m=M();if(!m.alive)return 'Deceased';if(m.prison)return 'Inmate';if(sportLabel()&&(!m.job||m.sport.stage==='pro'))return sportLabel();if(m.job)return careerLabel()+(m.age<18||m.school?' (part-time)':'');
  if(m.school)return {elementary:'Elementary student',middle:'Middle schooler',high:'High schooler',college:`${m.school.major} student`,grad:`${m.school.prog} student`}[m.school.stage];
  if(m.retired)return 'Retired';if(S.biz.length)return 'Business owner';if(m.age<2)return 'Baby';if(m.age<5)return 'Toddler';if(m.age<18)return 'Kid';return 'Unemployed';}
function reqList(d){const m=M(),r=d.req,o=[];o.push({t:`Age ${r.age||20}+`,ok:m.age>=(r.age||20)});
  if(r.maxAge)o.push({t:`Age ${r.maxAge} or under`,ok:m.age<=r.maxAge});
  if(r.edu)o.push({t:['','High school','Bachelor’s'][r.edu],ok:m.edu>=r.edu});
  if(r.major){const ms=r.major.split('|');o.push({t:`${ms.length>2?ms.slice(0,2).join(', ')+' or similar':ms.join(' or ')} degree`,ok:m.degrees.some(x=>ms.includes(x.major))});}
  if(r.deg)o.push({t:DEGN[r.deg]||r.deg,ok:m.degrees.some(x=>x.type===r.deg)});
  if(r.sk)Object.entries(r.sk).forEach(([k,v])=>o.push({t:`${SK[k][0]} ${v}+`,ok:skv(k)>=v}));
  ATTRK.forEach(k=>{if(r[k])o.push({t:`${STATN[k]} ${r[k]}+`,ok:(k==='looks'?look():m.s[k])>=r[k]});});
  if(r.langs)o.push({t:`Speaks ${r.langs}+ languages`,ok:m.langs.length>=r.langs});
  if(r.followers)o.push({t:`${r.followers.toLocaleString()}+ followers`,ok:m.followers>=r.followers});
  if(r.clean)o.push({t:'Clean record',ok:!m.record});return o;}

/* =========================================================
   yearly simulation
   ========================================================= */
function econTick(){const E=S.econ,r=rand(),was=E.state;
  if(E.state==='stable'){if(r<.12)E.state='boom';else if(r<.22)E.state='recession';}else if(E.state==='boom'){if(r<.3)E.state='stable';else if(r<.4)E.state='recession';}else if(r<.45)E.state='stable';
  const ret=E.state==='boom'?rf(.08,.3):E.state==='stable'?rf(-.05,.17):rf(-.32,0);E.lastIdx=ret;E.idx*=1+ret;
  const c=Math.exp(rf(-.95,1))-1;E.lastCry=c;E.cry=Math.max(.05,E.cry*(1+c));
  E.rate=clamp((E.rate??5)+(E.state==='boom'?rf(0,.5):E.state==='recession'?-rf(.3,1):rf(-.3,.3)),1.5,9);E.prevHousing=E.housing;E.housing*=1+(E.state==='boom'?rf(.04,.12):E.state==='stable'?rf(0,.06):rf(-.12,-.02));
  if(was!==E.state&&M().age>=14)L(E.state==='recession'?'The economy slid into a recession.':E.state==='boom'?'The economy is booming.':'The economy steadied.','a');}
const earnB=n=>{S.me.cash+=n;S.led.inc+=n;S.me.c.earned+=Math.max(0,n);}, payB=n=>{S.me.cash-=n;S.led.exp+=n;};
const tax=g=>g*(g<3e4?.1:g<9e4?.2:g<3e5?.3:.37);
function schoolTick(){const m=M();if(m.prison)return;
  if(!m.school&&m.age===5&&!m.flags.schoolDone){m.school={stage:'elementary',grade:ri(55,85),years:0};L('You started elementary school.');return;}
  const sc=m.school;if(!sc)return;sc.years++;
  const eff={slack:-6,normal:1,hard:7}[m.study];sc.grade=Math.round(clamp(sc.grade+eff+(m.s.smarts-55)/10+(m.s.discipline-50)/15+(PV('serious')-50)/25+(hasT('academic')?2:0)+ri(-6,6)));
  sAdd('smarts',m.study==='hard'?ri(2,4):m.study==='normal'?ri(0,2):0);if(m.study==='hard')sAdd('stress',5);if(m.study==='slack')sAdd('happy',2);
  if(sc.stage==='elementary'&&m.age>=11){sc.stage='middle';L('You moved up to middle school.');}
  else if(sc.stage==='middle'&&m.age>=14){sc.stage='high';L('You started high school.');}
  else if(sc.stage==='high'&&m.age>=18){m.edu=Math.max(m.edu,1);m.flags.lastGrade=sc.grade;m.school=null;m.flags.schoolDone=1;L(`You graduated from high school${sc.grade>=90?' with honors':''}.`,'g');S.queue.push({id:'hs_grad',ctx:{}});}
  else if(sc.stage==='college'||sc.stage==='grad'){
    if(sc.cost>0)m.debt+=sc.cost;
    if(sc.grade<25&&chance(.5)){L(`You failed out of ${sc.stage==='college'?'college':sc.prog+' school'}.`,'b');m.school=null;sAdd('happy',-10);return;}

const CL_US=[['Volunteer Youth Coach','youth','asst',3e3],['Youth Head Coach','youth','head',8e3],['High School Assistant','hs','asst',12e3],['High School Coordinator','hs','coord',22e3],['High School Head Coach','hs','head',68e3],['College Graduate Assistant','college','asst',28e3],['College Position Coach','college','asst',150e3],['College Coordinator','college','coord',750e3],['Small-College Head Coach','college','head',900e3],['Major-College Head Coach','college','head',6e6],['Pro Assistant Coach','pro','asst',450e3],['Pro Coordinator','pro','coord',2e6],['Pro Head Coach','pro','head',9e6]];
const CL_INTL=[['Youth Academy Coach','youth','asst',22e3],['Academy Director','youth','head',60e3],['Lower-Division Assistant','pro','asst',80e3],['Lower-Division Manager','pro','head',300e3],['Top-Division Assistant','pro','asst',500e3],['Top-Division Manager','pro','head',4e6],['National Team Manager','nat','head',3e6]];
const CPAY={football:1,basketball:1,soccer:1,baseball:.6,hockey:.5,volleyball:.15,rugby:.25,cricket:.3};
const ladder=cs=>cs.intl?CL_INTL:CL_US;
const cAvg=()=>Math.round(['c_off','c_def','c_dev','c_rec','c_lead','c_game'].reduce((t,k)=>t+skv(k),0)/6);
function coachSpot(cs,lvl){const L_=ladder(cs)[lvl],D=SPORTS[cs.sp];const big=cs.intl?lvl>=4:lvl>=9;
  let team,tstr;if(L_[1]==='youth'){team=`${city().n} ${cs.intl?'Youth Academy':'Youth '+D.n}`;tstr=ri(40,62);}
  else if(L_[1]==='hs'){team=`${pick(CITIES.filter(c=>c.c===city().c)).n} High`;tstr=ri(35,72);}
  else if(L_[1]==='college'){const pool=COLLEGES.filter(c=>lvl>=9?c[1]>=80:lvl===8?c[1]<70:true);const c=pick(pool);team=c[0];tstr=Math.round(c[1]*.85+ri(-6,6));}
  else if(L_[1]==='nat'){team=`${M().nat} national team`;tstr=ri(55,85);}
  else{team=cs.intl&&lvl<4?`${pick(CITIES).n} ${pick(['Town','Rovers','United','Athletic'])}`:pick(cs.sp==='soccer'&&cs.intl?Object.values(SC_LEAGUES).flat():D.teams||['City Pros']);tstr=big?ri(50,88):ri(40,70);}
  return {lvl,title:L_[0],team,tstr,sal:Math.round(L_[3]*(CPAY[cs.sp]||.2)*rf(.85,1.2)/500)*500,yrs:L_[2]==='head'?ri(3,6):ri(1,3),expect:clamp(Math.round((tstr-30)/60*100),10,90),fac:ri(30,95),sec:ri(40,75)};}
function startCoach(spk,lvl,exPro){const m=M();const cs={sp:spk,intl:!usPath(),lvl:0,team:'',tstr:50,w:0,l:0,seasons:0,titles:[],sec:60,scheme:'balanced',intensity:'normal',recruit:'regional',staff:50,tree:[],unit:'off',sal:0,exPro:!!exPro};
  if(m.job)L(`You left your job as ${careerLabel()}.`);m.job={id:'coach',level:0,perf:50,years:0,yil:0,raise:1,asked:0,cs};if(!m.c.held.includes('coach'))m.c.held.push('coach');m.retired=false;
  hireCoach(cs,coachSpot(cs,Math.min(lvl||0,ladder(cs).length-1)));}
function hireCoach(cs,o){Object.assign(cs,{lvl:o.lvl,team:o.team,tstr:o.tstr,sal:o.sal,sec:o.sec||60,vac:null,since:S.year});M().job.level=o.lvl;const t=`You were hired as ${o.title} at ${o.team}.`;L(t,'g');note(t);}
function genCoachOffers(cs){const last=ladder(cs).length-1;const n=ri(1,3),out=[];for(let i=0;i<n;i++){const lvl=Math.min(last,cs.lvl+ri(1,3));out.push(coachSpot(cs,lvl));}return out;}
function genVacancies(cs){const last=ladder(cs).length-1;const out=[];for(let i=0;i<3;i++){const lvl=clamp(cs.lvl+ri(-1,2),0,last);const o=coachSpot(cs,lvl);o.req=12+lvl*6;o.applied=0;out.push(o);}cs.vac={y:S.year,list:out};}
function coachTick(){const m=M(),j=m.job;if(!j||j.id!=='coach'||m.prison||!j.cs)return;const cs=j.cs;j.years++;if(!cs.team){genVacancies(cs);return;}
  const Ld=ladder(cs)[cs.lvl],role=Ld[2],D=SPORTS[cs.sp];earnB(cs.sal-tax(cs.sal));
  const unitSk=role==='coord'?skv(cs.unit==='def'?'c_def':'c_off'):role==='asst'?skv('c_dev'):cAvg();
  ['c_dev','c_lead','c_game',cs.unit==='def'?'c_def':'c_off'].forEach(k=>skGain(k,role==='head'?2.5:1.8));if(['college','hs'].includes(Ld[1]))skGain('c_rec',1.5);
  const fit=cs.scheme==='off'?skv('c_off'):cs.scheme==='def'?skv('c_def'):(skv('c_off')+skv('c_def'))/2;
  const eff=((unitSk-50)/3+(fit-50)/8)*(role==='head'?1:role==='coord'?.55:.25)+(role==='head'?(cs.staff-50)/12:0)+({light:-1.5,normal:0,intense:2}[cs.intensity]);
  const g=Ld[1]==='pro'?D.games[2]:Ld[1]==='college'?D.games[1]:D.games[0];const exp=clamp((cs.tstr-30)/60,.1,.9);const [w,l]=recW(cs.tstr+eff,g);cs.w+=w;cs.l+=l;cs.seasons++;const pct=w/g;
  let line=`${cs.team}: ${w}-${l} with you as ${Ld[0]}.`;
  if(pct>=.75&&chance(.25+(cs.tstr+eff-60)/120)){const t=Ld[1]==='youth'?'league title':Ld[1]==='hs'?'state championship':Ld[1]==='college'?(cs.lvl>=9?'national championship':'conference championship'):Ld[1]==='nat'?(D.cup||'international tournament'):D.champ;
    cs.titles.push(`${S.year} ${t}`);line+=` Won the ${t}!`;if(role==='head'){m.flags.coachTitle=1;celebrate('Champions!',`Your team won the ${t}.`,'trophy','sun');}}
  if(role==='head'&&pct-exp>=.2){cs.titles.push(`${S.year} Coach of the Year`);line+=' Named Coach of the Year!';}
  if(cs.intensity==='intense'&&chance(.2)){line+=' Two players went down with injuries from brutal practices.';cs.tstr-=2;}
  cs.sec=Math.round(clamp(cs.sec+(pct-exp)*(role==='head'?70:30)+ri(-5,5)));
  cs.tstr=Math.round(clamp(cs.tstr+(['college','hs'].includes(Ld[1])&&role==='head'?(skv('c_rec')-50)/15+({local:-1,regional:0,national:1.5}[cs.recruit]):0)+(skv('c_dev')-50)/25+rf(-5,5),20,95));
  L(line,pct>=.6?'g':pct<.4?'b':'n');

const SLOTK='lu-slots';
function slotsMeta(){try{return JSON.parse(localStorage.getItem(SLOTK)||'null')||{active:null,list:[]};}catch(e){return {active:null,list:[]};}}

function slotInfo(id){const m=S.me;return {id,name:`${m.first} ${m.last}`,age:m.age,alive:m.alive,nw:Math.round(netWorth()),ap:m.ap,g:m.g,gen:S.gen,t:Date.now(),title:m.alive?title():'Deceased'};}
function loadActive(){const meta=slotsMeta();if(!meta.active)return null;try{const s=JSON.parse(localStorage.getItem('lu-slot-'+meta.active)||'null');if(s&&s.me){SLOT=meta.active;return migrate(s);}}catch(e){}return null;}
function openLives(){save();const meta=slotsMeta();modal(`<h2>Your lives</h2><p class="lead">Every life saves automatically. Switch between them anytime.</p>
  <div class="list">${meta.list.map(x=>`<div class="row"><div class="av">${portrait(x.ap,x.age,x.g,60)}</div><div class="tx"><div class="t">${esc(x.name)}${x.id===SLOT?' <span class="chip c-blue">Playing</span>':''}</div><div class="d">${x.alive?'Age '+x.age:'Died at '+x.age} · ${esc(x.title||'')} · ${money(x.nw)} · Gen ${x.gen}</div></div><div class="r">${x.id===SLOT?'':B('Play','slotplay',{id:x.id},{cls:'btn pri'})+B('Delete','slotdel',{id:x.id},{cls:'btn danger'})}</div></div>`).join('')}</div>
  <div class="btnrow">${B(icon('save')+'Save a copy','slotcopy',{},{cls:'btn'})}${B(icon('refresh')+'Start a new life','newlife',{ok:1},{cls:'btn pri'})}${closeBtn()}</div>`);}
H.lives=()=>openLives();
H.slotplay=d=>{save();try{const s=JSON.parse(localStorage.getItem('lu-slot-'+d.id)||'null');if(!s||!s.me)return toast('That save could not be loaded.');S=migrate(s);SLOT=d.id;NID=S.nid||1000;const meta=slotsMeta();meta.active=SLOT;slotsSave(meta);}catch(e){return toast('That save could not be loaded.');}
  closeModal();UI.view='home';UI.sub=null;render();window.scrollTo(0,0);if(!M().alive)showDeath();else if(S.queue.length)showEvent();};
