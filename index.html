<title>Life Unlimited</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: a single mobile-first app column (max 680px) with a navy top bar, card stack in the middle, and a docked time bar + 5-tab bottom nav. The character creator is a separate full-screen flow with a live preview card. */
:root{
  --bg:#E8F2FF; --bg2:#FFF5E8; --card:#FFFFFF; --card2:#F3F7FF; --ink:#1B2A4A; --muted:#61709A; --line:#DDE6F5;
  --blue:#2F6BFF; --blue-soft:#E3ECFF; --mint:#13AE86; --mint-soft:#DBF6EE; --coral:#F25555; --coral-soft:#FFE5E2;
  --sun:#F0A400; --sun-soft:#FFF1D2; --violet:#7556F5; --violet-soft:#ECE6FF; --teal:#0E9FB0; --teal-soft:#DBF3F6;
  --navy:#14234D; --navy2:#1F3370; --on:#FFFFFF; --av:#D7E6FF; --shadow:0 6px 22px rgba(27,42,74,.08);
  --display:'Baloo 2','Nunito',ui-rounded,system-ui,sans-serif;
  --body:'Nunito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  --fs:15px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1630; --bg2:#141B33; --card:#172241; --card2:#1C294D; --ink:#EAF0FF; --muted:#9EABCF; --line:#28365C;
  --blue:#7096FF; --blue-soft:#1F2D57; --mint:#3BD7AC; --mint-soft:#143F3A; --coral:#FF7E7E; --coral-soft:#462432;
  --sun:#FFC94D; --sun-soft:#43391F; --violet:#A28BFF; --violet-soft:#2E2758; --teal:#3FCDDC; --teal-soft:#16404A;
  --navy:#0A1226; --navy2:#16224A; --on:#0D1630; --av:#25386B; --shadow:0 6px 22px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1630; --bg2:#141B33; --card:#172241; --card2:#1C294D; --ink:#EAF0FF; --muted:#9EABCF; --line:#28365C;
  --blue:#7096FF; --blue-soft:#1F2D57; --mint:#3BD7AC; --mint-soft:#143F3A; --coral:#FF7E7E; --coral-soft:#462432;
  --sun:#FFC94D; --sun-soft:#43391F; --violet:#A28BFF; --violet-soft:#2E2758; --teal:#3FCDDC; --teal-soft:#16404A;
  --navy:#0A1226; --navy2:#16224A; --on:#0D1630; --av:#25386B; --shadow:0 6px 22px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:var(--fs)}
body{background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%) fixed;background-color:var(--bg);color:var(--ink);font:1rem/1.45 var(--body);font-weight:600;-webkit-font-smoothing:antialiased;min-height:100%}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance;font-weight:800}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.reduce *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* colors for icon chips */
.c-blue{--c:var(--blue);--cs:var(--blue-soft)}.c-mint{--c:var(--mint);--cs:var(--mint-soft)}.c-coral{--c:var(--coral);--cs:var(--coral-soft)}
.c-sun{--c:var(--sun);--cs:var(--sun-soft)}.c-violet{--c:var(--violet);--cs:var(--violet-soft)}.c-teal{--c:var(--teal);--cs:var(--teal-soft)}
.ic{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--cs);color:var(--c)}
.ic svg{width:22px;height:22px}
.ic.sm{width:34px;height:34px;border-radius:11px}.ic.sm svg{width:18px;height:18px}
svg.i{width:20px;height:20px;flex:none}

/* app shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--navy);color:#fff;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--navy)}
.top-in{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font:800 22px/1 var(--display);letter-spacing:-.01em}
.logo b{color:#FFC94D}
.logo svg{width:26px;height:26px;color:#FFC94D}
.top .pill{background:rgba(255,255,255,.12);border:0;border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;color:#fff;display:flex;align-items:center;gap:6px;cursor:pointer}
.top .pill svg{width:16px;height:16px}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 170px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.pad{padding:16px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sh h2{font-size:20px}
.sh .link{background:none;border:0;color:var(--blue);font-weight:800;font-size:14px;cursor:pointer;padding:4px}
.back{display:flex;align-items:center;gap:6px;background:none;border:0;color:var(--blue);font-weight:800;cursor:pointer;padding:2px 0;font-size:15px}
.back svg{width:18px;height:18px}
.pagehead{display:flex;flex-direction:column;gap:4px}
.pagehead h1{font-size:28px}

/* profile */
.profile{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:16px}
.avatar{width:84px;height:84px;border-radius:50%;overflow:hidden;border:3px solid var(--card);box-shadow:0 0 0 3px var(--blue-soft);grid-row:span 2}
.avatar svg,.av svg{width:100%;height:100%;display:block}
.profile h1{font-size:24px}
.profile .meta{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.profile .meta svg{width:14px;height:14px}
.nw{text-align:right}
.nw b{display:block;font:800 24px/1 var(--display);color:var(--mint)}
.nw b.neg{color:var(--coral)}
.nw span{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;grid-column:2/-1}
.chip{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--cs,var(--card2));color:var(--c,var(--muted))}
@media (max-width:460px){.profile{grid-template-columns:auto minmax(0,1fr)}.avatar{width:68px;height:68px}.nw{grid-column:1/-1;text-align:left;display:flex;align-items:baseline;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}.chips{grid-column:1/-1}}

/* stat meters */
.meters{display:flex;flex-direction:column;gap:10px}
.meter{display:grid;grid-template-columns:22px 92px minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:14px}
.meter svg{width:20px;height:20px;color:var(--c)}
.meter .v{text-align:right;color:var(--muted);font-size:13px}
.track{height:10px;border-radius:10px;background:var(--card2);overflow:hidden}
.track i{display:block;height:100%;border-radius:10px;background:var(--c,var(--blue));transition:width .5s ease}
.track.thin{height:7px}

/* grids & rows */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:minmax(0,1fr)}}
.tile{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%}
.tile:hover{border-color:var(--c,var(--blue))}
.tile .t{font-weight:800;font-size:15px}
.tile .d{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.3}
.tile .tx{min-width:0;flex:1}
.tile .chev{width:18px;height:18px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .tx{flex:1;min-width:0}
.row .t{font-weight:800}
.row .d{font-size:13px;color:var(--muted);font-weight:600;margin-top:1px}
.row .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:520px){.row{flex-wrap:wrap}.row .r{width:100%;justify-content:flex-start;padding-left:46px}.row>.av+.tx~.r{padding-left:56px}}
.av{width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none;background:var(--av)}
.cost{font-size:12px;color:var(--muted);font-weight:800;white-space:nowrap;display:flex;align-items:center;gap:3px}
.cost .dot{color:var(--blue);letter-spacing:-1px}
.empty{color:var(--muted);font-size:14px;padding:8px 0;font-weight:600}
.note{color:var(--muted);font-size:13.5px;font-weight:600;margin-bottom:6px}
.req{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.req span{font-size:11px;font-weight:800;padding:2px 7px;border-radius:7px;background:var(--mint-soft);color:var(--mint)}
.req span.no{background:var(--coral-soft);color:var(--coral)}

/* buttons */
.btn{border:0;background:var(--blue-soft);color:var(--blue);border-radius:12px;padding:8px 14px;font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){filter:brightness(.96)}
.btn.pri{background:var(--blue);color:var(--on)}
.btn.danger{background:var(--coral-soft);color:var(--coral)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.big{padding:13px 20px;font-size:16px;border-radius:16px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.star{background:none;border:0;cursor:pointer;color:var(--line);padding:4px;display:grid}
.star svg{width:18px;height:18px}
.star.on{color:var(--sun)}.star.on svg{fill:currentColor}
button:focus-visible,input:focus-visible,select:focus-visible,.tile:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--card2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:var(--card);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-weight:800;font-size:14px;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on)}

/* happening */
.happen{display:flex;gap:14px;align-items:flex-start;padding:16px;background:linear-gradient(135deg,var(--blue-soft),var(--card));}
.happen h3{font-size:18px}
.happen p{color:var(--muted);font-size:14px;margin-top:2px}
.happen .btn{margin-top:10px}
.quick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.quick::-webkit-scrollbar{display:none}
.qa{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;border-radius:14px;background:var(--card);border:1px solid var(--line);cursor:pointer;font-weight:800;font-size:13.5px}
.qa .ic{width:30px;height:30px;border-radius:10px}.qa .ic svg{width:16px;height:16px}
.qa:disabled{opacity:.45;cursor:not-allowed}

/* timeline */
.tl{display:flex;flex-direction:column}
.chapter{font:800 12px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--violet);padding:12px 0 6px;display:flex;align-items:center;gap:8px}
.chapter::after{content:"";flex:1;height:1px;background:var(--line)}
.yr{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;padding:8px 0}
.yr .age{font:800 20px/1 var(--display);color:var(--blue);text-align:center;background:var(--blue-soft);border-radius:12px;padding:8px 0 6px;align-self:start}
.yr .age small{display:block;font:700 10px/1.2 var(--body);color:var(--muted);margin-top:2px}
.yr ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.yr li{font-size:14px;font-weight:600;padding-left:14px;position:relative}
.yr li::before{content:"";position:absolute;left:0;top:.5em;width:7px;height:7px;border-radius:50%;background:var(--line)}
.yr li.g::before{background:var(--mint)}.yr li.b::before{background:var(--coral)}.yr li.m::before{background:var(--sun)}.yr li.a::before{background:var(--violet)}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(27,42,74,.06);
  padding:8px max(12px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(12px,env(safe-area-inset-left,0px))}
.dock-in{max-width:680px;margin:0 auto}
.timebar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 4px 8px}
.pips{display:flex;gap:5px;flex-wrap:wrap}
.pips i{width:13px;height:13px;border-radius:50%;border:2px solid var(--blue)}
.pips i.full{background:var(--blue)}
.timebar small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.ageup{border:0;background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;border-radius:16px;padding:11px 20px;font:800 18px/1 var(--display);cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;box-shadow:0 6px 16px rgba(47,107,255,.3)}
.ageup small{font:800 12px var(--body);opacity:.85}
.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);padding:6px 0 8px}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:800;color:var(--muted);cursor:pointer;padding:4px 0;position:relative}
.nav button svg{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--blue)}
.nav .badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--coral);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}

/* modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,16,34,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.modal{align-items:center}}
.sheet{background:var(--card);border-radius:24px;width:min(520px,100%);max-height:88vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:12px;animation:rise .25s ease;position:relative}
@keyframes rise{from{transform:translateY(16px);opacity:.5}to{transform:none;opacity:1}}
.sheet h2{font-size:25px}
.sheet .lead{font-size:16px;font-weight:600}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;border:0;background:var(--blue);color:var(--on);border-radius:16px;padding:13px 16px;font-weight:800;cursor:pointer;font-size:15px}
.choice small{display:block;font-weight:600;opacity:.85;margin-top:2px;font-size:12.5px}
.choice.alt{background:var(--card2);color:var(--ink)}
.choice:hover:not(:disabled){filter:brightness(1.07)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.result{padding:14px 16px;border-radius:16px;background:var(--card2);font-size:16px;border-left:5px solid var(--blue)}
.result.g{border-left-color:var(--mint)}.result.b{border-left-color:var(--coral)}.result.m{border-left-color:var(--sun)}.result.a{border-left-color:var(--violet)}
.deltas{display:flex;flex-wrap:wrap;gap:6px}
.dl{font-size:12.5px;font-weight:900;padding:4px 9px;border-radius:999px;background:var(--mint-soft);color:var(--mint)}
.dl.neg{background:var(--coral-soft);color:var(--coral)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.cele{text-align:center;align-items:center;overflow:hidden}
.cele .ic{width:72px;height:72px;border-radius:24px}.cele .ic svg{width:38px;height:38px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:3px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(560px) rotate(540deg);opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--navy);color:#fff;padding:12px 16px;border-radius:16px;font-size:14px;max-width:min(520px,calc(100% - 32px));box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:8px}
.toast .deltas .dl{background:rgba(255,255,255,.14);color:#7CF0C8}.toast .deltas .dl.neg{color:#FFB0B0}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:800;color:var(--muted);min-width:0}
.field input[type=text],.field input[type=number],.field select,.search input{font-size:15px;font-weight:700;color:var(--ink);background:var(--card2);border:2px solid transparent;border-radius:12px;padding:10px 12px;min-width:0;width:100%}
.field input:focus,.field select:focus,.search input:focus{border-color:var(--blue);outline:none}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:460px){.form{grid-template-columns:minmax(0,1fr)}}
.inrow{display:flex;gap:6px}
.inrow input{flex:1}
.dice{border:0;background:var(--violet-soft);color:var(--violet);border-radius:12px;width:44px;display:grid;place-items:center;cursor:pointer;flex:none}
.dice svg{width:18px;height:18px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:7px 12px;font-weight:800;font-size:13.5px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt svg{width:14px;height:14px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--blue)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search input{padding-left:38px;background:var(--card);border:1px solid var(--line)}
input[type=range]{width:100%;accent-color:var(--blue)}
.slider{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px 10px;align-items:center}
.slider .lab{font-size:13px;font-weight:800;color:var(--muted)}
.slider .lab:nth-child(2){text-align:right}
.slider .lab.on{color:var(--blue)}
.slider input{grid-column:1/-1}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:10px;border:0;background:var(--blue-soft);color:var(--blue);font-weight:900;font-size:18px;cursor:pointer;display:grid;place-items:center}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper b{min-width:30px;text-align:center;font-size:16px}
.info{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px;display:inline-grid}
.info svg{width:15px;height:15px}
.explain{font-size:13px;color:var(--muted);font-weight:600;background:var(--card2);border-radius:10px;padding:8px 10px;margin-top:6px}

/* creator */
.cr{min-height:100%;display:flex;flex-direction:column}
.cr-top{background:var(--navy);color:#fff;padding:12px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.cr-top-in{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.cr-top .row1{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.18)}
.progress i.on{background:#FFC94D}
.stepname{font-size:13px;font-weight:800;color:rgba(255,255,255,.75)}
.cr-body{flex:1;max-width:1000px;width:100%;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.cr-body{grid-template-columns:minmax(0,1fr)}}
.preview{position:sticky;top:12px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.preview .big{width:170px;height:170px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 5px var(--blue-soft);flex:none}
.preview .big svg{width:100%;height:100%;display:block}
.preview h2{font-size:22px}
.preview .facts{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
@media (max-width:820px){.preview{position:sticky;top:0;z-index:5;flex-direction:row;text-align:left;padding:10px 12px;border-radius:18px}.preview .big{width:68px;height:68px}.preview .pv-tx{min-width:0}.preview h2{font-size:18px}.preview .facts span:nth-child(n+3){display:none}}
.cr-step{display:flex;flex-direction:column;gap:14px;min-width:0}
.cr-step .card{padding:16px}
.cr-step h3{font-size:17px;margin-bottom:8px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.mode{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.mode[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.mode b{font-size:16px}
.mode span{font-size:13px;color:var(--muted);font-weight:600}
.attr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.attr:last-child{border-bottom:0}
.attr .nm{font-weight:800;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.attr .track{grid-column:1/-1}
.attr .explain{grid-column:1/-1;margin:0}
.points{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:16px;background:var(--sun-soft);color:var(--ink);font-weight:800}
.points b{font:800 22px/1 var(--display);color:var(--sun)}
.talents{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.talent{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.talent[aria-pressed="true"]{border-color:var(--c);background:var(--cs)}
.talent:disabled{opacity:.4;cursor:not-allowed}
.talent ul{margin:0;padding-left:16px;font-size:12.5px;color:var(--muted);font-weight:600}
.lock{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:800}
.lock svg{width:13px;height:13px}
.cr-foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cr-foot-in{max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;gap:10px;align-items:center}
.sumgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.sumgrid{grid-template-columns:minmax(0,1fr)}}
.bul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
.minirow{display:grid;grid-template-columns:120px minmax(0,1fr) 30px;gap:8px;align-items:center;font-size:13px}

/* family tree */
.tree{display:flex;flex-direction:column;align-items:center;gap:6px}
.gen{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:100%}
.node{display:flex;flex-direction:column;align-items:center;gap:4px;width:86px;text-align:center;font-size:12px;font-weight:800;background:none;border:0;cursor:pointer;color:var(--ink);padding:0}
.node .av{width:56px;height:56px;box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--line)}
.node.me .av{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--blue)}
.node.dead{opacity:.5}
.node span{font-weight:600;color:var(--muted);font-size:11px}
.genlab{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.vline{width:2px;height:14px;background:var(--line)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach div{padding:12px;border-radius:14px;background:var(--card2);font-size:12.5px;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:6px}
.ach div b{color:var(--ink);font-size:14px}
.ach div.got{background:var(--sun-soft)}
.ach div .ic{width:30px;height:30px;border-radius:10px}
.ach div:not(.got) .ic{filter:grayscale(1);opacity:.5}

function crInsights(c){const st=Object.entries(c.st).sort((a,b)=>b[1]-a[1]);const top=st.slice(0,3).map(x=>x[0]),low=st.slice(-2).map(x=>x[0]);const f=c.fam;
  const adv=[`Strong ${STATN[top[0]].toLowerCase()} and ${STATN[top[1]].toLowerCase()}`];
  if(c.talent!=='none')adv.push(`${TALENTS[c.talent].n} talent: ${TALENTS[c.talent].d[1].toLowerCase()}`);
  if(['wealthy','ultra'].includes(f.wealth))adv.push('Money and comfort from day one');if(f.env==='supportive')adv.push('A family that has your back');
  if(f.conn)adv.push('Family connections open job doors');if(f.famous)adv.push('A famous name gets you noticed');if(f.biz)adv.push('A family business you could inherit');
  if(c.mode==='rags')adv.push('Hardship builds resilience');
  const chal=[`Lower ${STATN[low[0]].toLowerCase()} and ${STATN[low[1]].toLowerCase()}`];
  if(f.wealth==='poor')chal.push('Money will be tight growing up');if(f.env==='strict')chal.push('High expectations and rules at home');
  if(f.env==='unstable')chal.push('A chaotic home life adds stress');if(f.env==='complicated')chal.push('Family drama will come up');
  if(f.rep==='notorious')chal.push('Your family name raises eyebrows');if(f.expect!=='none')chal.push(`Pressure to ${EXPECT[f.expect]}`);
  if(c.talent==='criminal')chal.push('Trouble finds you more easily');if(['wealthy','ultra'].includes(f.wealth)&&c.mode==='privileged')chal.push('Inheritance disputes and family pressure');
  const G={smarts:'School could come easily, opening doors to medicine or law.',fitness:'Sports could become a real path if you train.',creativity:'A creative career is within reach.',
    looks:'Modeling and acting scouts may notice you.',biz:'You might build a business empire.',tech:'Tech careers are a natural fit.',charisma:'People listen to you; politics is an option.',
    street:'You can read a room, and a bad situation.',social:'You will collect friends wherever you go.',strength:'Physical work and sports suit you.',discipline:'Steady effort will carry you far.',
    confidence:'You will take shots other people pass on.',luck:'Good things may fall into your lap now and then.',resilience:'Setbacks will not keep you down for long.'};
  return {adv,chal,glimpse:`${G[top[0]]} ${G[top[1]]} None of it is guaranteed. What you do with it decides how it goes.`};}

/* build a life from the creator */
function buildLife(c){
  const keep={history:S?S.history:[],ach:S?S.ach:{}};NID=1;
  const f=c.fam,ci=CITIES[c.city];
  S={v:2,gen:1,year:START_YEAR,me:null,people:[],assets:[],biz:[],inv:{sav:0,idx:0,cry:0},
    econ:{state:'stable',idx:100,cry:40,housing:1,lastIdx:0,lastCry:0},market:[],log:[],queue:[],used:0,led:{inc:0,exp:0},
    ach:keep.ach,history:keep.history,nid:1,pending:[],famBiz:null,favs:[],recent:[],lastYear:null};
  const st={...c.st};
  [c.talent,c.talent2].filter(Boolean).forEach(t=>TALENTS[t].st.forEach(k=>st[k]=clamp(st[k]+8)));
  if(c.ap.body==='athletic'){st.fitness=clamp(st.fitness+6);st.strength=clamp(st.strength+3);}
  if(c.mode==='rags')st.resilience=clamp(st.resilience+10);
  if(f.env==='strict')st.discipline=clamp(st.discipline+8);if(f.env==='unstable')st.resilience=clamp(st.resilience+8);if(f.env==='supportive')st.confidence=clamp(st.confidence+5);
  if(f.rep==='notorious')st.street=clamp(st.street+6);
  const me={first:c.first.trim()||nameFor(c.g),middle:c.middle.trim(),last:c.last.trim()||pick(LN),nick:c.nick.trim(),alive:true,g:c.g,pron:c.pron,bday:{m:+c.bm,d:+c.bd},
    age:+c.age,city:+c.city,env:c.env,nat:ci.c,cit:[ci.c,c.cit2].filter(Boolean),langs:c.langs.length?[...c.langs]:[...CLANG[ci.c]],ap:{...c.ap},
    s:{...st,health:ri(78,100),happy:f.env==='supportive'?ri(72,92):f.env==='unstable'?ri(45,65):ri(60,85),stress:f.env==='unstable'?20:f.env==='strict'?12:ri(0,8),karma:f.rep==='notorious'?42:50},
    pers:{...c.pers},talent:c.talent,talent2:c.talent2||'',mode:c.mode,bg:f.wealth,famousFam:f.famous?1:0,famEnv:f.env,rep:f.rep,conn:f.conn?1:0,expect:f.expect,
    born:START_YEAR-c.age,cash:['custom','sandbox'].includes(c.mode)?Math.max(0,+c.money||0):0,debt:0,edu:0,degrees:[],school:null,job:null,effort:'normal',study:'normal',
    followers:f.famous?ri(4e3,6e4):0,prison:0,record:0,retired:false,pension:0,trips:[],pets:[],flags:{},achs:[],pref:'any',
    goals:c.goals.map(id=>({id,done:0})),c:{held:[],earned:0,friends:0,dates:0,crimes:0,arrests:0,moves:0,biz:0,homes:0,kids:0,events:0},owned:[...FREE_OUTFITS]};
  S.me=me;
  if(f.secret)me.flags.secret=pick(SECRETS).id;
  const W=WEALTH[f.wealth].w;const momAge=ri(21,40)+me.age,dadAge=Math.round(clamp(momAge-me.age+ri(-3,6),20,55))+me.age;
  const pb=f.env==='supportive'?[78,96]:f.env==='strict'?[50,72]:f.env==='complicated'?[35,80]:[30,62];
  const mom=person('mother',momAge,{g:'f',last:chance(.6)?me.last:pick(LN),job:f.momJob,cash:ri(...W)/2,bond:ri(...pb),ap:randAp('f')});
  const dad=person('father',dadAge,{g:'m',last:me.last,job:f.dadJob,cash:ri(...W)/2,bond:ri(...pb),ap:randAp('m')});
  mom.ap.skin=clamp(me.ap.skin+ri(-1,1),0,7);dad.ap.skin=clamp(me.ap.skin+ri(-1,1),0,7);
  if(chance(.5))mom.ap.hairColor=me.ap.hairColor%8;else dad.ap.hairColor=me.ap.hairColor%8;
  S.people.push(mom,dad);
  me.flags.parentsMarried=f.env==='unstable'?(chance(.55)?1:0):chance(.82)?1:0;
  const n=f.sibs||0;let older=0;if(f.order==='youngest')older=n;else if(f.order==='middle')older=Math.max(1,Math.floor(n/2));
  for(let i=0;i<n;i++){const isOlder=i<older;const age=isOlder?me.age+ri(1,Math.max(1,Math.min(9,momAge-me.age-18))):me.age-ri(1,7);
    const g=pick(['m','f']);
    if(age>=0)S.people.push(person('sibling',age,{g,last:me.last,bond:ri(45,85),ap:randAp(g,[mom.ap,dad.ap])}));
    else S.pending.push({year:START_YEAR-age,g});}
  if(f.biz){const d=BIZ.find(b=>b.k===f.biz);S.famBiz={k:f.biz,name:`${me.last} ${d.w}`,owner:dad.id,loc:['wealthy','ultra'].includes(f.wealth)?ri(2,4):1};}
  if(me.age>=5&&me.age<18)me.school={stage:me.age<11?'elementary':me.age<14?'middle':'high',grade:ri(55,85),years:0};
  if(me.age>=18){me.edu=1;me.flags.schoolDone=1;}
  S.market=genMarket();
  L(`You were born in ${ci.n}, ${ci.r}, ${ci.c}${me.age?`, ${me.age} years ago`:''}.`,'a');
  L(`Your parents are ${mom.first} (${mom.job.toLowerCase()}) and ${dad.first} (${dad.job.toLowerCase()}). You grew up in a ${WEALTH[f.wealth].n.toLowerCase()}, ${FAMENV[f.env].n.toLowerCase()} family${me.env==='city'?'':' in the '+ENV[me.env].n.toLowerCase()}.`);
  const sibs=alive('sibling');if(sibs.length)L(`Siblings: ${sibs.map(x=>`${x.first} (${x.age})`).join(', ')}.`);
  if(me.talent!=='none')L(`Everyone can already tell you have a gift: you're ${TALENTS[me.talent].n.toLowerCase()}.`,'g');
  if(f.famous)L(`Photographers waited outside the hospital. You already have ${me.followers.toLocaleString()} followers.`,'m');
  if(S.famBiz)L(`Your family runs ${S.famBiz.name}.`);
  if(me.age>=18)S.queue.push({id:'hs_grad',ctx:{}});
  L('Spend your free time on activities, then tap Age up to live the next year.');
  UI.view='home';UI.sub=null;}

  E.prevHousing=E.housing;E.housing*=1+(E.state==='boom'?rf(.04,.12):E.state==='stable'?rf(0,.06):rf(-.12,-.02));

function diffs(a,b,withMoney=true){const out=[];SNAPK.forEach(k=>{const d=Math.round(b[k]-a[k]);if(d)out.push({k,d,label:`${d>0?'+':'−'}${Math.abs(d)} ${STATN[k]}`,neg:k==='stress'?d>0:d<0});});
  if(withMoney){const d=b.cash-a.cash;if(Math.abs(d)>=1)out.push({k:'cash',d,label:`${d>0?'+':''}${money(d)}`,neg:d<0});const f=b.followers-a.followers;if(f)out.push({k:'followers',d:f,label:`${f>0?'+':'−'}${Math.abs(f).toLocaleString()} followers`,neg:f<0});}
  return out;}
const chipsHTML=ds=>ds.length?`<div class="deltas">${ds.map(x=>`<span class="dl ${x.neg?'neg':''}">${esc(x.label)}</span>`).join('')}</div>`:'';

function ageUp(){const m=M();if(!m.alive){showDeath();return;}if(S.queue.length){showEvent();return;}
  const before=snap();const ch0=chapter(m.age);
  m.age++;S.year++;S.used=0;S.led={inc:0,exp:0};
  if(m.age===1)L('You took your first wobbly steps.','g');
  if(m.age===2)L(`Your first word was "${pick(['ball','no','dog','more','uh-oh','up'])}".`,'g');
  if(chapter(m.age)!==ch0)L(`A new chapter begins: ${chapter(m.age)}.`,'a');
  if(m.prison>0){m.prison--;if(!m.prison){L('You were released from prison. Time to rebuild.','g');sAdd('happy',10);}else L(`${plural(m.prison,'year')} left on your sentence.`,'b');}
  econTick();schoolTick();jobTick();bizTick();assetTick();financeTick();healthTick();peopleTick();
  if(m.followers>0){if(!m.job||!JOBS[m.job.id].req.fame)m.followers=Math.round(m.followers*rf(.88,1.02));
    if(m.followers>=1e4&&!m.prison){const sp=Math.round(m.followers*rf(.02,.06));earnB(sp);L(`Sponsored posts brought in ${money(sp)}.`,'m');}}
  if(m.age>=18&&(S.led.inc||S.led.exp))L(`Earned ${money(S.led.inc)} · spent ${money(S.led.exp)} on living costs and upkeep.`,'m');
  const yd=diffs(before,snap(),false).filter(x=>Math.abs(x.d)>=2);S.lastYear=yd;
  if(yd.length)L(`Over the year: ${yd.map(x=>x.label).join(', ')}.`);
  if(!deathCheck()){if(!m.prison)rollEvents();S.market=genMarket();}
  const y=S.log[S.log.length-1];if(m.alive&&(!y||y.age!==m.age))L(pick(['A quiet year.','Nothing much happened this year.','Life rolled on.']));
  checkAch();render();
  if(!m.alive)showDeath();else if(S.queue.length)showEvent();}
function rollEvents(){const m=M();
  const pool=Object.values(EV).filter(e=>!e.special&&m.age>=(e.min??0)&&m.age<=(e.max??200)&&!(e.once&&m.flags['ev_'+e.id])&&(!e.when||e.when()));
  let n=m.age<3?0:chance(.72)?1:0;if(chance(.22+(50-PV('cautious'))/500))n++;
  for(let i=0;i<n&&pool.length;i++){const e=wpick(pool.map(x=>[x,(x.w||1)*(x.wmul?x.wmul():1)]));pool.splice(pool.indexOf(e),1);const ctx=e.ctx?e.ctx():{};if(!ctx)continue;if(e.once)m.flags['ev_'+e.id]=1;S.queue.push({id:e.id,ctx});}}

/* death & legacy */
function die(cause){const m=M();m.alive=false;m.cause=cause;S.queue=[];
  L(`You died of ${cause} at age ${m.age}.`,'b');
  S.history.push({gen:S.gen,name:`${m.first} ${m.last}`,born:m.born,died:S.year,age:m.age,worth:Math.round(netWorth()),title:m.job?JOBS[m.job.id].titles[m.job.level]:(m.retired?'Retired':'Unemployed'),cause,score:legacyScore(),ap:m.ap,g:m.g});}
function legacyScore(){const m=M();const nw=netWorth();return Math.round(Math.max(0,Math.log10(Math.max(1,nw)))*8+alive('child').length*6+fame()/2+m.s.karma/2+m.achs.length*10+m.age/4+m.goals.filter(g=>g.done).length*12);}
function continueAs(cid){const old=M(),kid=P(cid);if(!kid)return;
  const heirs=alive('child');let estate=old.cash+S.inv.sav+idxVal()+cryVal()-old.debt;if(estate>0)estate*=.9;const share=Math.round(estate/heirs.length);
  const spouse=S.people.find(p=>p.alive&&p.rel==='spouse');const t=kid.st||{};
  const st={};ATTRK.forEach(k=>st[k]=Math.round(clamp(t[k]??45)));
  const pers={};PERS.forEach(([k])=>pers[k]=Math.round(clamp(((old.pers&&old.pers[k])??50)/2+25+ri(-15,15))));
  const nw=netWorth();
  const me={alive:true,first:kid.first,middle:'',last:kid.last,nick:'',g:kid.g,pron:kid.g==='m'?'he/him':kid.g==='f'?'she/her':'they/them',bday:{m:ri(1,12),d:ri(1,28)},
    age:kid.age,city:old.city,env:old.env,nat:CITIES[old.city].c,cit:[...old.cit],langs:[...old.langs],ap:{...kid.ap},
    s:{...st,health:t.health??90,happy:60,stress:30,karma:50},pers,talent:chance(.4)?'none':pick(Object.keys(TALENTS)),talent2:'',mode:old.mode,
    bg:nw>2e7?'ultra':nw>2e6?'wealthy':nw>2e5?'middle':'working',famousFam:fame()>=50?1:0,famEnv:'supportive',rep:'unknown',conn:nw>2e6?1:0,expect:'none',
    born:S.year-kid.age,cash:Math.max(0,share),debt:Math.max(0,-share),edu:kid.age>=22&&kid.edu?2:kid.age>=18?1:0,degrees:kid.age>=22&&kid.edu?[{type:'BA',major:pick(MAJORS)}]:[],
    school:null,job:null,effort:'normal',study:'normal',followers:Math.round(old.followers*.2),prison:0,record:0,retired:false,pension:0,trips:[],pets:[],
    flags:{movedOut:kid.age>=18?1:0,schoolDone:kid.age>=18?1:0},achs:[],pref:'any',goals:[],c:{held:[],earned:0,friends:0,dates:0,crimes:0,arrests:0,moves:0,biz:0,homes:0,kids:0,events:0},owned:[...FREE_OUTFITS]};
  if(!OUTFITS.find(o=>o.id===me.ap.outfit))me.ap.outfit='tee';
  if(kid.age>=5&&kid.age<18)me.school={stage:kid.age<11?'elementary':kid.age<14?'middle':'high',grade:ri(55,85),years:0};
  heirs.forEach(h=>{if(h!==kid){h.cash+=share;h.rel='sibling';}});
  const deadParent={...person(old.g==='m'?'father':'mother',old.age,{g:old.g==='x'?'m':old.g,first:old.first,last:old.last,ap:old.ap}),alive:false,died:S.year};
  const people=[deadParent];if(spouse){spouse.rel=spouse.g==='m'?'father':'mother';people.push(spouse);}
  heirs.filter(h=>h!==kid).forEach(h=>people.push(h));
  S.gen++;S.me=me;S.people=people;S.inv={sav:0,idx:0,cry:0};S.log=[];S.queue=[];S.used=0;S.assets.forEach(a=>a.home=false);S.pending=[];
  L(`You are ${me.first} ${me.last}, generation ${S.gen} of the ${old.last} family.`,'a');
  L(`${old.first} left an estate worth ${money(estate)}. Your share is ${money(share)}${S.assets.length||S.biz.length?', plus the family properties and businesses':''}.`,'m');
  if(me.talent!=='none')L(`You inherited a gift: you're ${TALENTS[me.talent].n.toLowerCase()}.`,'g');
  UI.view='home';UI.sub=null;checkAch();closeModal();render();}

function checkAch(){const m=M();
  for(const [id,n,d,i,c,f] of ACH){if(!S.ach[id]&&f(m)){S.ach[id]={who:`${m.first} ${m.last}`,age:m.age};m.achs.push(id);L(`Achievement unlocked: ${n}.`,'a');if(m.alive)celebrate(`Achievement: ${n}`,d+'.',i,c);}}
  for(const g of m.goals){if(!g.done){const G=GOALS.find(x=>x[0]===g.id);if(G&&G[4]()){g.done=S.year;sAdd('happy',15);L(`Goal complete: ${G[1]}.`,'a');if(m.alive)celebrate('Goal complete!',G[1]+'. You set out to do it, and you did.',G[2],G[3]);}}}
  if(S.people.some(p=>p.rel==='spouse'))m.flags.married=1;}

const tileBtn=(i,c,t,d,a,data)=>`<button class="tile c-${c}" data-a="${a}" ${Object.entries(data).map(([k,v])=>`data-${k}="${esc(v)}"`).join(' ')}>${ich(i,c)}<span class="tx"><span class="t" style="display:block">${t}</span><span class="d">${d}</span></span>${icon('right','chev')}</button>`;

function render(){if(!S||!S.me)return;if(S.me.cash<0){S.me.debt-=S.me.cash;S.me.cash=0;}
  const v=UI.view;const f={home:vHome,actions:vActions,explore:vExplore,assets:vAssets,more:vMore}[v]||vHome;

  else{const q=S.queue.length;const first=q?EV[S.queue[0].id]:null;const ft=first?(typeof first.title==='function'?first.title(S.queue[0].ctx):first.title):'';

function homeHint(){const m=M();if(m.age<5)return 'Play, read, and grow.';if(!m.goals.length&&m.age>=10)return 'Try setting a personal goal.';if(m.age>=18&&!m.job&&!m.school&&!S.biz.length)return 'Maybe look for a job?';if(m.s.stress>65)return 'You look stressed. Try meditating or a trip.';return 'Make it count.';}

  S.assets.push({id:NID++,kind:d.kind,sub:it[2],name:it[0],value:it[1]});sAdd('happy',d.kind==='car'?4:6);const t=`You bought a ${it[0].toLowerCase()}.`;L(t,'m');note(t);render();};
H.move=d=>{const m=M(),to=CITIES[+d.i],abroad=to.c!==city().c,c=abroad?8e3:3e3;if(m.cash<c||!spend(1))return;
  if(abroad&&!m.cit.includes(to.c)&&!chance(.3+m.edu*.12+(m.job?.1:0)+(netWorth()>5e5?.3:0)+((CLANG[to.c]||[]).some(l=>m.langs.includes(l))?.15:0))){m.cash-=500;const t=`Your visa application for ${to.c} was denied.`;L(t,'b');note(t);render();return;}
  m.cash-=c;const job=m.job;if(job&&!['athlete','actor','music','model','politics'].includes(job.id)&&chance(.5)){L('You left your job to move.');m.job=null;}
  if(m.job&&m.job.id==='politics'){m.job=null;L('You resigned from office to move.');}
  moveTo(+d.i);pAdd('independent',1);const t=`You moved to ${to.n}, ${to.c}.`;L(t,'a');note(t);checkAch();render();};
H.setenv=d=>{const m=M();if(m.env===d.v)return;if(m.cash<2000){toast('Moving neighborhoods costs $2K.');return;}if(!spend(1))return;m.cash-=2000;m.env=d.v;S.assets.forEach(a=>a.home=false);S.market=genMarket();const t=`You moved to the ${ENV[d.v].n.toLowerCase()} around ${city().n}.`;L(t,'a');note(t);render();};
H.trip=d=>{const m=M(),tr=TRIPS.find(x=>x[0]===d.n);if(!tr||m.cash<tr[1]||!spend(1))return;m.cash-=tr[1];sAdd('happy',tr[2]);sAdd('stress',-tr[2]);if(!m.trips.includes(tr[0]))m.trips.push(tr[0]);pAdd('independent',1);
  let t=`You went on a ${tr[0].toLowerCase()}.`;if(chance(.15+(m.s.social-50)/400)){const f=person('friend',clamp(m.age+ri(-6,6),16,90),{bond:ri(45,65)});S.people.push(f);m.c.friends++;t+=` You met ${f.first} along the way.`;}L(t,'g');note(t);checkAch();render();};
H.crime=d=>{const m=M(),c=CRIMES.find(x=>x.id===d.id);if(!c||!spend(1))return;sAdd('karma',c.k);pAdd('honest',-3);pAdd('kind',-1);pAdd('cautious',-1);m.c.crimes++;
  if(chance(catchP(c))){if(m.age<18){alive(['mother','father']).forEach(p=>p.bond=clamp(p.bond-12));const t='The police caught you and drove you home. Your parents were furious.';L(t,'b');note(t);render();return;}
    S.queue.push({id:'court',ctx:{crime:{shoplift:'shoplifting',pickpocket:'theft',burglary:'burglary',scam:'securities fraud',heist:'armed robbery'}[c.id],y:c.y}});render();showEvent();return;}
  const x=ri(...c.loot);m.cash+=x;sAdd('stress',4);sAdd('street',ri(1,3));const t=`You got away with it and made ${money(x)}.`;L(t,'m');note(t);render();};
H.crew=d=>{if(!d.ok){confirmIt('Join the Ninefold Crew?','Getting in is easy. Getting out clean is not.','crew',{},'Join');return;}closeModal();const m=M();if(!spend(1))return;if(m.job)L(`You quit your job as ${JOBS[m.job.id].titles[m.job.level]}.`);startJob('crew');sAdd('karma',-8);pAdd('honest',-3);const t='You were jumped into the Ninefold Crew as a runner.';L(t,'b');note(t);render();};
H.gamble=d=>{const m=M(),a=+d.amt;if(m.cash<a)return;pAdd('cautious',-1);if(chance(.46+luckB()/2)){m.cash+=a;note(`You won ${money(a)} at blackjack.`);if(a>=1e4)L(`You won ${money(a)} at the blackjack table.`,'m');}else{m.cash-=a;note(`You lost ${money(a)} at blackjack.`);if(a>=1e4)L(`You lost ${money(a)} at the blackjack table.`,'b');}render();};
H.buyoutfit=d=>{const m=M(),o=OUTFITS.find(x=>x.id===d.v);if(!o||m.cash<o.price)return;m.cash-=o.price;m.owned.push(o.id);m.ap.outfit=o.id;sAdd('confidence',2);const t=`You bought a ${o.n.toLowerCase()} and wore it out of the store.`;L(t,'m');note(t);render();};
H.wear=d=>{M().ap.outfit=d.v;render();};
H.makeover=()=>{const m=M();if(m.cash<400||!spend(1))return;m.cash-=400;sAdd('looks',ri(2,4));sAdd('confidence',ri(1,3));const t='A stylist gave you a fresh look.';L(t,'g');note(t);render();};
H.apset=d=>{const a=M().ap;let v=d.v;if(['skin','hairColor','eye'].includes(d.k))v=+v;if(d.k==='glasses')v=v==='true';a[d.k]=v;render();};
H.info=d=>{UI.info=UI.info===d.k?null:d.k;render();};
H.newlife=d=>{if(!d.ok&&M().alive){confirmIt('Start a new life?','This life ends here. Your achievements and family history stay.','newlife',{},'Start over');return;}closeModal();openCreator();};
H.erase=d=>{if(!d.ok){confirmIt('Erase everything?','Your life, achievements and family history will be deleted.','erase',{},'Erase');return;}closeModal();S=null;try{localStorage.removeItem(KEY);localStorage.removeItem('life-unlimited-v1');}catch(e){}openCreator();};
H.heir=d=>continueAs(d.id);
H.setsize=d=>{SET.size=d.v;applySettings();render();};H.setmotion=d=>{SET.motion=d.v==='true';applySettings();render();};H.settheme=d=>{SET.theme=d.v;applySettings();render();};

/* creator handlers */
H.crnav=d=>{const n=CR.step+ +d.d;if(n<0||n>=CR_STEPS.length)return;CR.step=n;renderCreator();window.scrollTo(0,0);};
H.crgoto=d=>{CR.step=+d.v;renderCreator();window.scrollTo(0,0);};
H.crmode=d=>{const keep={first:CR.first,middle:CR.middle,last:CR.last,nick:CR.nick,g:CR.g,pron:CR.pron,ap:CR.ap,city:CR.city,env:CR.env,langs:CR.langs,bm:CR.bm,bd:CR.bd,age:CR.age,pers:CR.pers,talent:CR.talent,goals:CR.goals};
  const step=CR.step;CR=newCR(d.v);Object.assign(CR,keep);CR.step=step;renderCreator();};
H.crset=d=>{let v=d.v;const cur=getPath(CR,d.k);if(typeof cur==='number')v=+v;
  setPath(CR,d.k,v);if(d.k==='fam.wealth'){CR.fam.momJob=pick(PJOBS[v]);CR.fam.dadJob=pick(PJOBS[v]);}
  if(d.k==='talent'&&CR.talent2===v)CR.talent2='';if(d.k==='fam.expect'&&v==='fambiz'&&!CR.fam.biz)CR.fam.biz='rest';renderCreator();};
H.crtog=d=>{setPath(CR,d.k,getPath(CR,d.k)?(d.k.startsWith('ap.')?false:0):(d.k.startsWith('ap.')?true:1));renderCreator();};
H.crlang=d=>{const l=CR.langs;if(l.includes(d.v))CR.langs=l.filter(x=>x!==d.v);else if(l.length<4)l.push(d.v);else{toast('You can pick up to four languages.');return;}renderCreator();};
H.crname=d=>{CR[d.k]=d.k==='first'?nameFor(CR.g):pick(LN);renderCreator();};
H.crstat=d=>{const md=MODES[CR.mode];const k=d.k,dd=+d.d;const nv=CR.st[k]+dd;if(nv<10||nv>md.max)return;if(dd>0&&crLeft()<=0)return;CR.st[k]=nv;renderCreator();};
H.crinfo=d=>{UI.crInfo=UI.crInfo===d.k?null:d.k;renderCreator();};
H.crstats=()=>{CR.st=randomStats(CR.mode);renderCreator();};
H.crpers=()=>{CR.pers=randomPers();renderCreator();};
H.crsib=d=>{CR.fam.sibs=clamp(CR.fam.sibs+ +d.d,0,4);CR.fam.order=CR.fam.sibs?(CR.fam.order==='only'?'youngest':CR.fam.order):'only';renderCreator();};
H.crfam=()=>{rerollFamily(CR);renderCreator();};
H.crgoal=d=>{if(CR.goals.includes(d.v))CR.goals=CR.goals.filter(x=>x!==d.v);else if(CR.goals.length<3)CR.goals.push(d.v);else{toast('Pick up to three goals.');return;}renderCreator();};
H.crrandom=()=>{const st=CR.step,mode=CR.mode;CR=newCR(mode);CR.step=st;renderCreator();};
H.crcancel=()=>closeCreator();
H.crsave=()=>{const ps=loadPresets();const name=[CR.first,CR.last].join(' ');ps.unshift({name,c:JSON.parse(JSON.stringify({...CR,step:0}))});savePresets(ps);toast(`Saved ${name} as a preset.`);};
H.crload=d=>{const p=loadPresets()[+d.i];if(!p)return;CR=JSON.parse(JSON.stringify(p.c));CR.step=CR_STEPS.length-1;renderCreator();};
H.crdelp=d=>{const ps=loadPresets();ps.splice(+d.i,1);savePresets(ps);renderCreator();};
H.crstart=()=>{if(!CR.first.trim()||!CR.last.trim()){toast('Give your character a first and last name.');CR.step=1;renderCreator();return;}
  crFixStats();buildLife(CR);CR=null;$('#creator').hidden=true;$('#app').hidden=false;render();window.scrollTo(0,0);if(S.queue.length)showEvent();};

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=H[el.dataset.a];if(!f)return;
  const live=!!(S&&S.me&&$('#creator').hidden);const before=live?snap():null;UI.note=null;
  f(el.dataset,el);
  if(live&&S&&S.me&&UI.note)toast(UI.note,diffs(before,snap()));
  if(S&&S.me&&$('#creator').hidden&&$('#modal').hidden&&S.queue.length&&M().alive)showEvent();});
document.addEventListener('input',e=>{const el=e.target;
  if(el.id==='actsearch'){UI.q=el.value;$('#searchres').innerHTML=searchHTML(UI.q);return;}
  if(el.dataset&&el.dataset.cr&&CR&&el.tagName==='INPUT'){let v=el.value;if(el.type==='range'||el.type==='number')v=+v;
    if(el.dataset.cr.startsWith('pers.')&&!MODES[CR.mode].free){const k=el.dataset.cr.slice(5);const was=CR.pers[k];const wasX=was>=80||was<=20,isX=v>=80||v<=20;
      if(isX&&!wasX&&crExtremes()>=3){v=v>=80?79:21;el.value=v;toast('Pick up to three defining traits. Ease another slider toward the middle first.');}}
    setPath(CR,el.dataset.cr,v);
    if(el.dataset.cr==='ap.height'){const hv=$('#cr-hv');if(hv)hv.textContent=v+' cm';}
    if(el.dataset.cr.startsWith('st.')){const b=el.parentElement.querySelector('b.num');if(b)b.textContent=v;}
    if(el.dataset.cr.startsWith('pers.')){const labs=el.parentElement.querySelectorAll('.lab');if(labs.length===2){labs[0].classList.toggle('on',v<=30);labs[1].classList.toggle('on',v>=70);}}
    crPrev();}});
document.addEventListener('change',e=>{const el=e.target;if(!(el.dataset&&el.dataset.cr&&CR&&el.tagName==='SELECT'))return;
  let v=el.value;const cur=getPath(CR,el.dataset.cr);if(typeof cur==='number')v=+v;setPath(CR,el.dataset.cr,v);
  if(el.dataset.cr==='city'){CR.langs=[...(CLANG[CITIES[v].c]||['English'])];if(CR.cit2===CITIES[v].c)CR.cit2='';}
  if(el.dataset.cr==='g'){CR.pron=v==='m'?'he/him':v==='f'?'she/her':'they/them';}
  if(el.dataset.cr==='fam.expect'&&v==='fambiz'&&!CR.fam.biz)CR.fam.biz='rest';
  renderCreator();});

let tT;function toast(t,ds){const el=$('#toast');el.innerHTML=`<span>${esc(t)}</span>${ds&&ds.length?chipsHTML(ds):''}`;el.hidden=false;clearTimeout(tT);tT=setTimeout(()=>el.hidden=true,3200);}

/* =========================================================
   save / load / settings / boot
   ========================================================= */
const KEY='life-unlimited-v2';
function save(){if(!S)return;S.nid=NID;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function saveUI(){try{localStorage.setItem('lu-ui',JSON.stringify({view:UI.view,sub:UI.sub,atab:UI.atab}));}catch(e){}}
function applySettings(){const r=document.documentElement;r.style.setProperty('--fs',{s:'14px',m:'15px',l:'17px'}[SET.size]||'15px');
  document.body.classList.toggle('reduce',!SET.motion);if(SET.theme==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',SET.theme);
  try{localStorage.setItem('lu-settings',JSON.stringify(SET));}catch(e){}}
function migrate(s){const m=s.me;s.v=2;
  if(m.bg==='famous'){m.bg='ultra';m.famousFam=1;}
  m.middle??='';m.nick??='';m.pron??=(m.g==='m'?'he/him':m.g==='f'?'she/her':'they/them');m.bday??={m:ri(1,12),d:ri(1,28)};m.env??='city';
  m.nat??=CITIES[m.city].c;m.cit??=[m.nat];m.langs??=[...(CLANG[m.nat]||['English'])];m.ap??=randAp(m.g);
  ATTRK.forEach(k=>{if(m.s[k]==null)m.s[k]=ri(35,60);});m.pers??=randomPers();m.talent??='none';m.talent2??='';m.mode??='normal';
  m.famEnv??='supportive';m.rep??='unknown';m.conn??=0;m.expect??='none';m.goals??=[];m.c??={held:m.job?[m.job.id]:[],earned:0,friends:0,dates:0,crimes:0,arrests:0,moves:0,biz:0,homes:0,kids:0,events:0};
  m.owned??=[...FREE_OUTFITS];m.famousFam??=0;m.flags??={};m.trips??=[];m.pets??=[];m.achs??=[];
  s.people.forEach(p=>{p.ap??=randAp(p.g);p.st??={};ATTRK.forEach(k=>{if(p.st[k]==null)p.st[k]=ri(30,70);});p.st.health??=80;});
  s.pending??=[];s.famBiz??=null;s.favs??=[];s.recent??=[];s.lastYear??=null;s.history??=[];s.ach??={};s.queue??=[];return s;}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.me)return migrate(s);}catch(e){}
  try{const s=JSON.parse(localStorage.getItem('life-unlimited-v1')||'null');if(s&&s.me)return migrate(s);}catch(e){}return null;}
function start(data){
  try{const st=JSON.parse(localStorage.getItem('lu-settings')||'null');if(st)SET={...SET,...st};}catch(e){}applySettings();
  const s=(data&&data.S)||load();
  try{const u=JSON.parse(localStorage.getItem('lu-ui')||'null');if(u){UI.view=u.view||'home';UI.sub=u.sub||null;UI.atab=u.atab||'money';}}catch(e){}
  if(s){S=s.v===2?s:migrate(s);NID=S.nid||1000;$('#app').hidden=false;render();if(!M().alive)showDeath();else if(S.queue.length)showEvent();}
  else openCreator();}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
